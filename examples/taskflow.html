.drop-zone.is-over { border-color: var(--select); box-shadow: var(--ring-accent); }
.drop-zone.has-file { border-style: solid; }
.drop-picked { display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: 4px 12px; margin-block-start: 8px; font-size: 14px; }
.drop-file { font-family: var(--mono); font-size: 13px; color: var(--ink); overflow-wrap: anywhere; }
.drop-size { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.import-field { display: grid; gap: 6px; margin-block-start: 6px; }
.lib-thumb { display: block; width: 100%; height: 64px; margin-block: 2px 4px; border-radius: var(--radius-sm); background: var(--canvas); box-shadow: inset 0 0 0 var(--hair) var(--line); }
.thumb-edge { stroke: var(--faint); stroke-width: 1; }
.thumb-box { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
.thumb-layer { --layer: var(--layer-clean); }
:root[data-style="playful"] .thumb-layer { --layer: var(--layer-fun); }
.thumb-bar { fill: var(--layer); }
/* Visual thumbnails: hairlines in the line colour, one mark in the accent. */
.thumb-ring, .thumb-arc { fill: none; stroke: var(--line); stroke-width: 1; }
.thumb-ring.is-accent { stroke: var(--accent); }
.thumb-dot { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
.thumb-dot.is-accent { fill: var(--accent); stroke: var(--accent); }
.thumb-mark { fill: var(--accent); }
.thumb-line { fill: var(--line); }
.thumb-cell { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
.thumb-cell.is-head { fill: var(--canvas); }
.tag-imported { margin-inline-start: 8px; }

/* ---- kit.css ---- */
/* The design kit page (template/js/gallery.js). */

/* ---------- Kit gallery ---------- */
.kit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 132px), 1fr)); gap: 12px; }
.kit-grid-wide { grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); }
.kit-icon { display: grid; justify-items: center; gap: 10px; padding: 18px 12px 14px; text-align: center; }
.kit-icon svg { width: 28px; height: 28px; color: var(--ink); }
.kit-icon code, .kit-swatch code, .kit-pattern code { font-size: 12px; color: var(--muted); }
.kit-swatch { display: grid; gap: 4px; padding: 14px; }
.kit-swatch p { font-size: 13px; color: var(--muted); }
.kit-chip { height: 44px; margin-block-end: 8px; border-radius: var(--radius-sm); box-shadow: inset 0 0 0 var(--hair) var(--line); }
.kit-layer { display: grid; gap: 12px; padding: 16px; }
.kit-stack { display: grid; gap: 20px; padding: var(--card-pad); }
.kit-pattern { display: grid; gap: 8px; align-content: start; padding: 16px 20px; }
.kit-pattern h3 { font-size: 17px; font-weight: 500; }
.kit-pattern p { font-size: 15px; color: var(--body); }
.kit-logo { display: grid; place-items: center; padding: 32px; }
.kit-logo svg { width: 96px; height: 96px; }
.kit-credit { font-size: 14px; color: var(--muted); max-width: 60ch; }
.kit-section { display: grid; gap: var(--grid-gap); padding-block-start: 48px; }
.kit-section > header { display: grid; gap: 8px; max-width: 46em; }
.kit-section h2 { font-size: clamp(24px, 2.6vw, 30px); line-height: 1.1; letter-spacing: -0.045em; }
.kit-section > header p { color: var(--body); }
.kit-stack > .seg { justify-self: start; }

/* ---- playful.css ---- */
/* ================================================================
   Playful style: the original look (inspired by Duolingo's design
   language; not affiliated). Same layout and components; only the
   tokens, type and the pressable edge change. data-style="playful".
   ================================================================ */
:root[data-style="playful"] {
  color-scheme: light;
  --canvas: #ffffff; --surface: #ffffff; --line: #e5e5e5; --ink: #3c3c3c; --body: #4b4b4b;
  --muted: #757575; --quiet: #afafaf; --faint: #afafaf;
  --accent: #58cc02; --accent-fill: #3e8500; --accent-hover: #367400; --accent-edge: #2e6400; --accent-text: #3c7d00;
  --on-accent: #ffffff; --good: #3c7d00; --bad: #cc3333; --good-wash: #d7ffb8; --bad-wash: #ffdfe0;
  --heading: #042c60; --display: #58a700; --link: #1479b8;
  --select: #1cb0f6; --select-wash: #ddf4ff; --nav-current-bg: #ddf4ff;
  --hover-tint: rgb(0 0 0 / 0.04); --bar-glass: rgb(255 255 255 / 0.9);
  --code-bg: #000437; --mark-bg: #d7ffb8; --hint-bg: #ffffff; --hint-ring: #e5e5e5; --hint-ink: #757575; --code-ring: 0 0 0 0 transparent; --code-ink: #e8ecff; --code-kw: #a5ed6e; --code-cm: #8a90c2; --code-st: #ffd66b;
  --hair: 2px; --radius: 12px; --radius-sm: 8px;
  --sans: "Nunito", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --body-weight: 500; --body-tracking: 0.02em; --heading-weight: 800; --tracking-label: 0.06em;
  /* Pressable edge: a 2px border with a 4px bottom, drawn as unblurred rings. */
  --ring: 0 0 0 2px var(--line), 0 2px 0 2px var(--line);
  --ring-strong: 0 0 0 2px var(--faint), 0 2px 0 2px var(--faint);
  --ring-ink: 0 0 0 2px var(--select), 0 2px 0 2px var(--select);
  --ring-accent: 0 0 0 2px var(--select), 0 2px 0 2px var(--select);
  --nav-current-ring: inset 0 0 0 2px var(--select);
  --primary-ring: 0 0 0 2px var(--accent-edge), 0 2px 0 2px var(--accent-edge);
}
@media (prefers-color-scheme: dark) {
  :root[data-style="playful"]:not([data-theme="light"]) {
    color-scheme: dark;
    --canvas: #131f24; --surface: #202f36; --line: #37464f; --ink: #f1f7fb; --body: #dce6ec;
    --muted: #a7bac4; --quiet: #8fa3ad; --faint: #52656d;
    --accent: #93d333; --accent-fill: #93d333; --accent-hover: #a5ed6e; --accent-edge: #79b933; --accent-text: #93d333;
    --on-accent: #131f24; --good: #93d333; --bad: #ff7878; --good-wash: #2b4022; --bad-wash: #4a2a2e;
    --heading: #f1f7fb; --display: #93d333; --link: #49c0f8;
    --select: #49c0f8; --select-wash: #1a3a4a; --nav-current-bg: #1a3a4a;
    --hover-tint: rgb(255 255 255 / 0.06); --bar-glass: rgb(19 31 36 / 0.88);
    --code-bg: #0b1418; --mark-bg: #2b4022; --hint-bg: #202f36; --hint-ring: #37464f; --hint-ink: #a7bac4;
  }
}
:root[data-style="playful"][data-theme="dark"] {
  color-scheme: dark;
  --canvas: #131f24; --surface: #202f36; --line: #37464f; --ink: #f1f7fb; --body: #dce6ec;
  --muted: #a7bac4; --quiet: #8fa3ad; --faint: #52656d;
  --accent: #93d333; --accent-fill: #93d333; --accent-hover: #a5ed6e; --accent-edge: #79b933; --accent-text: #93d333;
  --on-accent: #131f24; --good: #93d333; --bad: #ff7878; --good-wash: #2b4022; --bad-wash: #4a2a2e;
  --heading: #f1f7fb; --display: #93d333; --link: #49c0f8;
  --select: #49c0f8; --select-wash: #1a3a4a; --nav-current-bg: #1a3a4a;
  --hover-tint: rgb(255 255 255 / 0.06); --bar-glass: rgb(19 31 36 / 0.88);
  --code-bg: #0b1418; --mark-bg: #2b4022; --hint-bg: #202f36; --hint-ring: #37464f; --hint-ink: #a7bac4;
}
:root[data-style="playful"] .map-col, :root[data-style="playful"] .layer-dot, :root[data-style="playful"] .kit-layer { --layer: var(--layer-fun); }

/* Type: Nunito, heavy headings, labels in the body face. */
:root[data-style="playful"] :is(.eyebrow, .panel-bar, .side-label, .step-count, .tag, .top-row, .glance-grid dt, .map-col-head, .map-legend, .detail-label, .er-row-head) {
  font-family: var(--sans); font-weight: 800;
}
:root[data-style="playful"] :is(.view-head h1, .ov-head h1) { color: var(--display); font-weight: 900; letter-spacing: -0.02em; }
:root[data-style="playful"] :is(h2, h3, .card-title, .next-title, .pager-title, .flow-pick-title, .result-title, .row-title, .prog-done, .glance-grid dd, .score b, .node-label, .entity-name, .side-repo b) {
  font-weight: 800; letter-spacing: -0.01em;
}
:root[data-style="playful"] .links a { font-weight: 700; }
:root[data-style="playful"] .link, :root[data-style="playful"] .panel-bar a { font-weight: 800; text-decoration: none; }
:root[data-style="playful"] .tag { padding: 0 8px; }
:root[data-style="playful"] .brand .name { font-family: var(--sans); font-weight: 900; font-size: 17px; letter-spacing: -0.01em; color: var(--accent-text); }

/* Buttons: uppercase, heavy, pressable. The 4px bottom collapses on press. */

// ---------- Page context (library builds) ----------
// The library context is optional: missing, broken or unfilled means standalone.

  if (!raw || raw === '__CONTEXT__') return {};
  try {
    const parsed = JSON.parse(raw);
    return parsed && typeof parsed === 'object' && !Array.isArray(parsed) ? parsed : {};
  } catch (error) {
    return {};

// A relative link (../../index.html) or an http(s) one. No other schemes.
// A link from the build (library, kit): resolved against this page, and
// kept only when it lands on http(s), or on a file next to this file page.
function safeHref(value) {
  if (typeof value !== 'string') return null;
  const trimmed = value.trim();
  if (!trimmed || UNSAFE_URL_CHARS.test(trimmed) || trimmed.startsWith('//') || trimmed.startsWith('\\')) return null;

    url = new URL(trimmed, window.location.href);

  if (url.protocol === 'file:' && window.location.protocol === 'file:' && url.host === window.location.host) return trimmed;

// ---------- Dates ----------
// A date-only value (2026-11-17) is a calendar day: show that day wherever
// the reader is. A value with a time is a moment: show the reader's own day
// for it, so 2026-11-17T20:00Z reads Nov 18 in Manila.
const DATE_ONLY = /^\d{4}-\d{2}-\d{2}$/;

function displayDate(value, { year = true, fallback = '' } = {}) {
  if (value === undefined || value === null || value === '') return fallback;
  const raw = String(value).trim();
  const date = new Date(raw);
  if (Number.isNaN(date.getTime())) return fallback;
  const options = { month: 'short', day: 'numeric', ...(year ? { year: 'numeric' } : {}) };
  return date.toLocaleDateString(undefined, DATE_ONLY.test(raw) ? { ...options, timeZone: 'UTC' } : options);

// ---- truncate.js ----
// ---------- Long names: soft breaks, truncation and the "?" hint ----------
const SOFT_BREAK_MIN = 12;
// Tokens longer than this (in characters, so it is deterministic) are shown
// shortened in the middle with a "?" hint holding the full token.
const TOKEN_MAX = 24;

function breakToken(token) {
  const marked = token
    .replace(/([a-z])(?=[A-Z])/g, '$1\u0000')
    .replace(/([A-Z])(?=[A-Z][a-z])/g, '$1\u0000')
    .replace(/([/._\-:@])(?=[^\s/._\-:@])/g, '$1\u0000')
    .replace(/([A-Za-z])(?=\d)|(\d)(?=[A-Za-z])/g, '$1$2\u0000');
  // Never leave a piece under 3 characters on its own line ("Factory|B").
  const parts = marked.split('\u0000').reduce((acc, part) => {
    if (acc.length && (part.length < 3 || acc[acc.length - 1].length < 3)) return [...acc.slice(0, -1), acc[acc.length - 1] + part];
    return [...acc, part];
  }, []);
  return parts.flatMap((part, i) => (i ? [h('wbr'), part] : [part]));
}

// Keep both ends: "AbstractSingleton…Implementation", "packages/…/handler.ts",
// "@scope/…implementation".
function shortenToken(token) {
  const cut = (value, keepHead, keepTail) => `${value.slice(0, keepHead)}…${value.slice(value.length - keepTail)}`;
  if (token.includes('/')) {
    const parts = token.split('/').filter(Boolean);
    const first = parts[0].length > 16 ? `${parts[0].slice(0, 14)}…` : parts[0];
    const last = parts[parts.length - 1];
    const tail = last.length > 18 ? cut(last, 6, 10) : last;
    return parts.length > 1 ? `${first}/…/${tail}`.replace('…/…', '…') : cut(token, 12, 10);
  }
  const pieces = token.split(/(?<=[a-z])(?=[A-Z])|(?<=[A-Z])(?=[A-Z][a-z])|(?<=[._:-])/);
  if (pieces.length < 3) return cut(token, 12, 10);
  let head = '';
  let i = 0;
  while (i < pieces.length && head.length < 12) { head += pieces[i]; i += 1; }
  let tail = '';
  let j = pieces.length - 1;
  while (j >= i && tail.length < 10) { tail = pieces[j] + tail; j -= 1; }
  if (head.length > 18) head = head.slice(0, 16);
  if (tail.length > 16) tail = tail.slice(tail.length - 14);
  return head.length + tail.length + 1 < token.length ? `${head}…${tail}` : cut(token, 12, 10);
}

// The shortened token: visible short form (not read, not copied), the full
// token for screen readers and copy, and the hint.
function shortToken(token) {
  // The hidden full token goes first: as an out-of-flow box it can mark a
  // line break, and at the front that break never shows.
  return h('span', { class: 'token-short' },
    h('span', { class: 'sr-only token-full' }, token),
    h('span', { class: 'token-visible', 'aria-hidden': 'true' }, shortenToken(token).split('…').flatMap((part, i) => (i ? [h('wbr'), '…', ...breakToken(part)] : breakToken(part)))),
    tokenHint(token));
}

// Text with <wbr> at natural joints of long tokens: camelCase humps
// (fooBar, HTTPServer), after / . _ - : @, and between letters and digits.
// Tokens over TOKEN_MAX are shortened instead. overflow-wrap: anywhere in
// CSS stays only as the last resort.
function softBreaks(value) {
  return String(value ?? '').split(/(\s+)/).flatMap((token) => {
    if (token.length < SOFT_BREAK_MIN || /^\s+$/.test(token)) return [token];
    const core = token.match(/^([("'“‘[]*)(.*?)([)"'”’\].,;:!?]*)$/);
    const [, lead, body, trail] = core || ['', '', token, ''];
    if (body.length > TOKEN_MAX) return [lead, shortToken(body), trail].filter(Boolean);
    return [lead, ...breakToken(body), trail].filter((part) => part !== '');
  });
}

// Shorter forms of a path or slug, longest first: keep the first segment and
// the file name with its :line; for a plain slug keep the start and the end.
function middleForms(full) {
  const parts = full.split('/');
  if (parts.length > 2) {
    const tails = Array.from({ length: parts.length - 2 }, (_, i) => parts.slice(parts.length - 1 - (parts.length - 3 - i)).join('/'));
    return [...tails.map((tail) => `${parts[0]}/…/${tail}`), `…/${parts[parts.length - 1]}`];
  }
  const cuts = [];
  for (let keep = full.length - 4; keep > 8; keep -= Math.max(2, Math.round(keep / 8))) {
    const head = Math.ceil(keep * 0.4);
    cuts.push(`${full.slice(0, head)}…${full.slice(full.length - (keep - head))}`);
  }
  return cuts;
}

const TRUNC_SWEEP_EVERY = 200;
const TRUNC = { watched: new Set(), observer: null, tip: null, anchor: null, pinned: false, nestedWatch: null, nextSweep: TRUNC_SWEEP_EVERY };

function truncTip() {

  const tip = h('div', { class: 'trunc-tip', id: 'trunc-tip', role: 'tooltip', hidden: true });
  if (typeof tip.showPopover === 'function') tip.setAttribute('popover', 'manual');
  document.body.append(tip);
  document.addEventListener('keydown', (event) => { if (event.key === 'Escape') hideTip(); });
  document.addEventListener('pointerdown', (event) => {
    if (TRUNC.anchor && !TRUNC.anchor.contains(event.target)) hideTip();
  });
  window.addEventListener('scroll', () => { if (!TRUNC.pinned) hideTip(); }, { passive: true });

  return tip;
}

function showTip(anchor, full, pinned = false) {

  const width = Math.min(tip.offsetWidth, window.innerWidth - 16);
  const left = Math.min(Math.max(8, box.left + box.width / 2 - width / 2), window.innerWidth - width - 8);
  const below = box.bottom + 6 + tip.offsetHeight <= window.innerHeight - 8;

  TRUNC.anchor = null;
  TRUNC.pinned = false;

// The hint for a shortened token. It starts as a button; inside a link or
// button (known only once attached) it becomes a plain marker instead.
function tokenHint(full) {

    class: 'trunc-hint token-hint', type: 'button', 'aria-label': 'Show full name', 'aria-expanded': 'false', 'aria-describedby': 'trunc-tip',
  }, '?');
  wireHintButton(button, full);
  button.dataset.full = full;
  watchNestedHints();
  return button;
}

function wireHintButton(button, full) {
  button.addEventListener('mouseenter', () => showTip(button, full));
  button.addEventListener('mouseleave', () => { if (!TRUNC.pinned) hideTip(); });
  button.addEventListener('focus', () => showTip(button, full));
  button.addEventListener('blur', () => { if (!TRUNC.pinned) hideTip(); });
  button.addEventListener('click', (event) => {
    event.preventDefault();
    event.stopPropagation();
    if (TRUNC.anchor === button && TRUNC.pinned) hideTip(); else showTip(button, full, true);
  });

// A button inside a link or button is invalid: swap such token hints for
// plain markers as soon as they are attached.
function fixNestedHints(root) {
  const hints = root.matches && root.matches('button.token-hint') ? [root] : [...(root.querySelectorAll ? root.querySelectorAll('button.token-hint') : [])];
  hints.forEach((button) => {
    const host = button.parentElement && button.parentElement.closest('a, button, [role="button"], [role="radio"], [role="option"]');
    if (!host) return;
    const mark = h('span', { class: 'trunc-hint token-hint', 'aria-hidden': 'true' }, '?');
    const full = button.dataset.full;
    mark.addEventListener('mouseenter', () => showTip(mark, full));
    mark.addEventListener('mouseleave', () => { if (!TRUNC.pinned) hideTip(); });

function watchNestedHints() {
  if (TRUNC.nestedWatch || !('MutationObserver' in window)) return;
  TRUNC.nestedWatch = new MutationObserver((records) => records.forEach((record) => record.addedNodes.forEach((node) => {
    if (node.nodeType === 1) fixNestedHints(node);
  })));

// Inside a link or button a nested button is invalid, so the hint is a plain
// marker there, shown on hover and when the link itself has focus.
function truncHint(el, full) {
  const host = el.parentElement && el.parentElement.closest('a, button, [role="button"]');
  if (host) {
    const mark = h('span', { class: 'trunc-hint', 'aria-hidden': 'true' }, '?');
    mark.addEventListener('mouseenter', () => showTip(mark, full));
    mark.addEventListener('mouseleave', () => { if (!TRUNC.pinned) hideTip(); });
    host.addEventListener('focus', () => { if (mark.isConnected) showTip(mark, full); });
    host.addEventListener('blur', () => { if (TRUNC.anchor === mark) hideTip(); });
    return mark;
  }
  const button = h('button', {
    class: 'trunc-hint', type: 'button', 'aria-label': 'Show full name', 'aria-expanded': 'false', 'aria-describedby': 'trunc-tip',
  }, '?');

}

function isCut(el) {
  return el.scrollWidth > el.clientWidth || el.scrollHeight > el.clientHeight + 1;
}

// Exact width of the visible text against the content box: CSS ellipsis
// appears at any sub-pixel overflow, which rounded scrollWidth can miss.
function textFits(el, span) {
  const style = getComputedStyle(el);
  // Fractional widths: clientWidth rounds and would call an exact fit a cut.
  const room = el.getBoundingClientRect().width - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight)
    - parseFloat(style.borderLeftWidth) - parseFloat(style.borderRightWidth);
  // Ellipsis shows on any real overflow; a box sized to its text is equal.
  return span.getBoundingClientRect().width <= room + 0.05;
}

// Stop watching an element that left the page (a re-render replaced it), so
// the observer and the set do not keep old views alive.
function forgetTruncation(el) {

}

// Elements are made before they are attached: only one that has been on the
// page (state.seen) and is gone now is dropped.
function pruneTruncation() {
  TRUNC.watched.forEach((el) => { if (el.__trunc && el.__trunc.seen && !el.isConnected) forgetTruncation(el); });
}

function checkTruncation(el) {
  const state = el.__trunc;
  if (!state) return;
  if (!el.isConnected) {
    if (state.seen) forgetTruncation(el);
    return;
  }
  state.seen = true;
  if (!el.getClientRects().length) return;
  el.classList.remove('is-truncated');
  if (state.hint) state.hint.remove();
  if (state.mode === 'middle') state.visible.textContent = state.full;
  let cut = state.mode === 'middle' ? !textFits(el, state.visible) : isCut(el);
  if (cut) {
    el.classList.add('is-truncated');
    if (state.mode === 'middle') {
      const forms = middleForms(state.full);
      const fits = forms.find((form) => { state.visible.textContent = form; return textFits(el, state.visible); });
      if (!fits) state.visible.textContent = forms[forms.length - 1] || state.full;
    }
    cut = true;
    state.hint = state.hint || truncHint(el, state.full);
    el.append(state.hint);
  }

/**
 * Mark an element whose text may be cut (CSS ellipsis or line clamp, or
 * mode "middle" for paths). A "?" hint with the full text appears only while
 * the text is really cut.

function truncatable(el, full, { mode = 'end' } = {}) {
  const text = String(full ?? '');

    const visible = h('span', { class: 'trunc-visible', 'aria-hidden': 'true' }, text);
    fill(el, visible, h('span', { class: 'sr-only' }, text));

    TRUNC.observer = new ResizeObserver((entries) => entries.forEach((entry) => checkTruncation(entry.target)));

    if (document.fonts) {
      document.fonts.ready.then(recheckTruncation);
      document.fonts.addEventListener('loadingdone', recheckTruncation);

  // Sweep now and then, so long sessions of re-renders stay flat.
  if (TRUNC.watched.size >= TRUNC.nextSweep) {
    pruneTruncation();
    TRUNC.nextSweep = TRUNC.watched.size + TRUNC_SWEEP_EVERY;
  }
  TRUNC.watched.add(el);
  if (TRUNC.observer) TRUNC.observer.observe(el);
  return el;
}

// Re-check every watched element, for example after a style switch.
function recheckTruncation() {
  TRUNC.watched.forEach((el) => {
    if (el.isConnected) checkTruncation(el);
    else if (el.__trunc && el.__trunc.seen) forgetTruncation(el);
  });

// Break points only (no shortening), for text that wraps or is clamped.
function wordBreaks(value) {
  return String(value ?? '').split(/(\s+)/).flatMap((token) => (token.length < SOFT_BREAK_MIN || /^\s+$/.test(token) ? [token] : breakToken(token)));
}

// ---- theme.js ----
// The look: theme (system, light, dark), style (Clean, Playful), the
// switches that change them, and the credit that follows the style.
// ---------- Look: theme (system, light, dark) and style (clean, playful) ----------
// Shared by the explainer, the kit and the hub. Choices are per reader and
// live in localStorage; the page works when storage is blocked.
const THEME_KEY = 'concept-explainer:theme';
const STYLE_KEY = 'concept-explainer:style';
const THEME_CHOICES = [
  { choice: 'system', label: 'System' },
  { choice: 'light', label: 'Light' },
  { choice: 'dark', label: 'Dark' },
];
const STYLE_CHOICES = [
  { choice: 'clean', label: 'Clean' },
  { choice: 'playful', label: 'Playful' },
];
let pageDefaultStyle = 'clean';

function storedTheme() {
  const value = readStore(THEME_KEY);
  return THEME_CHOICES.some((t) => t.choice === value) ? value : 'system';
}

// "system" leaves data-theme off so the CSS media query decides.
function applyTheme(choice) {
  const root = document.documentElement;
  if (choice === 'light' || choice === 'dark') root.dataset.theme = choice;
  else delete root.dataset.theme;
}

// The page default comes from the build (context.style); a reader's own
// choice wins over it.
function setDefaultStyle(value) {
  pageDefaultStyle = value === 'playful' ? 'playful' : 'clean';
}

function storedStyle() {
  const value = readStore(STYLE_KEY);
  return STYLE_CHOICES.some((t) => t.choice === value) ? value : pageDefaultStyle;
}

function applyStyle(choice) {
  document.documentElement.dataset.style = choice === 'playful' ? 'playful' : 'clean';
}

function applyLook(context) {
  setDefaultStyle(context && context.style);
  applyTheme(storedTheme());
  applyStyle(storedStyle());
}

// One registry per page repaints every switch (sidebar and menu copies).
function themeRegistry() {
  const switches = [];
  const listeners = [];
  return {
    add: (entry) => switches.push(entry),
    onChange: (fn) => listeners.push(fn),
    paint: () => {
      switches.forEach(({ buttons, choices, read }) => {
        const picked = read();
        buttons.forEach((button, i) => {
          const on = choices[i].choice === picked;
          button.setAttribute('aria-checked', String(on));
          button.tabIndex = on ? 0 : -1;
        });
      });
    },
    changed: () => {
      listeners.forEach((fn) => fn());
      // A style switch changes fonts and paddings: re-measure cut text.
      if (typeof recheckTruncation === 'function') window.requestAnimationFrame(recheckTruncation);
    },
  };
}

// A radio group of buttons; arrow keys move and choose, one tab stop.
function choiceSwitch(registry, { choices, read, write, label, className, withIcons }) {
  const choose = (choice) => {
    write(choice);
    registry.paint();
    registry.changed();
  };
  const buttons = choices.map((option, index) => h('button', {
    class: 'ts-option', type: 'button', role: 'radio', 'data-label': option.label,
    'aria-label': withIcons ? `${option.label} ${label.toLowerCase()}` : null, title: withIcons ? `${option.label} ${label.toLowerCase()}` : null,
    onclick: () => choose(option.choice),
    onkeydown: (event) => {
      const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[event.key];
      if (!step) return;
      event.preventDefault();
      const next = (index + step + choices.length) % choices.length;
      choose(choices[next].choice);
      buttons[next].focus();
    },
  }, withIcons ? icon(option.choice) : option.label));
  registry.add({ buttons, choices, read });
  return h('div', { class: className, role: 'radiogroup', 'aria-label': label }, buttons);
}

function themeSwitch(registry) {
  return choiceSwitch(registry, {
    choices: THEME_CHOICES, read: storedTheme, label: 'Theme', className: 'theme-switch', withIcons: true,
    write: (choice) => { writeStore(THEME_KEY, choice); applyTheme(choice); },
  });
}

function styleSwitch(registry) {
  return choiceSwitch(registry, {
    choices: STYLE_CHOICES, read: storedStyle, label: 'Style', className: 'theme-switch style-switch', withIcons: false,
    write: (choice) => { writeStore(STYLE_KEY, choice); applyStyle(choice); },
  });
}

// ---- map.js ----
// Chapter: architecture map. Layers are columns, nodes are pressable cards,
// edges are an SVG overlay redrawn whenever the layout changes.
function mapRelated(edges, id) {
  return edges.filter((edge) => edge.from === id || edge.to === id);
}

// Selected node, its neighbours, and the lines between them.
function mapPaintSelection(canvas, grid, svg, edges, selectedId) {
  canvas.classList.toggle('has-selection', Boolean(selectedId));
  canvas.classList.remove('is-changes');
  const neighbours = new Set(selectedId ? mapRelated(edges, selectedId).flatMap((e) => [e.from, e.to]) : []);
  grid.querySelectorAll('.node').forEach((el) => {
    el.classList.toggle('is-selected', el.dataset.node === selectedId);
    el.classList.toggle('is-related', neighbours.has(el.dataset.node));
    el.setAttribute('aria-pressed', String(el.dataset.node === selectedId));
  });
  svg.querySelectorAll('[data-edge]').forEach((el) => {
    const [from, to] = el.dataset.edge.split('→');
    const active = from === selectedId || to === selectedId;
    el.querySelectorAll('path, text').forEach((part) => part.classList.toggle('is-active', active));
    el.querySelector('path').setAttribute('marker-end', active ? 'url(#map-arrow-active)' : 'url(#map-arrow)');
  });
}

function mapEmptyDetail() {
  return [h('div', { class: 'detail-main' },
    h('p', { class: 'eyebrow quiet' }, 'Tip'),
    h('h3', null, 'Pick any box above'),
    h('p', null, 'You will see what it does, which files hold it, and who it talks to. Pick it again to clear.'))];
}

function mapRelationItem(edge, selfId, nodeIndex, select) {
  const otherId = edge.from === selfId ? edge.to : edge.from;
  const other = nodeIndex.get(otherId);
  const direction = edge.from === selfId ? '→' : '←';
  return h('li', null, h('span', { class: 'arrow-glyph' }, direction),
    h('button', { class: 'link', type: 'button', onclick: () => select(otherId) }, softBreaks(other ? other.label : otherId)),
    edge.label && tag(edge.label));
}

function mapNodeDetail(data, node, nodeIndex, select) {
  const layer = list(data.layers).find((l) => l.id === node.layer);
  const links = mapRelated(list(data.edges), node.id);
  const flows = list(data.flows).filter((flow) => list(flow.steps).some((st) => st.from === node.id || st.to === node.id));
  return [h('div', { class: 'detail-main' },
    h('div', { class: 'step-top' }, h('span', { class: 'detail-icon' }, icon(node.kind)), tag(text(layer && layer.label, node.layer), 'tag-layer'), node.kind && tag(node.kind)),
    h('h3', null, softBreaks(node.label)),
    h('p', null, softBreaks(text(node.summary, 'No summary yet.'))),
    node.tech && h('p', { class: 'detail-tech' }, softBreaks(node.tech)),
    list(node.files).length > 0 && [h('div', { class: 'detail-label' }, 'Lives in'), h('div', { class: 'files' }, list(node.files).map(fileChip))]),
  h('div', { class: 'detail-side' },
    links.length > 0 && [h('div', { class: 'detail-label' }, 'Talks to'), h('ul', { class: 'rel' }, links.map((edge) => mapRelationItem(edge, node.id, nodeIndex, select)))],
    flows.length > 0 && [h('div', { class: 'detail-label' }, 'Shows up in'), h('ul', { class: 'rel' }, flows.map((flow) => h('li', null,
      h('a', { class: 'link', href: `#flows/${linkPart(flow.id)}` }, softBreaks(flow.title)))))]),
  ];
}

function mapEdgeShape(edge, grid, box) {
  const fromEl = grid.querySelector(`[data-node="${CSS.escape(edge.from)}"]`);
  const toEl = grid.querySelector(`[data-node="${CSS.escape(edge.to)}"]`);
  if (!fromEl || !toEl) return null;
  const a = relativeRect(fromEl, box);
  const b = relativeRect(toEl, box);
  const d = connectorPath(a, b);
  const key = `${edge.from}→${edge.to}`;
  const mid = { x: (a.cx + b.cx) / 2, y: (a.cy + b.cy) / 2 };
  // No label when the boxes almost touch: it would sit on top of them.
  const gap = Math.max(b.left - a.right, a.left - b.right, b.top - a.bottom, a.top - b.bottom);
  return s('g', { 'data-edge': key },
    s('path', { class: `edge${edge.kind === 'async' ? ' is-async' : ''}`, d, 'marker-end': 'url(#map-arrow)' }),
    edge.label && gap > 36 && s('text', { class: 'edge-label', x: mid.x, y: mid.y - 6, 'text-anchor': 'middle' }, truncate(edge.label, 28)));
}

function mapLegend(nodes, changedIds) {
  return h('div', { class: 'map-legend' },
    h('span', null, h('i'), 'Calls / reads'),
    h('span', null, h('i', { class: 'dash' }), 'Async / events'),
    chStatusLegend(nodes),
    changedIds.size > 0 && h('span', null, h('span', { class: 'tag tag-new' }, 'New'), 'Changed recently'));
}

// As many layer columns as fit at MAP_MIN_COL each; the rest wrap onto the
// next row, so the map never scrolls sideways.
function mapFitColumns(canvas, layerCount) {
  const width = canvas.parentElement ? canvas.parentElement.clientWidth : 0;
  const fit = Math.max(1, Math.min(layerCount, Math.floor((width + MAP_GAP) / (MAP_MIN_COL + MAP_GAP))));
  if (canvas.style.getPropertyValue('--fit-cols') !== String(fit)) canvas.style.setProperty('--fit-cols', String(fit));
}

function mapParts(layers, nodes, changedIds, onSelect) {
  const cols = `--cols:${Math.max(layers.length, 1)}`;
  const svg = s('svg', { class: 'map-edges', 'aria-hidden': 'true' });
  const grid = h('div', { class: 'map-grid', style: cols }, layers.map((layer) => mapColumn(layer, nodes, changedIds, onSelect)));
  const canvas = h('div', { class: 'map-canvas', style: cols }, svg, grid);
  const detail = h('aside', { class: 'map-detail panel', 'aria-live': 'polite' });
  return { svg, grid, canvas, detail };
}

function mapShowChanges(canvas, grid, changedIds) {
  canvas.classList.remove('has-selection');
  canvas.classList.add('is-changes');
  grid.querySelectorAll('.node').forEach((el) => el.classList.toggle('is-changed', changedIds.has(el.dataset.node)));
}

function mapDrawEdges(canvas, svg, grid, edges) {
  const box = canvas.getBoundingClientRect();
  svg.setAttribute('viewBox', `0 0 ${box.width} ${box.height}`);
  const defs = s('defs', null, arrowMarker('map-arrow', 'is-rest'), arrowMarker('map-arrow-active', 'is-active'));
  fill(svg, defs, ...edges.map((edge) => mapEdgeShape(edge, grid, box)).filter(Boolean));
}

function renderMap(data, mount) {
  const [layers, nodes, edges] = [list(data.layers), list(data.nodes), list(data.edges)];
  const nodeIndex = byId(nodes);
  const changedIds = new Set(list(data.changes).flatMap((change) => list(change.nodes)));
  const { svg, grid, canvas, detail } = mapParts(layers, nodes, changedIds, (id) => select(id));
  let selectedId = null;

  function select(id) {
    setSelected(selectedId === id ? null : id);
    setDeepLink(selectedId ? `map/${linkPart(selectedId)}` : 'map');
  }

  const paintSelection = () => mapPaintSelection(canvas, grid, svg, edges, selectedId);
  const renderDetail = () => fill(detail, ...(selectedId ? mapNodeDetail(data, nodeIndex.get(selectedId), nodeIndex, select) : mapEmptyDetail()));

  function setSelected(id) {
    selectedId = id;
    if (id) delete canvas.dataset.changes;
    paintSelection();
    renderDetail();
  }

  const showChanges = () => mapShowChanges(canvas, grid, changedIds);
  function drawEdges() {
    mapDrawEdges(canvas, svg, grid, edges);
    paintSelection();
    if (canvas.dataset.changes === 'on') showChanges();
  }

  on('highlight-changes', ({ enabled }) => {
    selectedId = null;
    renderDetail();
    if (enabled) canvas.dataset.changes = 'on'; else delete canvas.dataset.changes;
    if (enabled) showChanges(); else paintSelection();
  });

  renderDetail();
  mount.append(h('div', { class: 'map-shell' }, h('div', { class: 'panel map-panel' }, h('div', { class: 'map-scroll' }, canvas)), detail), mapLegend(nodes, changedIds));
  const redraw = () => window.requestAnimationFrame(() => { mapFitColumns(canvas, layers.length); drawEdges(); });
  new ResizeObserver(redraw).observe(canvas.parentElement || canvas);
  if (document.fonts) document.fonts.ready.then(redraw);
  return {
    open([id] = []) {
      if (id === undefined) return null;
      setSelected(nodeIndex.has(id) ? id : null);
      // A deep link to a part: the router scrolls to it and focuses it.
      return nodeIndex.has(id) ? grid.querySelector(`[data-node="${CSS.escape(id)}"]`) : null;
    },
  };
}

const MAP_MIN_COL = 150;
const MAP_GAP = 40;

function mapColumn(layer, nodes, changedIds, onSelect) {
  const layerNodes = nodes.filter((node) => node.layer === layer.id);
  return h('div', { class: 'map-col', style: layerStyle(layer.color) },
    h('div', { class: 'map-col-head' }, truncatable(h('span', { class: 'map-col-name' }, softBreaks(layer.label)), layer.label)),
    layerNodes.map((node) => h('button', {
      class: 'node', type: 'button', 'data-node': node.id, 'aria-pressed': 'false', onclick: () => onSelect(node.id), ...chNodeStatusAttrs(node),
    },
    changedIds.has(node.id) && h('span', { class: 'node-badge tag tag-new' }, 'New'),
    chNodeStatus(node),
    h('span', { class: 'node-icon' }, icon(node.kind)),
    h('span', { class: 'node-text' }, h('span', { class: 'node-label' }, softBreaks(node.label)), node.tech && truncatable(h('span', { class: 'node-tech' }, softBreaks(node.tech)), node.tech)))));
}

function relativeRect(el, box) {
  const r = el.getBoundingClientRect();
  const left = r.left - box.left;
  const top = r.top - box.top;
  return { left, top, right: left + r.width, bottom: top + r.height, cx: left + r.width / 2, cy: top + r.height / 2 };
}

// Route across the wider gap between the two boxes, so a line never runs
// along a box edge when boxes sit diagonally close.
function connectorPath(a, b) {
  const gapX = Math.max(b.left - a.right, a.left - b.right);
  const gapY = Math.max(b.top - a.bottom, a.top - b.bottom);
  const horizontal = gapX >= gapY;
  if (horizontal) {
    const forward = b.cx > a.cx;
    const x1 = forward ? a.right : a.left;
    const x2 = forward ? b.left - 4 : b.right + 4;
    const bend = (x2 - x1) / 2;
    return `M${x1},${a.cy} C${x1 + bend},${a.cy} ${x2 - bend},${b.cy} ${x2},${b.cy}`;
  }
  const down = b.cy > a.cy;
  const y1 = down ? a.bottom : a.top;
  const y2 = down ? b.top - 4 : b.bottom + 4;
  const bend = (y2 - y1) / 2;
  return `M${a.cx},${y1} C${a.cx},${y1 + bend} ${b.cx},${y2 - bend} ${b.cx},${y2}`;
}

// Arrowhead colours come from CSS classes, so they follow the theme.
function arrowMarker(id, cls) {
  return s('marker', { id, viewBox: '0 0 10 10', refX: 8, refY: 5, markerWidth: 8, markerHeight: 8, markerUnits: 'userSpaceOnUse', orient: 'auto-start-reverse' },
    s('path', { class: `marker-head ${cls}`, d: 'M0,1 L9,5 L0,9 z' }));
}

// ---- models.js ----
// Chapter: the data. An entity-relationship diagram (same interaction as the
// architecture map) plus a roomy field table for the selected entity.
const CARDINALITY = {
  'has many': ['1', 'N'],
  'has one': ['1', '1'],
  'belongs to': ['N', '1'],
  'many to many': ['N', 'M'],
};

// One edge per pair: "Team has many User" and "User belongs to Team" are the
// same line, so keep the first and drop its mirror.
function relationEdges(models) {
  const names = new Set(models.map((m) => m.name));
  const seen = new Set();
  return models.flatMap((model) => list(model.relations)
    .filter((rel) => names.has(rel.to) && rel.to !== model.name)
    .map((rel) => {
      const key = [model.name, rel.to].sort().join('|');
      if (seen.has(key)) return null;
      seen.add(key);
      const kind = text(rel.kind, 'relates to').toLowerCase();
      return { from: model.name, to: rel.to, kind, ends: CARDINALITY[kind] || ['', ''] };
    })
    .filter(Boolean));
}

// Zig-zag order: start at the most connected entity, then walk neighbours so
// related boxes sit next to each other.
function entityOrder(models, edges) {
  const degree = (name) => edges.filter((e) => e.from === name || e.to === name).length;
  const byDegree = [...models].sort((a, b) => degree(b.name) - degree(a.name));
  const order = [];
  const visit = (model) => {
    if (!model || order.includes(model)) return;
    order.push(model);
    edges.filter((e) => e.from === model.name || e.to === model.name)
      .map((e) => models.find((m) => m.name === (e.from === model.name ? e.to : e.from)))
      .forEach(visit);
  };
  byDegree.forEach(visit);
  return order;
}

// PK: named "id" or noted as primary. FK: explicit `ref`, or "<model>Id" / "<model>_id".
// Ids of outside systems (stripeCustomerId) are not FKs, so no suffix guessing.
function fieldBadges(field, modelNames) {
  const name = text(field.name);
  const lower = name.toLowerCase();
  const isPk = name === 'id' || /\bprimary\b/i.test(text(field.note));
  const named = [...modelNames].find((m) => lower === `${m.toLowerCase()}id` || lower === `${m.toLowerCase()}_id`);
  const fkTarget = modelNames.has(field.ref) ? field.ref : named;
  return { isPk, fkTarget, isFk: Boolean(fkTarget) };
}

function renderModels(data, mount) {
  const models = list(data.dataModel);
  const edges = relationEdges(models);
  const ordered = entityOrder(models, edges);
  const modelNames = new Set(models.map((m) => m.name));
  const svg = s('svg', { class: 'map-edges', 'aria-hidden': 'true' });
  const grid = h('div', { class: 'er-grid', style: `--er-cols:${ordered.length + 1}` },
    ordered.map((model, i) => entityBox(model, i, modelNames, () => pick(model.name))));
  const canvas = h('div', { class: 'map-canvas er-canvas', style: `--er-cols:${ordered.length + 1}` }, svg, grid);
  const detail = h('div', { class: 'panel er-detail', 'aria-live': 'polite' });
  let selected = ordered[0] ? ordered[0].name : null;

  function select(name) {
    selected = name;
    paint();
    fill(detail, ...modelDetail(models.find((m) => m.name === name)));
  }

  function pick(name) {
    select(name);
    setDeepLink(`data/${linkPart(name)}`);
  }

  const paint = () => paintEntities(canvas, grid, svg, edges, selected);
  const modelDetail = (model) => entityDetail(model, edges, modelNames, pick);

  function drawEdges() {
    const box = canvas.getBoundingClientRect();
    svg.setAttribute('viewBox', `0 0 ${box.width} ${box.height}`);
    fill(svg, s('defs', null), edges.map((edge) => relationShape(edge, grid, box)).filter(Boolean));
    paint();
  }

  if (!models.length) return null;
  mount.append(h('div', { class: 'panel map-panel' }, h('div', { class: 'map-scroll' }, canvas)), detail);
  select(selected);
  const redraw = () => window.requestAnimationFrame(drawEdges);
  new ResizeObserver(redraw).observe(canvas);
  if (document.fonts) document.fonts.ready.then(redraw);
  return {
    open([name] = []) {
      if (name === undefined || !modelNames.has(name)) return null;
      select(name);
      return grid.querySelector(`[data-entity="${CSS.escape(name)}"]`);
    },
  };
}

// Highlight the selected entity, its neighbours and their relation lines.
function paintEntities(canvas, grid, svg, edges, selected) {
  const related = new Set(edges.filter((e) => e.from === selected || e.to === selected).flatMap((e) => [e.from, e.to]));
  canvas.classList.add('has-selection');
  grid.querySelectorAll('.entity').forEach((el) => {
    el.classList.toggle('is-selected', el.dataset.entity === selected);
    el.classList.toggle('is-related', related.has(el.dataset.entity));
    el.setAttribute('aria-pressed', String(el.dataset.entity === selected));
  });
  svg.querySelectorAll('[data-edge]').forEach((g) => {
    const [from, to] = g.dataset.edge.split('→');
    const active = from === selected || to === selected;
    g.querySelectorAll('path, text').forEach((part) => part.classList.toggle('is-active', active));
  });
}

function entityRelation(model, edge, pick) {
  const other = edge.from === model.name ? edge.to : edge.from;
  const [a, b] = edge.from === model.name ? edge.ends : [...edge.ends].reverse();
  return h('li', null,
    tag(`${a || '?'} : ${b || '?'}`),
    h('span', null, softBreaks(`${model.name} ${edge.from === model.name ? edge.kind : 'is linked from'} `)),
    h('button', { class: 'link', type: 'button', onclick: () => pick(other) }, softBreaks(other)));
}

// The detail panel: fields as a table, then the relationships.
function entityDetail(model, edges, modelNames, pick) {
  if (!model) return [];
  const rels = edges.filter((e) => e.from === model.name || e.to === model.name);
  return [
    h('div', { class: 'er-detail-head' },
      h('h3', null, h('span', { class: 'detail-icon' }, icon('db')), h('span', null, softBreaks(model.name))),
      model.summary && h('p', null, softBreaks(model.summary))),
    h('div', { class: 'er-fields', role: 'table', 'aria-label': `${model.name} fields` },
      h('div', { class: 'er-row er-row-head', role: 'row' },
        h('span', { role: 'columnheader' }, 'Field'), h('span', { role: 'columnheader' }, 'Type'), h('span', { role: 'columnheader' }, 'Meaning')),
      list(model.fields).map((field) => fieldRow(field, modelNames, pick))),
    rels.length > 0 && h('div', { class: 'er-rels' },
      h('p', { class: 'eyebrow quiet' }, 'Relationships'),
      h('ul', { class: 'rel' }, rels.map((edge) => entityRelation(model, edge, pick)))),
  ];
}

function entityBox(model, index, modelNames, onSelect) {
  // Zig-zag: each box spans two tracks and steps one track right, alternating rows.
  const row = index % 2;
  const col = index + 1;
  const keys = list(model.fields).filter((f) => {
    const b = fieldBadges(f, modelNames);
    return b.isPk || b.isFk;
  }).slice(0, 4);
  return h('button', {
    class: 'entity', type: 'button', 'data-entity': model.name, 'aria-pressed': 'false',
    style: `grid-column:${col} / span 2;grid-row:${row + 1}`, onclick: onSelect,
  },
  h('span', { class: 'entity-head' }, h('span', { class: 'node-icon' }, icon('db')), h('span', { class: 'entity-name' }, softBreaks(model.name)), h('span', { class: 'entity-count' }, `${list(model.fields).length} fields`)),
  keys.length > 0 && h('span', { class: 'entity-keys' }, keys.map((f) => {
    const b = fieldBadges(f, modelNames);
    return h('span', { class: 'entity-key' }, h('span', { class: `key-badge ${b.isPk ? 'is-pk' : 'is-fk'}` }, b.isPk ? 'PK' : 'FK'), h('span', null, softBreaks(f.name)));
  })));
}

function fieldRow(field, modelNames, select) {
  const b = fieldBadges(field, modelNames);
  return h('div', { class: 'er-row', role: 'row' },
    h('span', { class: 'er-name', role: 'cell' },
      h('code', null, field.name),
      b.isPk && h('span', { class: 'key-badge is-pk' }, 'PK'),
      b.isFk && h('span', { class: 'key-badge is-fk' }, 'FK'),
      b.fkTarget && h('button', { class: 'link er-fk', type: 'button', onclick: () => select(b.fkTarget) }, `→ ${b.fkTarget}`)),
    h('span', { class: 'er-type', role: 'cell' }, h('code', null, text(field.type, 'any'))),
    h('span', { class: 'er-note', role: 'cell' }, softBreaks(text(field.note, ''))));
}

function relationShape(edge, grid, box) {
  const fromEl = grid.querySelector(`[data-entity="${CSS.escape(edge.from)}"]`);
  const toEl = grid.querySelector(`[data-entity="${CSS.escape(edge.to)}"]`);
  if (!fromEl || !toEl) return null;
  const a = relativeRect(fromEl, box);
  const b = relativeRect(toEl, box);
  const d = connectorPath(a, b);
  const nums = d.match(/-?\d+(\.\d+)?/g).map(Number);
  const [x1, y1] = nums;
  const [x2, y2] = nums.slice(-2);
  const nudge = (x, y, tx, ty) => {
    const len = Math.hypot(tx - x, ty - y) || 1;
    return { x: x + ((tx - x) / len) * 18 + 8, y: y + ((ty - y) / len) * 18 - 4 };
  };
  const startLabel = nudge(x1, y1, x2, y2);
  const endLabel = nudge(x2, y2, x1, y1);
  return s('g', { 'data-edge': `${edge.from}→${edge.to}` },
    s('path', { class: 'edge', d }),
    s('text', { class: 'er-card', x: startLabel.x, y: startLabel.y, 'text-anchor': 'middle' }, edge.ends[0]),
    s('text', { class: 'er-card', x: endLabel.x, y: endLabel.y, 'text-anchor': 'middle' }, edge.ends[1]),
    s('text', { class: 'edge-label', x: (x1 + x2) / 2, y: (y1 + y2) / 2 - 8, 'text-anchor': 'middle' }, edge.kind));
}

// ---- flow.js ----
// Chapter: end-to-end flow player. A sequence diagram you step through one
// hop at a time, Brilliant style: one idea per step and a Continue button.
const SEQ = { minCol: 130, maxCol: 220, head: 64, top: 40, row: 58, pad: 20 };
const DASHED_KINDS = new Set(['response', 'async']);
const FLOW_SIDE_BY_SIDE = '(min-width: 1180px)';
const FLOW_CARD_WIDTH = 380;
const LABEL_CHAR = 6.6;

// Side by side only when the widest flow fits beside the step card without
// sideways scrolling; otherwise the card comes first and the diagram gets the
// full width. Decided for the whole page, so flows do not jump around.
function watchFlowLayout(flows, { root, layout, panel }, render) {
  const widest = Math.max(...flows.map((f) => flowActors(list(f.steps)).length), 1);
  const fitsBeside = () => window.matchMedia(FLOW_SIDE_BY_SIDE).matches
    && root.clientWidth - FLOW_CARD_WIDTH - 16 >= widest * SEQ.minCol + SEQ.pad * 2;
  let lastWidth = 0;
  new ResizeObserver(() => {
    if (Math.abs(root.clientWidth - lastWidth) <= 24) return;
    lastWidth = root.clientWidth;
    layout.classList.toggle('is-stacked', !fitsBeside());
    render();
  }).observe(root);
  // The step card follows the reader only while it fits on screen: no inner scroll areas.
  new ResizeObserver(() => {
    panel.classList.toggle('is-static', panel.offsetHeight > window.innerHeight - 96);
  }).observe(panel);
}

function flowPicks(flows, current, onPick) {
  return flows.map((f, i) => h('li', null, h('button', {
    class: 'flow-pick', type: 'button', 'aria-pressed': String(i === current), onclick: () => onPick(i),
  },
  h('span', { class: 'flow-pick-top' }, h('span', null, padNumber(i + 1)), h('span', null, plural(list(f.steps).length, 'step'))),
  h('span', { class: `flow-pick-title ${fitClass(f.title)}` }, softBreaks(f.title)))));
}

// onJump(flowId, stepIndex) switches to a paired flow.
function flowMeta(flows, flow, nodeIndex, onJump) {
  const pair = chFlowPair(flows, flow);
  return [
    flow.trigger && h('p', { class: 'flow-trigger' }, h('span', { class: 'eyebrow quiet' }, 'Starts when'), h('span', null, softBreaks(flow.trigger))),
    flow.summary && h('p', { class: 'flow-summary' }, softBreaks(flow.summary)),
    chPairSwitch(pair, flow.id, (id) => onJump(id, 0)),
    chPairCompare(pair, nodeIndex, (id, n) => onJump(id, n - 1)),
  ];
}

function flowStepRoute(step, nodeIndex) {
  const from = nodeIndex.get(step.from);
  const to = nodeIndex.get(step.to);
  return h('div', { class: 'step-route' },
    h('span', { class: 'route-part' }, from && icon(from.kind), softBreaks(text(from && from.label, step.from))),
    h('span', { class: 'arrow-glyph', 'aria-hidden': 'true' }, step.from === step.to ? '↺' : '→'),
    step.from !== step.to && h('span', { class: 'route-part' }, to && icon(to.kind), softBreaks(text(to && to.label, step.to))));
}

function flowStepPanel(data, flow, stepIndex, nodeIndex, go) {
  const steps = list(flow.steps);
  const step = steps[stepIndex];
  const last = stepIndex === steps.length - 1;
  return [h('div', { class: 'step-body' }, h('div', { class: 'step-text' },
    h('div', { class: 'step-top' },
      h('span', { class: 'step-count' }, `Step ${stepIndex + 1} of ${steps.length}`),
      step.kind && tag(step.kind, `tag-${step.kind}`)),
    flowStepRoute(step, nodeIndex),
    h('h3', null, softBreaks(step.label)),
    step.detail && h('p', null, softBreaks(step.detail)),
    step.why && h('div', { class: 'why' }, h('p', { class: 'eyebrow quiet' }, 'Why it works this way'), h('p', null, softBreaks(step.why)))),
    (step.file || step.code) && h('div', { class: 'step-code' },
      step.file && h('div', { class: 'code-head' }, fileChip(step.file), chWalkthroughLink(data, step.file)),
      step.code && codeBlock(step.code, step.lang))),
    h('div', { class: 'step-controls' },
      stepDots(steps.length, stepIndex, go),
      h('button', { class: 'btn', type: 'button', disabled: stepIndex === 0, onclick: () => go(stepIndex - 1) }, 'Back'),
      h('button', { class: 'btn primary', type: 'button', onclick: () => go(stepIndex + 1) }, last ? 'Finish' : 'Continue')),
    h('p', { class: 'kbd-hint' }, 'Tip: use ', h('kbd', null, '←'), ' ', h('kbd', null, '→'), ' to step through.'),
  ];
}

// onNext is null on the last flow.
function flowDonePanel(flow, go, onNext) {
  const steps = list(flow.steps);
  const actors = new Set(steps.flatMap((st) => [st.from, st.to]));
  return [h('div', { class: 'flow-done' },
    h('span', { class: 'trophy' }, icon('trophy')),
    h('p', { class: 'eyebrow quiet' }, 'Flow complete'),
    h('h3', null, softBreaks(flow.title)),
    h('p', null, `You followed it through ${plural(steps.length, 'step')} and ${plural(actors.size, 'part')} of the system.`),
    h('div', { class: 'btn-row' },
      h('button', { class: 'btn', type: 'button', onclick: () => go(0) }, 'Replay'),
      onNext && h('button', { class: 'btn primary', type: 'button', onclick: onNext }, 'Next flow')))];
}

// Draw the current arrow, slide the card in, keep the step in view.
function animateFlowStep(diagram, panel, layout, state, animate) {
  const current = diagram.body.querySelector('.seq-step.is-current .arrow');
  if (current) {
    const marker = current.dataset.marker;
    if (animate) drawPath(current, marker); else current.setAttribute('marker-end', marker);
  }
  if (!animate) return;
  slideIn(panel.firstElementChild, state.direction);
  // Stacked layouts keep the reader at the Continue button instead.
  if (!state.finished && !layout.classList.contains('is-stacked')) revealCurrentStep(diagram.body);
  if (state.finished) pop(panel.querySelector('.trophy'));
}

function flowPlayerParts() {
  const headsWrap = h('div', { class: 'seq-heads-wrap' });
  const bodyWrap = h('div', { class: 'seq-body' });
  // The body scrolls sideways only; the sticky header strip follows it.
  bodyWrap.addEventListener('scroll', () => {
    if (headsWrap.firstElementChild) headsWrap.firstElementChild.style.transform = `translateX(${-bodyWrap.scrollLeft}px)`;
  }, { passive: true });
  const seqWrap = h('div', { class: 'panel seq-wrap seq', 'aria-label': 'Sequence diagram' }, headsWrap, bodyWrap);
  const picker = h('ul', { class: 'flow-list', 'aria-label': 'Flows' });
  const meta = h('div', { class: 'flow-meta' });
  const panel = h('div', { class: 'panel step-card', 'aria-live': 'polite' });
  const layout = h('div', { class: 'flow-layout' }, seqWrap, panel);
  const root = h('div', { class: 'flow-player' }, picker, meta, layout);
  return { headsWrap, bodyWrap, picker, meta, panel, layout, root };
}

// #flows/<id>/<n>, with n = the step count once finished.
function flowLink(flows, state) {
  const flow = flows[state.flowIndex];
  return `flows/${linkPart(flow.id)}/${state.finished ? list(flow.steps).length : state.stepIndex + 1}`;
}

// Going past the last step finishes the flow.
function flowStepState(flows, state, stepIndex) {
  if (stepIndex >= list(flows[state.flowIndex].steps).length) return { finished: true, direction: 1 };
  return { stepIndex: Math.max(0, stepIndex), finished: false, direction: stepIndex >= state.stepIndex ? 1 : -1 };
}

// Left and right arrows step through, except while typing.
function wireFlowKeys(root, getState, go) {
  root.addEventListener('keydown', (event) => {
    if (event.target.closest('input, textarea')) return;
    const state = getState();
    if (event.key === 'ArrowRight') { event.preventDefault(); go(state.stepIndex + 1); }
    if (event.key === 'ArrowLeft') { event.preventDefault(); go(state.finished ? state.stepIndex : state.stepIndex - 1); }
  });
}

// #flows/<id>/<n>: the state to open, or null when the flow is unknown.
function flowOpenState(flows, flowId, n) {
  if (flowId === undefined) return null;
  const index = flows.findIndex((f) => f.id === flowId);
  if (index < 0) return null;
  const count = list(flows[index].steps).length;
  const wanted = Number.parseInt(n, 10);
  const stepIndex = Number.isInteger(wanted) && wanted >= 1 && wanted <= count ? wanted - 1 : 0;
  return { flowIndex: index, stepIndex, finished: false, direction: 1 };
}

function renderFlows(data, mount) {
  const flows = list(data.flows);
  if (!flows.length) {
    mount.append(h('p', { class: 'empty' }, 'No flows traced yet.'));
    return null;
  }
  const nodeIndex = byId(data.nodes);
  const parts = flowPlayerParts();
  const { headsWrap, bodyWrap, picker, meta, panel, layout, root } = parts;
  let state = { flowIndex: 0, stepIndex: 0, finished: false, direction: 1 };

  function setState(next) {
    state = { ...state, ...next };
    setDeepLink(flowLink(flows, state));
    render({ animate: true });
  }

  const go = (stepIndex) => setState(flowStepState(flows, state, stepIndex));

  const jump = (id, stepIndex) => setState({ flowIndex: flows.findIndex((f) => f.id === id), stepIndex, finished: false });
  const nextFlow = () => (state.flowIndex + 1 < flows.length ? () => setState({ flowIndex: state.flowIndex + 1, stepIndex: 0, finished: false }) : null);

  function render({ animate = false } = {}) {
    const flow = flows[state.flowIndex];
    fill(picker, ...flowPicks(flows, state.flowIndex, (i) => setState({ flowIndex: i, stepIndex: 0, finished: false })));
    fill(meta, ...flowMeta(flows, flow, nodeIndex, jump));
    const diagram = sequenceDiagram(flow, nodeIndex, state.finished ? list(flow.steps).length : state.stepIndex, go, bodyWrap.clientWidth);
    fill(headsWrap, diagram.heads);
    fill(bodyWrap, diagram.body);
    centerCurrentStep(bodyWrap, animate);
    fill(panel, ...(state.finished ? flowDonePanel(flow, go, nextFlow()) : flowStepPanel(data, flow, state.stepIndex, nodeIndex, go)));
    animateFlowStep(diagram, panel, layout, state, animate);
  }

  watchFlowLayout(flows, parts, render);
  wireFlowKeys(root, () => state, go);

  render();
  mount.append(root);
  return {
    open([flowId, n] = []) {
      const opened = flowOpenState(flows, flowId, n);
      if (!opened) return null;
      state = opened;
      render();
      return panel;
    },
  };
}

// A segmented progress bar. Each segment is a button with a full-height hit area.
function stepDots(count, current, go) {
  return h('div', { class: 'step-dots' }, Array.from({ length: count }, (_, i) => h('button', {
    type: 'button', class: i === current ? 'is-current' : i < current ? 'is-done' : '', 'aria-label': `Go to step ${i + 1}`,
    'aria-current': i === current ? 'step' : null, onclick: () => go(i),
  })));
}

function flowActors(steps) {
  return [...new Set(steps.flatMap((step) => [step.from, step.to]))];
}

// Two SVGs share one scroll box: a sticky strip of actor heads and the steps.
function sequenceDiagram(flow, nodeIndex, currentIndex, go, available) {
  const steps = list(flow.steps);
  const actors = flowActors(steps);
  const fit = ((available || 0) - SEQ.pad * 2) / Math.max(actors.length, 1);
  const col = Math.min(SEQ.maxCol, Math.max(SEQ.minCol, fit));
  const width = SEQ.pad * 2 + actors.length * col;
  const height = SEQ.top + steps.length * SEQ.row;
  const xOf = (id) => SEQ.pad + actors.indexOf(id) * col + col / 2;
  const headW = Math.min(col - 16, 170);
  const chars = Math.floor((headW - 46) / 7);
  const heads = s('svg', { class: 'seq-heads', viewBox: `0 0 ${width} ${SEQ.head}`, width, height: SEQ.head, 'aria-hidden': 'true' });
  const body = s('svg', { viewBox: `0 0 ${width} ${height}`, width, height, role: 'img', 'aria-label': `${flow.title}: ${plural(steps.length, 'step')}` });

  actors.forEach((id) => {
    const node = nodeIndex.get(id);
    const x = xOf(id);
    heads.append(
      s('rect', { class: 'seq-head-box', x: x - headW / 2 + 0.5, y: 12.5, width: headW - 1, height: 40, rx: 6 }),
      icon(node ? node.kind : 'service', { class: 'seq-head-icon', x: x - headW / 2 + 10, y: 22, width: 20, height: 20 }),
      s('text', { class: 'seq-head-label', x: x - headW / 2 + 38, y: 37 }, truncate(node ? node.label : id, chars), s('title', null, node ? node.label : id)),
    );
    body.append(s('line', { class: 'seq-lifeline', x1: x, x2: x, y1: 0, y2: height }));
  });

  steps.forEach((step, i) => body.append(sequenceStep(step, i, currentIndex, xOf, width, go, col)));
  return { heads, body };
}

function sequenceStep(step, i, currentIndex, xOf, width, go, col) {
  const y = SEQ.top + i * SEQ.row;
  const status = i < currentIndex ? 'is-done' : i === currentIndex ? 'is-current' : 'is-todo';
  const x1 = xOf(step.from);
  const x2 = xOf(step.to);
  const self = step.from === step.to;
  const dir = x2 >= x1 ? 1 : -1;
  const d = self
    ? `M${x1},${y} h44 v18 h-40`
    : `M${x1 + dir * 12},${y} L${x2 - dir * 8},${y}`;
  // A label may run past a short hop, but always stays inside the diagram.
  const room = self ? width - (x1 + 52) - SEQ.pad : Math.max(Math.abs(x2 - x1), col * 1.6) - 12;
  const label = truncate(step.label, Math.max(10, Math.floor(room / LABEL_CHAR)));
  const half = (label.length * LABEL_CHAR) / 2;
  const labelX = self ? x1 + 52 : Math.min(Math.max((x1 + x2) / 2, half + 6), width - half - 6);
  const group = s('g', {
    class: `seq-step ${status}${DASHED_KINDS.has(step.kind) ? ' is-dashed' : ''}`,
    role: 'button', tabindex: '0', 'aria-label': `Step ${i + 1}: ${step.label}`,
    onclick: () => go(i),
    onkeydown: (event) => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); go(i); } },
  },
  s('rect', { class: 'hit', x: 4, y: y - 30, width: width - 8, height: SEQ.row - 4, rx: 6 }),
  s('path', status === 'is-current'
    ? { class: 'arrow', d, 'data-marker': `url(#seq-arrow-${status})` }
    : { class: 'arrow', d, 'marker-end': `url(#seq-arrow-${status})` }),
  s('circle', { class: 'badge-bg', cx: x1, cy: y, r: 10 }),
  s('text', { class: 'badge-num', x: x1, y: y + 3.5, 'text-anchor': 'middle' }, String(i + 1)),
  s('text', { class: 'label', x: labelX, y: y - 10, 'text-anchor': self ? 'start' : 'middle' }, label, s('title', null, step.label)));

  if (i === 0) group.prepend(seqMarkers());
  if (status === 'is-current' && !reducedMotion()) {
    // One pass along the arrow after it draws, then fade. No endless loop.
    group.append(s('circle', { class: 'seq-dot', r: 4.5, opacity: 0 },
      s('set', { attributeName: 'opacity', to: 1, begin: '0.3s' }),
      s('animateMotion', { dur: '0.6s', begin: '0.3s', fill: 'freeze', path: d, calcMode: 'spline', keyTimes: '0;1', keySplines: '0.4 0 0.2 1' }),
      s('animate', { attributeName: 'opacity', from: 1, to: 0, begin: '0.9s', dur: '0.3s', fill: 'freeze' })));
  }
  return group;
}

function seqMarkers() {
  const marker = (status) => s('marker', { id: `seq-arrow-${status}`, viewBox: '0 0 10 10', refX: 7, refY: 5, markerWidth: 8, markerHeight: 8, markerUnits: 'userSpaceOnUse', orient: 'auto' },
    s('path', { class: `marker-head ${status}`, d: 'M0,1 L9,5 L0,9 z' }));
  return s('defs', null, marker('is-done'), marker('is-current'), marker('is-todo'));
}

// Only on reader actions: bring the active hop into view without fighting
// the page's own scrolling.
function centerCurrentStep(bodyWrap, animate) {
  const badge = bodyWrap.querySelector('.seq-step.is-current .badge-bg');
  if (!badge) return;
  const left = Number(badge.getAttribute('cx')) - bodyWrap.clientWidth / 3;
  bodyWrap.scrollTo({ left: Math.max(0, left), behavior: animate && !reducedMotion() ? 'smooth' : 'auto' });
}

function revealCurrentStep(diagram) {
  const current = diagram.querySelector('.seq-step.is-current');
  if (!current) return;
  const box = current.getBoundingClientRect();
  const stickyBottom = 100;
  if (box.top < stickyBottom || box.bottom > window.innerHeight - 24) {
    current.scrollIntoView({ block: 'center', behavior: reducedMotion() ? 'auto' : 'smooth' });
  }
}

// ---- changes.js ----
// Chapter: what changed and why. Built for repos where many humans and
// agents merge every day. Each change carries its reason and the parts of
// the system it touched, so readers can re-sync their mental model fast.
const AUTHOR_FILTERS = [
  { id: 'all', label: 'Everyone' },
  { id: 'agent', label: 'Agents' },
  { id: 'human', label: 'Humans' },
];

// The deep-link key for a change: its id, else its position in the data.
function changeKey(change, index) {
  return text(change && change.id, String(index));
}

// Newest first, each with its deep-link key.
function sortedChanges(data) {
  return list(data.changes)
    .map((change, i) => ({ ...change, key: changeKey(change, i) }))
    .sort((a, b) => String(b.date).localeCompare(String(a.date)));
}

function visibleChanges(changes, state) {
  return changes.filter((c) => (state.author === 'all' || c.authorType === state.author)
    && (state.kind === 'all' || c.kind === state.kind));
}

function changesToolbar(state, kinds, setState) {
  return [
    h('div', { class: 'seg', role: 'group', 'aria-label': 'Filter by author' },
      AUTHOR_FILTERS.map((f) => filterChip(f.label, state.author === f.id, () => setState({ author: f.id })))),
    kinds.length > 2 && h('div', { class: 'seg', role: 'group', 'aria-label': 'Filter by type' },
      kinds.map((k) => filterChip(k === 'all' ? 'All types' : k, state.kind === k, () => setState({ kind: k })))),
    h('button', {
      class: 'btn small changes-map', type: 'button',
      onclick: () => { emit('highlight-changes', { enabled: true }); window.location.hash = 'map'; },
    }, 'Show on map'),
  ];
}

function renderChanges(data, mount) {
  const changes = sortedChanges(data);
  if (!changes.length) {
    mount.append(h('p', { class: 'empty' }, 'No recent changes recorded.'));
    return null;
  }
  const nodeIndex = byId(data.nodes);
  const kinds = ['all', ...new Set(changes.map((c) => c.kind).filter(Boolean))];
  const toolbar = h('div', { class: 'changes-toolbar' });
  const timeline = h('ol', { class: 'timeline' });
  let state = { author: 'all', kind: 'all', target: null };

  function setState(next, { animate = true } = {}) {
    state = { ...state, ...next };
    render();
    if (animate) [...timeline.children].slice(0, 8).forEach((item, i) => riseIn(item, i * 35));
  }

  function render() {
    fill(toolbar, ...changesToolbar(state, kinds, setState));
    const items = visibleChanges(changes, state);
    fill(timeline, ...(items.length
      ? items.map((change) => changeItem(change, nodeIndex, change.key === state.target))
      : [h('li', { class: 'empty' }, 'Nothing matches these filters.')]));
  }

  render();
  mount.append(changeStats(changes), toolbar, timeline);
  return {
    open([key] = []) {
      const match = key !== undefined && changes.find((c) => c.key === key);
      setState({ author: 'all', kind: 'all', target: match ? match.key : null }, { animate: false });
      return match ? timeline.querySelector('.change.is-target') : null;
    },
  };
}

function filterChip(label, pressed, onclick) {
  return h('button', { class: 'seg-option', type: 'button', 'aria-pressed': String(pressed), onclick }, label);
}

function changeStats(changes) {
  const agents = changes.filter((c) => c.authorType === 'agent').length;
  const touched = new Set(changes.flatMap((c) => list(c.nodes))).size;
  const stat = (value, label) => h('div', null, h('dt', null, label), h('dd', null, String(value)));
  return h('dl', { class: 'panel glance-grid changes-stats' },
    stat(changes.length, 'Changes'),
    stat(agents, 'By agents'),
    stat(changes.length - agents, 'By humans'),
    stat(touched, 'Parts touched'));
}

function changeItem(change, nodeIndex, isTarget) {
  const isAgent = change.authorType === 'agent';
  const url = safeUrl(change.url);
  return h('li', { class: `change ${isAgent ? 'is-agent' : 'is-human'}${isTarget ? ' is-target' : ''}`, 'data-change': change.key },
    h('div', { class: 'change-dot', 'aria-hidden': 'true' }, icon(isAgent ? 'robot' : 'user')),
    h('article', { class: 'panel change-card' },
      h('div', { class: 'change-top' },
        h('span', null, displayDate(change.date, { fallback: 'undated' })),
        change.ref && (url
          ? h('a', { class: 'link', href: safeUrl(change.url), target: '_blank', rel: 'noopener noreferrer' }, softBreaks(change.ref))
          : h('span', null, softBreaks(change.ref))),
        tag(isAgent ? 'Agent' : 'Human', isAgent ? 'tag-agent' : 'tag-human'),
        change.author && h('span', null, softBreaks(change.author)),
        change.kind && tag(change.kind)),
      h('h3', null, softBreaks(change.title)),
      change.what && h('p', null, softBreaks(change.what)),
      change.why && h('div', { class: 'why' }, h('p', { class: 'eyebrow quiet' }, 'Why'), h('p', null, softBreaks(change.why))),
      change.risk && h('div', { class: 'why why-risk' }, h('p', { class: 'eyebrow quiet' }, 'Risk'), h('p', null, softBreaks(change.risk))),
      list(change.nodes).length > 0 && h('div', { class: 'change-nodes' }, list(change.nodes).map((id) => {
        const node = nodeIndex.get(id);
        return h('a', { class: 'chip', href: `#map/${linkPart(id)}` }, truncatable(h('span', { class: 'chip-text' }, softBreaks(node ? node.label : id)), node ? node.label : id));
      })),
      list(change.files).length > 0 && h('div', { class: 'change-nodes' }, list(change.files).slice(0, 6).map(fileChip))));
}


// ---- lessons.js ----
// Chapter: key concepts, one idea per card. (The quiz follows.)
function renderConcepts(data, mount) {
  const concepts = list(data.concepts);
  if (!concepts.length) return null;
  let index = 0;
  const card = h('article', { class: 'panel concept-card', 'aria-live': 'polite' });
  const controls = h('div', { class: 'step-controls' });

  function show(next, { animate = true, link = true } = {}) {
    const target = Math.min(Math.max(next, 0), concepts.length - 1);
    const direction = target >= index ? 1 : -1;
    index = target;
    render();
    if (link) setDeepLink(`concepts/${index}`);
    if (animate) slideIn(card, direction);
  }

  function render() {
    const concept = concepts[index];
    fill(card,
      h('span', { class: 'step-count' }, `Idea ${index + 1} of ${concepts.length}`),
      h('h3', null, softBreaks(concept.title)),
      h('p', { class: 'concept-body' }, softBreaks(concept.body)),
      concept.analogy && h('div', { class: 'why' }, h('p', { class: 'eyebrow quiet' }, 'Think of it like'), h('p', null, softBreaks(concept.analogy))),
      chConceptExtras(concept),
      concept.file && h('div', { class: 'code-head' }, fileChip(concept.file), chWalkthroughLink(data, concept.file)),
      concept.code && codeBlock(concept.code, concept.lang),
      controls,
    );
    fill(controls,
      stepDots(concepts.length, index, (i) => show(i)),
      h('button', { class: 'btn', type: 'button', disabled: index === 0, onclick: () => show(index - 1) }, 'Back'),
      h('button', { class: 'btn primary', type: 'button', disabled: index === concepts.length - 1, onclick: () => show(index + 1) }, 'Continue'),
    );
  }

  render();
  mount.append(h('div', { class: 'lesson' }, card));
  return {
    open([raw] = []) {
      const wanted = Number.parseInt(raw, 10);
      if (!(Number.isInteger(wanted) && wanted >= 0 && wanted < concepts.length)) return null;
      show(wanted, { animate: false, link: false });
      return card;
    },
  };
}

// Chapter: check yourself. One question at a time, Brilliant pacing: pick an
// answer, then Check. A wrong first try says "Not yet" and lets you retry; a
// second wrong try (or Show answer) reveals the answer and the reason.
// Answers are remembered per explainer in this browser only.
const QUIZ_TRIES = 2;
const PATHISH = /^[^\s]*[/\\][^\s]*$|^[\w.-]+\.(?:[a-z]{1,5})(?::\d+)?$|\(\)|=>|::/i;

function quizStoreKey(meta) {
  return `concept-explainer:quiz:${text(meta && meta.repo, meta && meta.title)}:${text(meta && meta.commit, '')}`;
}

function loadQuiz(key, count) {
  try {
    const saved = JSON.parse(readStore(key) || 'null');
    if (!saved || !Array.isArray(saved.answers)) return null;
    return { index: Math.min(Math.max(0, saved.index | 0), count), answers: saved.answers.slice(0, count) };
  } catch (error) {
    return null;
  }
}

// Where a question is taught: a node or flow named in the question, the
// right option or the explanation; a cited path that belongs to a node.
function quizLesson(question, data) {
  const hay = [question.question, question.explain, list(question.options)[question.answer]].map((v) => text(v)).join(' ').toLowerCase();
  if (!hay) return null;
  const node = list(data.nodes).find((n) => (n.label && hay.includes(String(n.label).toLowerCase()))
    || list(n.files).some((f) => hay.includes(String(f).replace(/:\d+.*$/, '').toLowerCase())));
  if (node) return { href: `#map/${linkPart(node.id)}`, label: node.label };
  const flow = list(data.flows).find((f) => f.title && hay.includes(String(f.title).toLowerCase()));
  if (flow) return { href: `#flows/${linkPart(flow.id)}`, label: flow.title };
  const concept = list(data.concepts).findIndex((c) => c.title && hay.includes(String(c.title).toLowerCase()));
  if (concept >= 0) return { href: `#concepts/${concept}`, label: data.concepts[concept].title };
  return null;
}

function optionLabel(option) {
  const value = String(option);
  if (PATHISH.test(value.trim())) {
    return truncatable(h('span', { class: 'option-text is-code' }), value, { mode: 'middle' });
  }
  return h('span', { class: 'option-text' }, softBreaks(value));
}

// ---------- Quiz state (pure) ----------
const QUIZ_OPEN = Object.freeze({ tries: [], status: 'open', picked: null });

function quizAnswerOf(state, i) {
  return state.answers[i] || QUIZ_OPEN;
}

// The answer after pressing Check: right first time, right late (counts as
// missed), another try, or out of tries.
function quizChecked(answer, question) {
  const right = answer.picked === question.answer;
  const tries = [...answer.tries, answer.picked];
  const status = right ? (tries.length === 1 ? 'right' : 'right-late') : tries.length >= QUIZ_TRIES ? 'missed' : 'retry';
  return { ...answer, tries, status: status === 'right-late' ? 'missed' : status, firstTry: right && tries.length === 1, picked: right ? answer.picked : null, late: status === 'right-late' };
}

function quizWithAnswer(state, i, next) {
  const answers = [...state.answers];
  answers[i] = { ...quizAnswerOf(state, i), ...next };
  return { ...state, answers };
}

const quizPicked = (answer) => answer.picked !== null && answer.picked !== undefined;

// ---------- Quiz screens ----------
function quizProgress(questions, state, current, go) {
  return h('div', { class: 'step-dots quiz-dots' }, questions.map((_, i) => {
    const status = quizAnswerOf(state, i).status;
    return h('button', {
      type: 'button', class: [i === current ? 'is-current' : '', status !== 'open' ? 'is-done' : ''].join(' ').trim(),
      'aria-label': `Question ${i + 1}${status === 'right' ? ', right' : status === 'missed' ? ', missed' : ''}`,
      'aria-current': i === current ? 'step' : null, onclick: () => go(i),
    });
  }));
}

function quizFeedback(question, answer) {
  const live = h('div', { class: 'quiz-live', 'aria-live': 'polite' });
  if (answer.status === 'open') return live;
  const correctText = list(question.options)[question.answer];
  const explain = text(question.explain, `The answer is “${correctText}”.`);
  const states = {
    retry: { cls: 'is-retry', head: 'Not yet. Try again.', body: 'Pick another answer, or show the answer.' },
    right: { cls: 'is-right', head: 'Right', body: explain },
    missed: { cls: 'is-missed', head: answer.late ? 'Right on the second try' : 'Why', body: explain },
  };
  const view = states[answer.status] || states.missed;
  live.append(h('div', { class: `feedback ${view.cls}` },
    h('p', { class: 'feedback-head', tabindex: '-1', 'data-focus': '' }, h('span', { class: 'status-dot', 'aria-hidden': 'true' }), view.head),
    h('p', null, softBreaks(view.body))));
  return live;
}

function quizOptions(question, answer, resolved, pick) {
  const optionEls = list(question.options).map((option, j) => {
    const tried = answer.tries.includes(j);
    const isAnswer = resolved && j === question.answer;
    return h('button', {
      class: ['option', tried && !isAnswer ? 'is-tried' : '', isAnswer ? 'is-answer' : ''].join(' ').trim(),
      type: 'button', role: 'radio', 'aria-checked': String(answer.picked === j), tabindex: '-1', disabled: resolved,
      onclick: () => pick(j),
    },
    h('span', { class: 'key' }, String(j + 1)), optionLabel(option),
    isAnswer && h('span', { class: 'tag tag-answer' }, 'Correct answer'),
    tried && !isAnswer && h('span', { class: 'option-note' }, 'Your try'));
  });
  const focusable = optionEls[answer.picked ?? 0] || optionEls[0];
  if (focusable && !resolved) focusable.tabIndex = 0;
  return optionEls;
}

// Arrows move the pick, 1 to n pick directly, Enter checks.
function quizKeys(event, answer, count, { pick, check }) {
  const move = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 }[event.key];
  const number = Number.parseInt(event.key, 10);
  if (move) {
    event.preventDefault();
    pick(((answer.picked ?? -1) + move + count) % count);
  } else if (number >= 1 && number <= count) {
    event.preventDefault();
    pick(number - 1);
  } else if (event.key === 'Enter' && quizPicked(answer)) {
    event.preventDefault();
    check();
  }
}

function quizControls(i, count, answer, resolved, actions) {
  const checkButton = !resolved && h('button', {
    class: 'btn primary', type: 'button', disabled: !quizPicked(answer), onclick: actions.check,
  }, answer.status === 'retry' ? 'Check again' : 'Check');
  const showAnswer = answer.status === 'retry' && h('button', { class: 'link quiz-reveal', type: 'button', onclick: actions.reveal }, 'Show answer');
  return h('div', { class: 'step-controls quiz-controls' },
    h('button', { class: 'btn', type: 'button', disabled: i === 0, onclick: () => actions.go(i - 1) }, 'Back'),
    showAnswer,
    resolved
      ? h('button', { class: 'btn primary', type: 'button', onclick: () => actions.go(i + 1) }, i === count - 1 ? 'See your score' : 'Continue')
      : checkButton);
}

// actions: { pick(j), check(), reveal(), go(i), reset() }
function quizQuestionScreen(questions, state, i, actions) {
  const question = questions[i];
  const count = list(question.options).length;
  const answer = quizAnswerOf(state, i);
  const resolved = answer.status === 'right' || answer.status === 'missed';
  const group = h('div', {
    class: 'options', role: 'radiogroup', 'aria-label': question.question,
    onkeydown: (event) => { if (!resolved) quizKeys(event, answer, count, actions); },
  }, quizOptions(question, answer, resolved, actions.pick));
  return [
    h('div', { class: 'quiz-top' },
      h('span', { class: 'step-count' }, `Question ${i + 1} of ${questions.length}`),
      h('button', { class: 'link quiz-reset', type: 'button', onclick: actions.reset }, 'Reset')),
    quizProgress(questions, state, i, actions.go),
    h('h3', { class: 'quiz-q', tabindex: '-1', 'data-focus': answer.status === 'open' ? '' : null }, softBreaks(question.question)),
    group,
    quizFeedback(question, answer),
    quizControls(i, questions.length, answer, resolved, actions),
    h('p', { class: 'kbd-hint' }, 'Tip: press ', h('kbd', null, '1'), ' to ', h('kbd', null, String(count)), ' to pick, ', h('kbd', null, 'Enter'), ' to check.'),
  ];
}

function quizMissedList(data, missed, go) {
  return h('div', { class: 'quiz-missed' },
    h('p', { class: 'eyebrow quiet' }, 'To revisit'),
    h('ul', { class: 'rows' }, missed.map(({ q, i }) => {
      const lesson = quizLesson(q, data);
      return h('li', { class: 'quiz-missed-row' },
        h('button', { class: 'link', type: 'button', onclick: () => go(i) }, softBreaks(`${i + 1}. ${q.question}`)),
        lesson && h('a', { class: 'quiz-lesson', href: lesson.href }, softBreaks(`Read: ${lesson.label}`)));
    })));
}

function quizEndScreen(data, questions, state, { go, reset }) {
  const firstTry = questions.filter((_, i) => quizAnswerOf(state, i).status === 'right').length;
  const missed = questions.map((q, i) => ({ q, i, a: quizAnswerOf(state, i) })).filter(({ a }) => a.status !== 'right');
  return [
    h('div', { class: 'quiz-top' }, h('span', { class: 'step-count' }, 'Your score'),
      h('button', { class: 'link quiz-reset', type: 'button', onclick: reset }, 'Reset')),
    quizProgress(questions, state, -1, go),
    h('h3', { class: 'quiz-score', tabindex: '-1', 'data-focus': '' }, `${firstTry} of ${questions.length} on the first try`),
    h('div', { class: 'meter', 'aria-hidden': 'true' }, h('span', { style: `--share:${firstTry / questions.length}` })),
    missed.length
      ? quizMissedList(data, missed, go)
      : h('p', { class: 'quiz-perfect' }, 'Every answer right on the first try. This chapter is done.'),
    h('div', { class: 'step-controls quiz-controls' },
      h('button', { class: 'btn', type: 'button', onclick: () => go(questions.length - 1) }, 'Back'),
      h('button', { class: 'btn primary', type: 'button', onclick: reset }, 'Try again')),
  ];
}

// A right answer keeps its pick and pops; a wrong one shakes.
function quizCelebrate(card, answer) {
  const chosen = card.querySelectorAll('.option')[answer.tries[answer.tries.length - 1]];
  if (!chosen) return;
  if (answer.picked !== null) pop(chosen); else shake(chosen);
}

function renderQuiz(data, mount) {
  const questions = list(data.quiz);
  if (!questions.length) return null;
  const key = quizStoreKey(data.meta);
  let state = loadQuiz(key, questions.length) || { index: 0, answers: [] };
  const card = h('article', { class: 'panel quiz-card' });
  const persist = () => writeStore(key, JSON.stringify({ index: state.index, answers: state.answers }));
  const update = (i, next) => { state = quizWithAnswer(state, i, next); persist(); };
  const focusOption = (j) => { const el = card.querySelectorAll('.option')[j]; if (el) el.focus(); return el; };

  function go(index, { focus = true, link = true } = {}) {
