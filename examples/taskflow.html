// serve.api is { config, export, import }; a bare string is the config path.
function serveApi(context, name) {
  const api = context && context.serve && context.serve.api;
  if (api && typeof api === 'object' && typeof api[name] === 'string' && api[name].startsWith('/api/')) return api[name];
  if (name === 'config' && typeof api === 'string' && api.startsWith('/api/')) return api;
  return `/api/${name}`;
}

function serveFetch(context, url, options = {}) {
  return fetch(url, { ...options, headers: { ...(options.headers || {}), 'x-concept-explainer-token': context.serve.token } })
    .then((response) => response.text().then((body) => {
      let json = null;
      try {
        json = body ? JSON.parse(body) : null;
      } catch (error) {
        json = null;
      }
      if (!response.ok) throw new Error((json && (list(json.errors).join(' ') || json.error)) || `The server answered ${response.status}.`);
      return { json, body };
    }));
}

function commandBlock(lines) {
  return h('ul', { class: 'command-list' }, lines.map((line) => h('li', null, h('code', null, line), copyButton(() => line))));
}

const IMPORT_GROUPS = [['added', 'Added'], ['replaced', 'Replaced'], ['skipped', 'Skipped'], ['rejected', 'Rejected']];

function importSummary(result) {
  const rows = IMPORT_GROUPS.flatMap(([key, label]) => list(result && result[key]).map((item) => ({ label, item })));
  if (!rows.length) return h('p', { class: 'setting-hint' }, 'The bundle holds no explainers.');
  return h('table', { class: 'import-table' },
    h('caption', { class: 'sr-only' }, 'What the import would do'),
    h('thead', null, h('tr', null, h('th', { scope: 'col' }, 'Result'), h('th', { scope: 'col' }, 'Explainer'), h('th', { scope: 'col' }, 'Why'))),
    h('tbody', null, rows.map(({ label, item }) => h('tr', { class: `is-${label.toLowerCase()}` },
      h('td', null, h('span', { class: 'status-dot', 'aria-hidden': 'true' }), label),
      h('td', null, softBreaks(text(item.title, text(item.slug, Number.isInteger(item.index) ? `Item ${item.index + 1}` : 'Untitled')))),
      h('td', null, list(item.reasons).length ? list(item.reasons).join(' ') : text(item.reason, text(item.note, '')))))));
}

// Hub: export the picked explainers (or the filter), import a bundle.
function hubShareGroup(context, getSelection) {
  const served = Boolean(context && context.serve && context.serve.token);
  // Each action reports right above its own output.
  const status = h('p', { class: 'settings-status', role: 'status', 'aria-live': 'polite' });
  const importStatus = h('p', { class: 'settings-status', role: 'status', 'aria-live': 'polite' });
  const exportOut = h('div', { class: 'settings-commands' });
  const exportButton = h('button', { class: 'btn', type: 'button' }, icon('download'), 'Export');
  exportButton.addEventListener('click', () => {
    const { slugs, args, label, none } = getSelection();
    if (none) {
      status.textContent = 'No explainers match the filter, so there is nothing to export.';
      fill(exportOut);
      return;
    }
    if (served) {
      status.textContent = 'Preparing the bundle…';
      const query = slugs.length ? `?slugs=${slugs.map(encodeURIComponent).join(',')}` : '';
      serveFetch(context, `${serveApi(context, 'export')}${query}`)
        .then(({ body }) => {
          const many = `explainers-${new Date().toISOString().slice(0, 10)}.explainers.json`;
          downloadBlob(slugs.length === 1 ? `${slugs[0]}.explainers.json` : many, body);
          status.textContent = `Downloaded ${label}.`;
        })
        .catch((error) => { status.textContent = `Could not export: ${error.message}`; });
      return;
    }
    status.textContent = `This page cannot read the library files. Run this to export ${label}:`;
    fill(exportOut, commandBlock([`${CLI_NAME} export ${args}`.trim()]));
  });

  const importOut = h('div', { class: 'settings-commands' });
  const importRow = served ? importServed(context, importStatus, importOut) : [
    h('p', { class: 'setting-hint' }, 'This page cannot write to the library. Run this with the bundle you received:'),
    commandBlock([`${CLI_NAME} import <file.explainers.json> --dry-run`, `${CLI_NAME} import <file.explainers.json> --on-conflict rename`]),
  ];
  return h('section', { class: 'panel settings-group', 'aria-labelledby': 'settings-share-title' },
    h('div', { class: 'settings-legend' }, h('h2', { id: 'settings-share-title' }, 'Share'), h('span', { class: 'eyebrow quiet' }, 'Data only, no local paths')),
    h('div', { class: 'setting-row is-wide share-row' }, h('span', { class: 'setting-label' }, 'Export'),
      h('p', { class: 'setting-hint' }, 'Pick explainers with the boxes on their cards, or export every one the current filter shows.'),
      h('div', { class: 'btn-row' }, exportButton), status, exportOut),
    h('div', { class: 'setting-row is-wide share-row' }, h('span', { class: 'setting-label' }, 'Import'), importRow, importStatus, importOut));
}

function fileSize(bytes) {
  return bytes < 1024 ? `${bytes} B` : bytes < 1024 * 1024 ? `${(bytes / 1024).toFixed(1)} KB` : `${(bytes / 1024 / 1024).toFixed(1)} MB`;
}

// The drop zone with its hidden file input and "choose a file" button.
function importDropZone() {
  const input = h('input', { class: 'sr-only', type: 'file', id: 'import-file', accept: '.json,application/json', tabindex: '-1', 'aria-hidden': 'true' });
  const choose = h('button', { class: 'link drop-choose', type: 'button', onclick: () => input.click() }, 'or choose a file');
  const picked = h('div', { class: 'drop-picked', hidden: true });
  const zone = h('div', { class: 'drop-zone', 'aria-describedby': 'import-file-hint' },
    icon('upload'), h('span', { class: 'drop-title' }, 'Drop a .explainers.json file'), choose, picked);
  return { input, choose, picked, zone };
}

function importConflictChoice(onChange) {
  return optionGroup({
    variant: 'cards', value: 'rename', labelledBy: 'import-conflict-label', describedBy: 'import-conflict-hint',
    options: [
      { value: 'rename', label: 'Keep both', desc: 'Renames the new one with a -2' },
      { value: 'skip', label: 'Skip', desc: 'Keeps the one you have' },
      { value: 'replace', label: 'Replace', desc: 'Only one from the same source' },
    ],
    onChange,
  });
}

// The server wraps the result in { summary }; accept the bare shape too.
function importResult(raw) {
  return raw && raw.summary && typeof raw.summary === 'object' ? raw.summary : raw;
}

// Files dropped on the zone or picked with the input go to take(file).
function wireDropZone({ input, zone }, take) {
  input.addEventListener('change', () => take(input.files && input.files[0]));
  zone.addEventListener('dragover', (event) => { event.preventDefault(); zone.classList.add('is-over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('is-over'));
  zone.addEventListener('drop', (event) => {
    event.preventDefault();
    zone.classList.remove('is-over');
    take(event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0]);
  });
}

function importPickedRow(file, onRemove) {
  return [h('span', { class: 'drop-file' }, softBreaks(file.name)), h('span', { class: 'drop-size' }, fileSize(file.size)),
    h('button', { class: 'link', type: 'button', onclick: onRemove }, 'Remove')];
}

// What the dry run found, with the Import button; or what the import did.
function importOutcome(out, json, { dryRun, apply }) {
  if (dryRun) {
    const button = h('button', { class: 'btn primary', type: 'button' }, 'Import');
    button.addEventListener('click', () => apply(button));
    fill(out, importSummary(json), h('div', { class: 'btn-row' }, button));
    return;
  }
  fill(out, importSummary(json), h('div', { class: 'btn-row' }, h('button', { class: 'btn', type: 'button', onclick: () => window.location.reload() }, 'Reload')));
}

function resetDropZone(drop, out, status) {
  drop.picked.hidden = true;
  drop.zone.classList.remove('has-file');
  drop.input.value = '';
  fill(out);
  status.textContent = '';
  drop.choose.focus();
}

function importControls(drop, conflict) {
  return h('div', { class: 'import-controls' }, drop.input, drop.zone,
    h('p', { class: 'setting-hint', id: 'import-file-hint' }, `A bundle someone exported. Up to ${BUNDLE_MAX_LABEL}. Nothing changes until you press Import.`),
    h('div', { class: 'import-field' },
      h('span', { class: 'setting-label', id: 'import-conflict-label' }, 'If it is already in your library'),
      conflict.el,
      h('p', { class: 'setting-hint', id: 'import-conflict-hint' }, 'Applies to explainers with the same name.')));
}

// One unit in the control column: drop zone, conflict choice, dry-run
// summary, then the Import button. While an import runs nothing else
// starts, so a double press imports once.
function importServed(context, status, out) {
  const drop = importDropZone();
  let pending = null;
  let busy = false;
  let checkId = 0;
  const conflict = importConflictChoice(() => run(true));
  const clear = () => {
    if (busy) return;
    pending = null;
    resetDropZone(drop, out, status);
  };
  const settle = (job, applyButton, failed) => {
    busy = false;
    // Nothing was imported: the same file can be tried again.
    if (failed) { pending = job; if (applyButton) applyButton.disabled = false; }
  };
  function run(dryRun, applyButton) {
    if (!pending || busy) return;
    const job = pending;
    const id = ++checkId;
    if (!dryRun) { busy = true; pending = null; if (applyButton) applyButton.disabled = true; }
    status.textContent = dryRun ? 'Checking the bundle…' : 'Importing…';
    serveFetch(context, `${serveApi(context, 'import')}?onConflict=${conflict.read()}${dryRun ? '&dryRun=1' : ''}`, {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: job.text,
    }).then(({ json }) => {
      // A newer check (the conflict choice changed) replaces this one.
      if (dryRun && (id !== checkId || pending !== job)) return;
      status.textContent = dryRun ? `Here is what importing ${job.name} would do. Nothing has changed yet.` : 'Imported. Reload the library to see the new explainers.';
      importOutcome(out, importResult(json), { dryRun, apply: (button) => run(false, button) });
      if (!dryRun) settle(job, applyButton, false);
    }).catch((error) => {
      if (!dryRun) settle(job, applyButton, true);
      status.textContent = `Could not import: ${error.message}`;
    });
  }
  wireDropZone(drop, (file) => {
    if (!file || busy) return;
    if (file.size > BUNDLE_MAX_BYTES) { status.textContent = `${file.name} is over ${BUNDLE_MAX_LABEL}. Bundles must be smaller.`; return; }
    file.text().then((body) => {
      pending = { name: file.name, text: body };
      drop.zone.classList.add('has-file');
      fill(drop.picked, ...importPickedRow(file, clear));
      drop.picked.hidden = false;
      run(true);
    }).catch(() => { status.textContent = `Could not read ${file.name}.`; });
  });
  return importControls(drop, conflict);
}

// ---- sections.js ----
// Views without heavy interaction: the overview dashboard, where things
// live (tree), glossary and runbook. Each returns { open(parts) } for the
// router; open() returns the element a deep link points at, if any.

// Rough reading time, Brilliant style: a cue for how long the tour takes.
function tourMinutes(data) {
  const steps = list(data.flows).reduce((n, f) => n + list(f.steps).length, 0);
  const minutes = 2 + steps * 0.35 + list(data.concepts).length * 0.6 + list(data.quiz).length * 0.5 + list(data.changes).length * 0.3;
  return Math.max(3, Math.round(minutes));
}

function citedFiles(data) {
  const files = [
    ...list(data.nodes).flatMap((n) => list(n.files)),
    ...list(data.flows).flatMap((f) => list(f.steps).map((st) => st.file)),
    ...list(data.changes).flatMap((c) => list(c.files)),
    ...list(data.concepts).map((c) => c.file),
  ].filter((f) => typeof f === 'string' && f.trim());
  return new Set(files.map((f) => f.replace(/:\d+(-\d+)?$/, ''))).size;
}

function padNumber(n) {
  return String(n).padStart(2, '0');
}

function renderOverview(data, mount, ctx) {
  const meta = data.meta;
  const chapters = ctx.chapters;
  const nextSlot = h('div', { class: 'ov-next' });
  const progressSlot = h('div', { class: 'ov-progress' });
  const cards = chapters.map((chapter, i) => chapterCard(data, chapter, i));

  function refresh() {
    const keys = chapters.map((c) => c.key);
    const next = chapters.find((c) => !ctx.viewed.has(c.key));
    fill(nextSlot, nextUpCard(data, chapters, next));
    fill(progressSlot, progressCard(data, ctx.viewed.size(keys), keys.length));
    cards.forEach((card, i) => card.classList.toggle('is-viewed', ctx.viewed.has(chapters[i].key)));
  }

  mount.append(h('div', { class: 'overview' },
    h('header', { class: 'ov-head' },
      h('p', { class: 'eyebrow' }, softBreaks(text(meta.repo, 'Repository'))),
      h('h1', { id: 'view-overview-title', tabindex: '-1', class: fitClass(meta.title) }, softBreaks(meta.title)),
      meta.summary && h('p', { class: 'lede' }, softBreaks(meta.summary)),
      list(meta.stack).length > 0 && h('ul', { class: 'stack', 'aria-label': 'Built with' },
        list(meta.stack).map((item) => h('li', null, tag(item))))),
    nextSlot,
    progressSlot,
    glancePanel(data),
    chapters.length > 0 && h('section', { class: 'ov-chapters', 'aria-labelledby': 'ov-chapters-title' },
      h('div', { class: 'ov-section-head' }, h('h2', { id: 'ov-chapters-title' }, 'Chapters'),
        h('a', { class: 'eyebrow quiet', href: `#${chapters[0].key}` }, 'Start at chapter 1')),
      h('ul', { class: 'cards' }, cards.map((card) => h('li', null, card)))),
    latestChanges(data)));
  refresh();
  return { open: () => { refresh(); return null; } };
}

function nextUpCard(data, chapters, next) {
  if (!chapters.length) return null;
  const done = !next;
  const chapter = next || chapters[0];
  const index = chapters.indexOf(chapter);
  return h('article', { class: 'panel next-up' },
    h('p', { class: 'eyebrow' }, done ? 'All chapters viewed' : 'Next up'),
    h('p', { class: 'next-kicker' }, `Chapter ${index + 1} · ${chapterCount(chapter, data)}`),
    h('h2', { class: 'next-title' }, chapter.title),
    h('p', { class: 'next-line' }, chapter.lead),
    h('div', { class: 'next-actions' },
      h('a', { class: 'btn primary', href: `#${chapter.key}` }, done ? 'Start again' : `Open ${chapter.nav}`)));
}

function progressCard(data, viewedCount, total) {
  const meta = data.meta;
  const rows = [
    ['Tour', `${tourMinutes(data)} min`],
    meta.generatedAt && ['Generated', displayDate(meta.generatedAt)],
    meta.commit && ['Commit', String(meta.commit).slice(0, 7)],
  ].filter(Boolean);
  return h('article', { class: 'panel progress-card' },
    h('p', { class: 'eyebrow quiet' }, 'Your progress'),
    h('p', { class: 'prog-figure' }, h('span', { class: 'prog-done' }, String(viewedCount)), `of ${total} viewed`),
    h('div', { class: 'meter', 'aria-hidden': 'true' }, h('span', { style: `--share:${total ? viewedCount / total : 0}` })),
    h('dl', { class: 'prog-break' }, rows.map(([label, value]) => h('div', null, h('dt', null, label), h('dd', null, value)))),
    h('p', { class: 'prog-note' }, 'Only this browser remembers it.'));
}

function glancePanel(data) {
  const stats = [
    ['Layers', list(data.layers).length],
    ['Components', list(data.nodes).length],
    ['Flows', list(data.flows).length],
    ['Changes', list(data.changes).length],
    ['Files', citedFiles(data)],
  ].filter(([, value]) => value > 0);
  // A PR or a concept has no changes log or layers: show what it has.
  if (!stats.length) return null;
  return h('section', { class: 'panel glance', 'aria-label': 'At a glance' },
    h('p', { class: 'panel-bar' }, h('span', null, 'At a glance'), h('span', null, `${tourMinutes(data)} min tour`)),
    h('dl', { class: 'glance-grid' }, stats.map(([label, value]) => h('div', null,
      h('dt', null, label), h('dd', null, String(value))))));
}

function chapterCard(data, chapter, index) {
  return h('a', { class: 'card', href: `#${chapter.key}` },
    h('span', { class: 'top-row' }, h('span', null, padNumber(index + 1)),
      h('span', { class: 'card-count' }, chapterCount(chapter, data))),
    h('span', { class: `card-title ${fitClass(chapter.title)}` }, softBreaks(chapter.title)),
    h('span', { class: 'line' }, chapter.lead),
    h('span', { class: 'card-foot' }, h('span', { class: 'card-viewed' }, 'Viewed'), h('span', { class: 'card-open' }, 'Open')));
}

function latestChanges(data) {
  const changes = list(data.changes)
    .map((change, i) => ({ change, key: changeKey(change, i) }))
    .sort((a, b) => String(b.change.date).localeCompare(String(a.change.date)))
    .slice(0, 3);
  if (!changes.length) return null;
  return h('section', { class: 'panel ov-changes', 'aria-labelledby': 'ov-changes-title' },
    h('div', { class: 'panel-bar' }, h('h2', { id: 'ov-changes-title' }, 'Latest changes'),
      h('a', { href: '#changes' }, 'All changes')),
    h('ul', { class: 'rows' }, changes.map(({ change, key }) => h('li', null,
      h('a', { class: 'row-link', href: `#changes/${linkPart(key)}` },
        h('span', { class: 'row-date' }, displayDate(change.date, { fallback: 'undated' })),
        h('span', { class: 'row-title' }, softBreaks(change.title)),
        tag(change.authorType === 'agent' ? 'Agent' : 'Human'))))));
}

function renderTree(data, mount) {
  const entries = list(data.tree);
  const rows = entries.map((entry) => {
    const depth = String(entry.path).replace(/\/$/, '').split('/').length - 1;
    const isDir = String(entry.path).endsWith('/');
    return h('li', { class: entry.key ? 'is-key' : '', 'data-path': entry.path },
      h('span', { class: 'path', style: `padding-left:${Math.min(depth, 4) * 18}px` }, icon(isDir ? 'folder' : 'file'), h('span', { class: 'path-text' }, breakablePath(entry.path))),
      h('span', { class: 'note' }, entry.key && tag('Key', 'tag-key'), softBreaks(text(entry.note))));
  });
  mount.append(h('div', { class: 'panel' }, h('ul', { class: 'tree' }, rows)));
  return {
    open([path] = []) {
      const want = text(path).replace(/\/$/, '');
      const match = rows.find((row) => String(row.dataset.path).replace(/\/$/, '') === want);
      rows.forEach((row) => row.classList.toggle('is-target', row === match));
      return match || null;
    },
  };
}

function renderGlossary(data, mount) {
  const terms = list(data.glossary);
  const input = h('input', { class: 'search', type: 'search', placeholder: 'Search terms', 'aria-label': 'Search glossary' });
  const items = terms.map((term) => ({ term, el: h('div', null, h('dt', null, softBreaks(term.term)), h('dd', null, softBreaks(term.definition))) }));
  const filter = () => {
    const q = input.value.trim().toLowerCase();
    items.forEach(({ term, el }) => {
      el.hidden = Boolean(q) && !`${term.term} ${term.definition}`.toLowerCase().includes(q);
    });
  };
  input.addEventListener('input', filter);
  mount.append(h('div', { class: 'glossary-wrap' }, input, h('dl', { class: 'glossary' }, items.map((item) => item.el))));
  return {
    open([word] = []) {
      const want = text(word).toLowerCase();
      const match = want ? items.find(({ term }) => String(term.term).toLowerCase() === want) : null;
      if (match) {
        input.value = '';
        filter();
      }
      items.forEach(({ el }) => el.classList.toggle('is-target', Boolean(match) && el === match.el));
      return match ? match.el : null;
    },
  };
}

function renderRunbook(data, mount) {
  mount.append(h('div', { class: 'runbook' }, list(data.runbook).map((item, i) => {
    const copy = h('button', { class: 'btn small', type: 'button' }, 'Copy');
    copy.addEventListener('click', () => {
      navigator.clipboard.writeText(item.command)
        .then(() => { copy.textContent = 'Copied'; copy.dataset.state = 'done'; })
        .catch(() => { copy.textContent = 'Select to copy'; });
    });
    return h('article', { class: 'panel run-item' },
      h('div', { class: 'run-head' }, h('span', { class: 'run-n' }, padNumber(i + 1)), h('h3', null, softBreaks(item.label)), item.command && copy),
      item.note && h('p', { class: 'run-note' }, softBreaks(item.note)),
      item.command && codeBlock(item.command, 'sh'));
  })));
}

// ---- app.js ----
// Boot: read the embedded data and library context, build the dashboard
// shell (sidebar, phone bar, menu sheet) and show one view per hash.
const CHAPTERS = [
  { key: 'context', nav: 'Context', title: 'Why this exists', lead: 'The problem first, then what this aims for and what it leaves out.', count: (d) => list(d.context && d.context.goals).length, unit: ['goal', 'goals'], has: (d) => Boolean(d.context && d.context.problem), render: chRenderContext },
  { key: 'diff', nav: 'Files changed', title: 'What the change touches', lead: 'Each bar is one file, as long as its changed lines. Pick one to read what changed and which part it belongs to.', count: (d) => list(d.diff).length, unit: ['file', 'files'], has: (d) => list(d.diff).length > 0, render: chRenderDiff },
  { key: 'options', nav: 'Options', title: 'The options, side by side', lead: 'Every option on the same rows, pros and cons drawn as marks. The chosen one is marked.', count: (d) => list(d.options).length, unit: ['option', 'options'], has: (d) => list(d.options).length > 0, render: chRenderOptions },
  { key: 'risks', nav: 'Risks', title: 'What could go wrong', lead: 'Risks in rows by impact, the worst at the top. Pick one to see how it is handled.', count: (d) => list(d.risks).length, unit: ['risk', 'risks'], has: (d) => list(d.risks).length > 0, render: chRenderRisks },
  { key: 'rollout', nav: 'Rollout', title: 'How it ships', lead: 'The steps in order. Filled steps are done; the ringed one is next.', count: (d) => list(d.rollout).length, unit: ['step', 'steps'], has: (d) => list(d.rollout).length > 0, render: chRenderRollout },
  { key: 'timeline', nav: 'Timeline', title: 'What happened, when', lead: 'Events in the order of the record. The marker shape says what kind of moment it was.', count: (d) => list(d.timeline).length, unit: ['event', 'events'], has: (d) => list(d.timeline).length > 0, render: chRenderTimeline },
  { key: 'visuals', nav: 'Diagrams', title: 'The idea, drawn', lead: 'Each diagram answers one question. Pick a part to see what it does.', count: (d) => list(d.diagrams).length, unit: ['diagram', 'diagrams'], has: (d) => list(d.diagrams).length > 0, render: chRenderVisuals },
  { key: 'map', nav: 'Architecture', title: 'The big picture', lead: 'Every box is one part of the system. Pick one to see what it does and who it talks to.', count: (d) => list(d.nodes).length, unit: ['part', 'parts'], has: (d) => list(d.nodes).length > 0, render: renderMap },
  { key: 'flows', nav: 'Flows', title: 'Follow it end to end', lead: 'Pick a flow and press Continue. Each step is one hop, with the exact file that does the work.', count: (d) => list(d.flows).length, unit: ['flow', 'flows'], has: (d) => list(d.flows).length > 0, render: renderFlows },
  { key: 'code', nav: 'Code walkthrough', title: 'The code, line by line', lead: 'The few lines that carry the idea, one step at a time. Each step says what the lines do and why.', count: (d) => list(d.walkthroughs).length, unit: ['walkthrough', 'walkthroughs'], has: (d) => list(d.walkthroughs).length > 0, render: chRenderCode },
  { key: 'changes', nav: 'Changes', title: 'What changed, and why', lead: 'Recent merges from people and agents, each with its reason. Show them on the map to see which parts moved.', count: (d) => list(d.changes).length, unit: ['change', 'changes'], has: (d) => list(d.changes).length > 0, render: renderChanges },
  { key: 'tree', nav: 'Where things live', title: 'Where things live', lead: 'The folders worth knowing. Key ones are where most changes happen.', count: (d) => list(d.tree).length, unit: ['path', 'paths'], has: (d) => list(d.tree).length > 0, render: renderTree },
  { key: 'data', nav: 'Data model', title: 'The data', lead: 'What the system stores and how the pieces relate.', count: (d) => list(d.dataModel).length, unit: ['entity', 'entities'], has: (d) => list(d.dataModel).length > 0, render: renderModels },
  { key: 'concepts', nav: 'Key ideas', title: 'Key ideas', lead: 'The few patterns you need to read this code with confidence. One idea at a time.', count: (d) => list(d.concepts).length, unit: ['idea', 'ideas'], has: (d) => list(d.concepts).length > 0, render: renderConcepts },
  { key: 'quiz', nav: 'Check yourself', title: 'Check yourself', lead: 'A few quick questions. If you can answer these, you can find your way around.', count: (d) => list(d.quiz).length, unit: ['question', 'questions'], has: (d) => list(d.quiz).length > 0, render: renderQuiz },
  { key: 'glossary', nav: 'Glossary', title: 'Glossary', lead: 'Words this codebase uses in its own way.', count: (d) => list(d.glossary).length, unit: ['term', 'terms'], has: (d) => list(d.glossary).length > 0, render: renderGlossary },
  { key: 'run', nav: 'Run it', title: 'Run it yourself', lead: 'Commands to get it running on your machine.', count: (d) => list(d.runbook).length, unit: ['command', 'commands'], has: (d) => list(d.runbook).length > 0, render: renderRunbook },
];

// Default chapter order per explainer type, copied from presets/types/*.json
// (and TYPE_RULES.repo); test/type-chapters.test.mjs keeps them in step.
// "1 walkthrough", "3 walkthroughs": a chapter's count with its noun.
function chapterCount(chapter, data) {
  const [one, many] = chapter.unit;
  return plural(chapter.count(data), one, many);
}

// The build embeds the chapter list (context.chapters, from the one rule in
// scripts/lib/chapters.mjs), so the page never keeps its own copy. A page
// without it (an older build) falls back to meta.chapters, else every chapter
// with data in table order. Either way each key shows once, and only with data.
function chooseChapters(data, context) {
  const embedded = list(context && context.chapters).filter((key) => typeof key === 'string');
  const requested = list(data.meta && data.meta.chapters).filter((key) => typeof key === 'string');
  const order = embedded.length ? embedded : requested.length ? requested : CHAPTERS.map((c) => c.key);
  return [...new Set(order)]
    .map((key) => CHAPTERS.find((c) => c.key === key))
    .filter((chapter) => chapter && chapter.has(data))
    .map((chapter) => {
      const intro = (data.intros || {})[chapter.key];
      return { ...chapter, title: text(intro && intro.title, chapter.title), lead: text(intro && intro.lead, chapter.lead) };
    });
}

// ---------- Viewed chapters (this browser only) ----------
function viewedStore(meta) {
  const key = `concept-explainer:viewed:${text(meta.repo, meta.title)}:${text(meta.commit, '')}`;
  let viewed = new Set();
  try {
    viewed = new Set(list(JSON.parse(readStore(key) || '[]')).filter((v) => typeof v === 'string'));
  } catch (error) {
    viewed = new Set();
  }
  return {
    has: (k) => viewed.has(k),
    add: (k) => {
      if (viewed.has(k)) return;
      viewed = new Set([...viewed, k]);
      writeStore(key, JSON.stringify([...viewed]));
    },
    size: (keys) => keys.filter((k) => viewed.has(k)).length,
  };
}

// ---------- Shell ----------
function navList(chapters, data, links) {
  const item = (key, label, count) => {
    const a = h('a', { href: `#${key}`, 'data-nav': key },
      h('span', { class: 'nav-label' }, label),
      count !== null && h('span', { class: 'nav-count' }, String(count)));
    links.push(a);
    return h('li', null, a);
  };
  return h('nav', { class: 'links', 'aria-label': 'Explainer' },
    h('ul', null, item('overview', 'Overview', null)),
    h('p', { class: 'side-label' }, 'Chapters'),
    h('ul', null, chapters.map((c) => item(c.key, c.nav, c.count(data)))));
}

function footBits(meta, context, registry, progressLines, links) {
  const gear = settingsLink('#settings');
  links.push(gear.querySelector('a'));
  const library = safeHref(context.libraryHref);
  const progress = h('p', { class: 'side-progress' });
  progressLines.push(progress);
  return [
    progress,
    library && h('div', { class: 'side-util' }, h('a', { class: 'util', href: library }, h('span', { class: 'util-ic' }, icon('library_shelf')), 'Library')),
    h('div', { class: 'foot-row' }, gear, themeSwitch(registry)),
    (meta.generatedAt || meta.commit) && footMeta([meta.generatedAt && displayDate(meta.generatedAt), meta.commit && String(meta.commit).slice(0, 7)]),
  ];
}

function brandRow() {
  return h('a', { class: 'brand', href: '#overview' }, brandMark(), h('span', { class: 'name' }, 'Concept Explainer'));
}

function buildShell(data, chapters, context, registry) {
  const meta = data.meta;
  const links = [];
  const progressLines = [];
  const side = h('aside', { class: 'side', 'aria-label': 'Sidebar' },
    brandRow(),
    h('div', { class: 'side-repo' }, truncatable(h('b', null, softBreaks(meta.title)), meta.title),
      meta.repo && truncatable(h('span', { class: 'mono' }), meta.repo, { mode: 'middle' })),
    navList(chapters, data, links),
    h('div', { class: 'side-foot' }, footBits(meta, context, registry, progressLines, links)));

  const closeButton = h('button', { class: 'btn sheet-close', type: 'button' }, h('span', { class: 'close-icon', 'aria-hidden': 'true' }), 'Close');
  const sheet = h('dialog', { class: 'sheet', 'aria-label': 'Menu' },
    h('div', { class: 'sheet-head' }, truncatable(h('span', { class: 'name' }, softBreaks(meta.title)), meta.title), closeButton),
    navList(chapters, data, links),
    h('div', { class: 'sheet-foot' }, footBits(meta, context, registry, progressLines, links)));
  closeButton.addEventListener('click', () => sheet.close());
  sheet.addEventListener('click', (event) => {
    if (event.target === sheet || event.target.closest('a[href^="#"]')) sheet.close();
  });

  const barView = h('span', { class: 'bar-view' });
  const library = safeHref(context.libraryHref);
  const menuButton = h('button', { class: 'btn menu-button', type: 'button', 'aria-haspopup': 'dialog', onclick: () => sheet.showModal() },
    h('span', { class: 'menu-icon', 'aria-hidden': 'true' }), 'Menu');
  const top = h('header', { class: 'top' }, h('div', { class: 'bar' },
    h('a', { class: 'brand', href: '#overview', 'aria-label': 'Overview' }, brandMark(),
      h('span', { class: 'bar-names' }, truncatable(h('span', { class: 'name' }, softBreaks(meta.title)), meta.title), barView)),
    h('div', { class: 'bar-actions' },
      library && h('a', { class: 'btn bar-library', href: library }, 'Library'),
      quickTheme(registry),
      menuButton)));
  return { side, sheet, top, links, progressLines, barView };
}

// ---------- Views ----------
function viewHead(key, eyebrow, title, lead) {
  return h('header', { class: 'view-head' },
    h('p', { class: 'eyebrow quiet' }, eyebrow),
    h('h1', { id: `view-${key}-title`, tabindex: '-1' }, title),
    lead && h('p', { class: 'view-lead' }, lead));
}

function pager(chapters, index) {
  const prev = index > 0 ? chapters[index - 1] : { key: 'overview', nav: 'Overview' };
  const next = chapters[index + 1];
  const cell = (chapter, label, cls) => h('a', { class: `pager-link ${cls}`, href: `#${chapter.key}` },
    h('span', { class: 'eyebrow quiet' }, label), h('span', { class: 'pager-title' }, chapter.nav));
  return h('nav', { class: 'pager', 'aria-label': 'Chapters' },
    cell(prev, 'Previous', 'is-prev'),
    next ? cell(next, 'Next', 'is-next') : cell({ key: 'overview', nav: 'Overview' }, 'Done', 'is-next'));
}

function chapterView(chapter, index, chapters, data, ctx) {
  const body = h('div', { class: 'view-body' });
  const section = h('section', { class: 'view', 'data-view': chapter.key, hidden: true, 'aria-labelledby': `view-${chapter.key}-title` },
    viewHead(chapter.key, `Chapter ${index + 1} of ${chapters.length}`, chapter.title, chapter.lead),
    body,
    pager(chapters, index));
  let controller = null;
  try {
    controller = chapter.render(data, body, ctx) || null;
  } catch (error) {
    body.append(h('p', { class: 'empty' }, `This chapter could not be drawn: ${error.message}`));
  }
  return { key: chapter.key, title: chapter.title, nav: chapter.nav, section, controller };
}

function overviewView(data, ctx) {
  const body = h('div', { class: 'view-body' });
  const section = h('section', { class: 'view view-overview', 'data-view': 'overview', hidden: true, 'aria-labelledby': 'view-overview-title' }, body);
  const controller = renderOverview(data, body, ctx);
  return { key: 'overview', title: 'Overview', nav: 'Overview', section, controller };
}

// ---------- Routing (deep-link contract: references/library.md) ----------
function decodePart(part) {
  try {
    return decodeURIComponent(part);
  } catch (error) {
    return part;
  }
}

function parseHash(hash) {
  const raw = String(hash || '').replace(/^#/, '');
  if (!raw) return { view: 'overview', parts: [] };
  const [head, ...rest] = raw.split('/');
  return { view: decodePart(head), parts: rest.map(decodePart).filter((p) => p !== '') };
}

function createRouter(views, shell, chapters, viewed, meta) {
  const chapterKeys = chapters.map((c) => c.key);
  function paintProgress() {
    const line = `${viewed.size(chapterKeys)} / ${chapterKeys.length} viewed`;
    shell.progressLines.forEach((el) => { el.textContent = line; });
    shell.links.forEach((a) => a.classList.toggle('is-viewed', viewed.has(a.dataset.nav)));
  }

  function show(view) {
    views.forEach((v) => { v.section.hidden = v !== view; });
    setNavCurrent(shell.links, view.key);
    shell.barView.textContent = view.nav;
    document.title = view.key === 'overview' ? `${meta.title} · Concept Explainer` : `${view.title} · ${meta.title}`;
    if (view.key !== 'overview') viewed.add(view.key);
    paintProgress();
  }

  function route({ initial = false } = {}) {
    const { view: key, parts } = parseHash(window.location.hash);
    const view = views.find((v) => v.key === key) || views[0];
    show(view);
    let target = null;
    try {
      target = view.controller && view.controller.open ? view.controller.open(view.key === key ? parts : []) : null;
    } catch (error) {
      target = null;
    }
    if (initial && !window.location.hash) return;
    window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
    // A deep link to an item scrolls to it and focuses it (a reader action,
    // never an observer); otherwise focus goes to the view's heading.
    if (target && target.scrollIntoView) {
      if (!target.matches('a, button, input, select, textarea, [tabindex]')) target.setAttribute('tabindex', '-1');
      target.scrollIntoView({ block: 'center', behavior: 'instant' });
      target.focus({ preventScroll: true });
      return;
    }
    const heading = view.section.querySelector('h1');
    if (heading) heading.focus({ preventScroll: true });
  }

  window.addEventListener('hashchange', () => route());
  return { route };
}

function fatal(app, message) {
  fill(app, h('div', { class: 'fatal', role: 'alert' }, h('h1', null, 'This explainer could not load'), h('p', null, message)));
}

function boot() {
  // The serve token leaves the address bar before the router reads it.
  const context = withServe(readContext());
  applyLook(context);
  applyReading();
  const app = document.getElementById('app');
  let data;
  try {
    data = JSON.parse(document.getElementById('explainer-data').textContent);
  } catch (error) {
    fatal(app, `The embedded data is not valid JSON (${error.message}). Rebuild it with concept-explainer build.`);
    return;
  }
  if (!data || !data.meta || !data.meta.title) {
    fatal(app, 'The embedded data has no meta.title. Run concept-explainer validate to see what is missing.');
    return;
  }
  const chapters = chooseChapters(data, context);
  const viewed = viewedStore(data.meta);
  const registry = themeRegistry();
  const shell = buildShell(data, chapters, context, registry);
  const ctx = { chapters, viewed, context };
  const views = [overviewView(data, ctx), ...chapters.map((c, i) => chapterView(c, i, chapters, data, ctx)),
    settingsView(registry, { context, config: context.config || null, extra: [explainerShareGroup(data, context)] })];
  const meta = data.meta;
  const stamp = [meta.generatedAt && `Generated ${displayDate(meta.generatedAt)}`, meta.commit && `at ${String(meta.commit).slice(0, 7)}`].filter(Boolean).join(' ');
  const main = h('main', { id: 'main', class: 'main-col', tabindex: '-1' },
    shell.top,
    h('div', { class: 'wrap' }, views.map((v) => v.section),
      h('footer', { class: 'site-footer' },
        h('p', null, `${stamp ? `${stamp} ` : ''}with concept-explainer.`),
        designCredit())));
  fill(app, h('div', { class: 'app' }, shell.side, main), shell.sheet);
  app.removeAttribute('aria-busy');
  registry.paint();
  installThemeShortcut(registry);
  watchNavMore(shell.side.querySelector(':scope > .links'));
  wireSkipLink(main);
  createRouter(views, shell, chapters, viewed, data.meta).route({ initial: true });
}

boot();
})();
