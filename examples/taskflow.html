const CH_TRACK_STEP = 132;

const CH_STEP_WORDS = { done: 'Done', next: 'Next up', todo: 'Not started' };

// Each step's state: done, the first not done (next), or not started.
function chRolloutStates(steps) {
  const next = steps.findIndex((st) => st.done !== true);
  return steps.map((st, i) => (st.done === true ? 'done' : i === next ? 'next' : 'todo'));
}

function chRolloutButton(step, i, state) {
  return h('button', {
    class: `ch-step is-${state}`, type: 'button', 'aria-pressed': 'false', 'aria-label': `Step ${i + 1}: ${text(step.label)}, ${CH_STEP_WORDS[state]}`,
  },
  h('span', { class: 'ch-step-node', 'aria-hidden': 'true' }, state === 'done' ? '✓' : String(i + 1)),
  h('span', { class: 'ch-step-text' },
    h('span', { class: 'ch-step-state' }, CH_STEP_WORDS[state]),
    h('span', { class: 'ch-step-label' }, softBreaks(text(step.label)))));
}

function chRolloutDetail(step, i, count, state) {
  return [
    h('div', { class: 'step-top' }, h('span', { class: 'step-count' }, `Step ${i + 1} of ${count}`),
      h('span', { class: `ch-state${state === 'done' ? ' is-settled' : ''}${state === 'next' ? ' is-next' : ''}` }, h('span', { class: 'ch-state-mark', 'aria-hidden': 'true' }), CH_STEP_WORDS[state])),
    h('h3', null, softBreaks(text(step.label))),
    text(step.detail) && h('p', null, softBreaks(step.detail)),
    text(step.command) && chCommand(step.command),
  ];
}

// Progress and the track; across only when every step gets CH_TRACK_STEP pixels.
function chRolloutPanel(steps, buttons, states) {
  const done = states.filter((st) => st === 'done').length;
  const track = h('ol', { class: 'ch-track', style: `--steps:${steps.length}` }, buttons.map((b, i) => h('li', { class: `is-${states[i]}` }, b)));
  const panel = h('div', { class: 'panel ch-track-panel' },
    h('div', { class: 'ch-progress' },
      h('p', null, h('b', null, `${done} of ${steps.length}`), ' steps done'),
      h('div', { class: 'meter', 'aria-hidden': 'true' }, h('span', { style: `--share:${done / steps.length}` }))),
    track);
  chOnWidth(panel, (width) => track.classList.toggle('is-across', width - 48 >= steps.length * CH_TRACK_STEP));
  return panel;
}

/**
 * @param {object} data explainer data (reads data.rollout)
 * @param {HTMLElement} mount the chapter body
 * @returns {{ open: (parts: string[]) => Element|null }|null}
 */
function chRenderRollout(data, mount) {
  const steps = list(data.rollout).filter((st) => st && typeof st === 'object');
  if (!steps.length) {
    mount.append(h('p', { class: 'empty' }, 'No rollout steps listed.'));
    return null;
  }
  const states = chRolloutStates(steps);
  const next = states.indexOf('next');
  const detail = h('aside', { class: 'panel ch-detail', 'aria-live': 'polite' });
  const buttons = steps.map((step, i) => chRolloutButton(step, i, states[i]));
  const select = chSelection({
    buttons, detail, chapter: 'rollout', noun: 'step',
    empty: () => chEmptyDetail(next >= 0 ? `Next: ${text(steps[next].label)}` : 'Every step is done', 'Pick a step on the track to see what it involves and how to run it.'),
    describe: (i) => chRolloutDetail(steps[i], i, steps.length, states[i]),
  });
  mount.append(h('div', { class: 'ch-stack' }, chRolloutPanel(steps, buttons, states), detail));
  buttons.forEach((b, i) => riseIn(b, Math.min(i, 8) * 40));
  return chIndexOpener(select, steps.length);
}

// ---- chapters/timeline.js ----
// Chapter: timeline (incidents). A time axis with one marker per event,
// shaped by kind: detect, act, fix, learn. Across when the events fit,
// down on phones. Events are evenly spaced in record order: `at` is the time
// as written in the record, so it is shown, never parsed.
// Deep link: #timeline/<index> (from 0).

const CH_EVENT_KINDS = {
  detect: { label: 'Detect', shape: () => s('circle', { cx: 7, cy: 7, r: 5 }) },
  act: { label: 'Act', shape: () => s('rect', { x: 2.5, y: 2.5, width: 9, height: 9 }) },
  fix: { label: 'Fix', shape: () => s('path', { d: 'M7 1.5 L12.5 7 L7 12.5 L1.5 7 Z' }) },
  learn: { label: 'Learn', shape: () => s('path', { d: 'M7 2 L12.5 12 H1.5 Z' }) },
};
const CH_EVENT_SLOT = 84;

function chEventMark(kind) {
  const entry = CH_EVENT_KINDS[kind];
  return s('svg', { class: `ch-event-mark is-${entry ? kind : 'none'}`, viewBox: '0 0 14 14', width: 14, height: 14, 'aria-hidden': 'true' },
    entry ? entry.shape() : s('circle', { cx: 7, cy: 7, r: 3 }));
}

function chEventButton(ev) {
  return h('button', {
    class: 'ch-event', type: 'button', 'aria-pressed': 'false',
    'aria-label': `${text(ev.at)}: ${text(ev.label)}${CH_EVENT_KINDS[ev.kind] ? `, ${CH_EVENT_KINDS[ev.kind].label}` : ''}`,
  },
  h('span', { class: 'ch-event-dot' }, chEventMark(ev.kind)),
  h('span', { class: 'ch-event-text' },
    h('span', { class: 'ch-event-at' }, softBreaks(text(ev.at))),
    truncatable(h('span', { class: 'ch-event-label' }, softBreaks(text(ev.label))), text(ev.label))));
}

function chEventDetail(ev, i, count) {
  const kind = CH_EVENT_KINDS[ev.kind];
  return [
    h('div', { class: 'step-top' }, h('span', { class: 'step-count' }, `Event ${i + 1} of ${count}`),
      kind && h('span', { class: 'ch-impact' }, chEventMark(ev.kind), kind.label)),
    h('p', { class: 'ch-event-at' }, softBreaks(text(ev.at))),
    h('h3', null, softBreaks(text(ev.label))),
    text(ev.detail) && h('p', null, softBreaks(ev.detail)),
  ];
}

// The legend and the axis; across only when every event gets CH_EVENT_SLOT pixels.
function chTimelinePanel(events, buttons) {
  const used = Object.keys(CH_EVENT_KINDS).filter((k) => events.some((ev) => ev.kind === k));
  const axis = h('ol', { class: 'ch-axis', style: `--events:${events.length}` }, buttons.map((b, i) => h('li', { class: i % 2 ? 'is-low' : 'is-high' }, b)));
  const panel = h('div', { class: 'panel ch-timeline' },
    used.length > 0 && h('p', { class: 'ch-legend', 'aria-hidden': 'true' }, used.map((k) => h('span', null, chEventMark(k), CH_EVENT_KINDS[k].label))),
    axis);
  chOnWidth(panel, (width) => axis.classList.toggle('is-across', width - 48 >= events.length * CH_EVENT_SLOT));
  return panel;
}

/**
 * @param {object} data explainer data (reads data.timeline)
 * @param {HTMLElement} mount the chapter body
 * @returns {{ open: (parts: string[]) => Element|null }|null}
 */
function chRenderTimeline(data, mount) {
  const events = list(data.timeline).filter((ev) => ev && typeof ev === 'object');
  if (!events.length) {
    mount.append(h('p', { class: 'empty' }, 'No events recorded.'));
    return null;
  }
  const detail = h('aside', { class: 'panel ch-detail', 'aria-live': 'polite' });
  const buttons = events.map(chEventButton);
  const select = chSelection({
    buttons, detail, chapter: 'timeline', noun: 'event',
    empty: () => chEmptyDetail('Pick an event', 'Events run in the order of the record. The marker shape says what kind of moment it was.'),
    describe: (i) => chEventDetail(events[i], i, events.length),
  });
  mount.append(h('div', { class: 'ch-stack' }, chTimelinePanel(events, buttons), detail));
  buttons.forEach((b, i) => riseIn(b, Math.min(i, 10) * 30));
  return chIndexOpener(select, events.length);
}

// ---- chapters/code.js ----
// Chapter: code walkthrough (walkthroughs[]). One real snippet, its important
// lines annotated in reading order, one step at a time with Back / Continue,
// then the takeaway. Deep links: #code/<id>, #code/<id>/<n> (steps counted
// from 1, like flow steps) and #code/<id>/done (the takeaway).

const CH_CODE_KINDS = { what: 'What it does', why: 'Why', gotcha: 'Watch out', input: 'Input', output: 'Output' };
const CH_CODE_HASH = new Set(['python', 'ruby', 'sh', 'yaml', 'toml', 'dockerfile', 'make', 'elixir', 'hcl', 'r', 'perl']);
const CH_CODE_DASH = new Set(['sql', 'lua', 'haskell']);
const CH_CODE_KEYWORDS = new Set(('abstract as async await break case catch class const continue def defer del do elif else enum except '
  + 'export extends false final finally fn for from func function go if impl implements import in instanceof interface is lambda '
  + 'let loop match mod module mut new nil none not null of or and package pass private protected pub public raise return '
  + 'select self static struct super switch this throw throws trait true try type typeof use var void where while with yield '
  + 'SELECT FROM WHERE INSERT INTO UPDATE DELETE JOIN LEFT INNER ON AND OR NOT NULL ORDER BY GROUP LIMIT VALUES SET CREATE TABLE INDEX AS '
  + 'True False None').split(' '));
const CH_CODE_STICKY = 96;

/** "3" or "3-5" as { from, to }, or null. */
function chCodeLines(value) {
  const match = typeof value === 'string' ? value.trim().match(/^(\d+)(?:-(\d+))?$/) : null;
  if (!match) return null;
  const from = Number(match[1]);
  const to = Number(match[2] || match[1]);
  return to >= from ? { from, to } : null;
}

/** Where a walkthrough's lines start and end in its file (1..n when illustrative). */
function chCodeRange(walk) {
  const count = String(walk.code || '').replace(/\r\n?/g, '\n').split('\n').length;
  const match = walk.illustrative !== true && typeof walk.file === 'string' ? walk.file.match(/^(.+):(\d+)(?:-(\d+))?$/) : null;
  const start = match ? Number(match[2]) : 1;
  return { path: match ? match[1] : null, start, end: start + count - 1 };
}

/**
 * Split one line into [className|null, text] pieces: comments, strings and
 * keywords only. `state.block` carries an open block comment to the next line.
 */
function chCodeTokens(line, lang, state) {
  const parts = [];
  const push = (cls, value) => {
    if (!value) return;
    const last = parts[parts.length - 1];
    if (last && last[0] === cls) last[1] += value; else parts.push([cls, value]);
  };
  const hash = CH_CODE_HASH.has(lang);
  const dash = CH_CODE_DASH.has(lang);
  let i = 0;
  while (i < line.length) {
    if (state.block) {
      const close = line.indexOf('*/', i);
      const end = close < 0 ? line.length : close + 2;
      push('cm', line.slice(i, end));
      if (close >= 0) state.block = false;
      i = end;
    } else if (!hash && line.startsWith('/*', i)) {
      state.block = true;
    } else if ((!hash && !dash && line.startsWith('//', i)) || (hash && line[i] === '#') || (dash && line.startsWith('--', i))) {
      push('cm', line.slice(i));
      i = line.length;
    } else if (line[i] === '"' || line[i] === "'" || line[i] === '`') {
      const quote = line[i];
      let j = i + 1;
      while (j < line.length && line[j] !== quote) j += line[j] === '\\' ? 2 : 1;
      push('st', line.slice(i, Math.min(j + 1, line.length)));
      i = Math.min(j + 1, line.length);
    } else {
      const word = line.slice(i).match(/^[A-Za-z_$][\w$]*/);
      if (word) {
        push(CH_CODE_KEYWORDS.has(word[0]) ? 'kw' : null, word[0]);
        i += word[0].length;
      } else {
        push(null, line[i]);
        i += 1;
      }
    }
  }
  return parts;
}

/** The index of the first step that covers a file line, or -1. */
function chCodeStepAt(walk, line) {
  return list(walk.steps).findIndex((step) => {
    const lines = chCodeLines(step && step.lines);
    return lines && line >= lines.from && line <= lines.to;
  });
}

/**
 * The deep link to a walkthrough covering a cited file line ("path:42" or
 * "path:40-44"), at the step that covers it, or null. For flow steps with
 * code and concepts with a file: "Walk through this code".
 */
function chWalkthroughFor(data, fileRef) {
  const match = typeof fileRef === 'string' ? fileRef.match(/^(.+?):(\d+)(?:-\d+)?$/) : null;
  if (!match) return null;
  const line = Number(match[2]);
  const walks = list(data && data.walkthroughs);
  for (let i = 0; i < walks.length; i += 1) {
    const walk = walks[i];
    if (walk && walk.illustrative !== true && text(walk.id)) {
      const range = chCodeRange(walk);
      if (range.path === match[1] && line >= range.start && line <= range.end) {
        const step = chCodeStepAt(walk, line);
        return `#code/${linkPart(walk.id)}/${step >= 0 ? step + 1 : 1}`;
      }
    }
  }
  return null;
}

/** A "Walk through this code" link for a cited file line, or null. */
function chWalkthroughLink(data, fileRef) {
  const href = chWalkthroughFor(data, fileRef);
  return href ? h('a', { class: 'link ch-walk-link', href }, 'Walk through this code') : null;
}

function chCodeRefs(refs, data) {
  if (!refs || typeof refs !== 'object') return null;
  const nodes = byId(data.nodes);
  const flow = list(data.flows).find((f) => f && f.id === refs.flow);
  const concept = Number.isInteger(refs.concept) ? list(data.concepts)[refs.concept] : null;
  const items = [
    refs.node !== undefined && nodes.has(refs.node) && ['On the map', `#map/${linkPart(refs.node)}`, text(nodes.get(refs.node).label, refs.node)],
    flow && ['In the flow', `#flows/${linkPart(flow.id)}${Number.isInteger(refs.step) ? `/${refs.step}` : ''}`,
      `${text(flow.title, flow.id)}${Number.isInteger(refs.step) ? `, step ${refs.step}` : ''}`],
    concept && ['Key idea', `#concepts/${refs.concept}`, text(concept.title)],
    typeof refs.glossary === 'string' && refs.glossary && ['Term', `#glossary/${linkPart(refs.glossary)}`, refs.glossary],
  ].filter(Boolean);
  if (!items.length) return null;
  return h('ul', { class: 'ch-code-refs', 'aria-label': 'See also' }, items.map(([label, href, name]) => h('li', null,
    h('span', { class: 'detail-label' }, label), h('a', { class: 'link', href }, softBreaks(name)))));
}

function chCodeDots(count, current, go) {
  return h('div', { class: 'ch-code-dots' }, Array.from({ length: count }, (_, i) => h('button', {
    type: 'button', class: i === current ? 'is-current' : i < current ? 'is-done' : '', 'aria-label': `Go to step ${i + 1}`,
    'aria-current': i === current ? 'step' : null, onclick: () => go(i),
  })));
}

function chCodeHead(walk) {
  return [
    h('h2', { class: 'ch-code-title' }, softBreaks(text(walk.title))),
    text(walk.why) && h('p', { class: 'ch-code-why' }, softBreaks(walk.why)),
    h('div', { class: 'ch-code-meta' },
      walk.illustrative === true ? tag('Illustrative, not from a repo', 'ch-illustrative') : text(walk.file) && fileChip(walk.file),
      text(walk.lang) && tag(walk.lang)),
  ];
}

/** The line gutter and code: one row per line, numbers that a step covers jump to it. */
function chCodeRows(walk, go) {
  const range = chCodeRange(walk);
  const tokens = { block: false };
  const lang = text(walk.lang, 'text').toLowerCase();
  return String(walk.code).replace(/\r\n?/g, '\n').split('\n').map((line, k) => {
    const number = range.start + k;
    const step = chCodeStepAt(walk, number);
    const num = step >= 0
      ? h('button', { class: 'ch-code-num', type: 'button', 'aria-label': `Line ${number}, step ${step + 1}`, onclick: () => go(step) }, String(number))
      : h('span', { class: 'ch-code-num', 'aria-hidden': 'true' }, String(number));
    const textEl = h('span', { class: 'ch-code-text' }, line ? chCodeTokens(line, lang, tokens).map(([cls, value]) => (cls ? h('span', { class: cls }, value) : value)) : ' ');
    return h('div', { class: `ch-code-row${step >= 0 ? ' is-covered' : ''}`, 'data-line': String(number) }, num, textEl);
  });
}

/** Mark the current step's lines; the panel dims the rest while a step is shown. */
function chCodePaintRows(panel, rows, step) {
  const lines = step ? chCodeLines(step.lines) : null;
  panel.classList.toggle('has-step', Boolean(lines));
  rows.forEach((row) => {
    const n = Number(row.dataset.line);
    row.classList.toggle('is-current', Boolean(lines) && n >= lines.from && n <= lines.to);
  });
}

/** The annotation card for one step: lines, note, why, links, progress and controls. */
function chCodeStepCard(walk, index, data, go) {
  const steps = list(walk.steps);
  const step = steps[index];
  const lines = chCodeLines(step.lines);
  return [
    h('div', { class: 'step-top' },
      h('span', { class: 'step-count' }, `Step ${index + 1} of ${steps.length}`),
      CH_CODE_KINDS[step.kind] && tag(CH_CODE_KINDS[step.kind], `ch-code-kind is-${step.kind}`)),
    h('p', { class: 'ch-code-lines' }, lines ? (lines.from === lines.to ? `Line ${lines.from}` : `Lines ${lines.from} to ${lines.to}`) : text(step.lines)),
    h('p', { class: 'ch-code-note' }, softBreaks(text(step.note))),
    text(step.why) && h('div', { class: 'why' }, h('p', { class: 'eyebrow quiet' }, 'Why it is written this way'), h('p', null, softBreaks(step.why))),
    chCodeRefs(step.refs, data),
    h('div', { class: 'step-controls' },
      chCodeDots(steps.length, index, go),
      h('button', { class: 'btn', type: 'button', disabled: index === 0, onclick: () => go(index - 1) }, 'Back'),
      h('button', { class: 'btn primary', type: 'button', onclick: () => go(index + 1) }, index === steps.length - 1 ? 'Takeaway' : 'Continue')),
    h('p', { class: 'kbd-hint' }, 'Tip: ', h('kbd', null, '→'), ' or ', h('kbd', null, 'j'), ' for the next step, ', h('kbd', null, '←'), ' or ', h('kbd', null, 'k'), ' to go back.'),
  ];
}

/** The takeaway card, with Replay and, when there is one, Next walkthrough. */
function chCodeDoneCard(walk, lineCount, { replay, next }) {
  return [h('div', { class: 'ch-code-done' },
    h('p', { class: 'eyebrow quiet' }, 'Takeaway'),
    h('h3', null, softBreaks(text(walk.takeaway, text(walk.title)))),
    h('p', { class: 'ch-code-done-line' }, `${chCount(list(walk.steps).length, 'step')} through ${chCount(lineCount, 'line')} of code.`),
    h('div', { class: 'btn-row' },
      h('button', { class: 'btn', type: 'button', onclick: replay }, 'Replay'),
      next && h('button', { class: 'btn primary', type: 'button', onclick: next }, 'Next walkthrough')))];
}

/** Arrow keys and j / k step through, outside fields, pickers and the progress bar. */
function chCodeKeys(root, view) {
  root.addEventListener('keydown', (event) => {
    if (event.altKey || event.ctrlKey || event.metaKey || (event.target.closest && event.target.closest('input, textarea, .ch-pick, .ch-code-dots'))) return;
    const { done, step } = view.state();
    if (event.key === 'ArrowRight' || event.key === 'j') { event.preventDefault(); if (!done) view.go(step + 1); }
    if (event.key === 'ArrowLeft' || event.key === 'k') { event.preventDefault(); view.go(done ? view.stepCount() - 1 : step - 1); }
  });
}

/** Re-fill a card and keep keyboard focus inside it (the old buttons are gone). */
function chCodeRefill(card, children) {
  const hadFocus = card.contains(document.activeElement);
  fill(card, ...children);
  if (!hadFocus) return;
  const target = [...card.querySelectorAll('.btn.primary, .btn')].find((b) => !b.disabled);
  if (target) target.focus({ preventScroll: true });
}

/** The picker for several walkthroughs. */
function chCodePicks(walks, onPick) {
  const picks = walks.map((walk, i) => h('button', { class: 'ch-pick', type: 'button', 'aria-pressed': 'false', onclick: () => onPick(i) },
    h('span', { class: 'ch-pick-top' }, h('span', null, String(i + 1).padStart(2, '0')), h('span', null, chCount(list(walk.steps).length, 'step'))),
    h('span', { class: 'ch-pick-title' }, softBreaks(text(walk.title, text(walk.id))))));
  chRoving(picks, { onMove: onPick });
  return picks;
}

/** Steps from 1 in the hash, or "done" for the takeaway. */
function chCodeLink(walk, index, state) {
  setDeepLink(`code/${linkPart(text(walk.id, String(index)))}/${state.done ? 'done' : state.step + 1}`);
}

/** #code/<id>, #code/<id>/<n> (steps from 1) and #code/<id>/done. */
function chCodeOpener(walks, card, view) {
  return {
    open([id, n] = []) {
      const index = id === undefined ? -1 : walks.findIndex((w, i) => text(w.id, String(i)) === id);
      if (index < 0) return null;
      if (index !== view.current()) view.pickWalk(index, { linkIt: false });
      const count = list(walks[index].steps).length;
      const wanted = Number.parseInt(n, 10);
      if (n === 'done') view.go(count, { linkIt: false });
      else view.go(Number.isInteger(wanted) && wanted >= 1 && wanted <= count ? wanted - 1 : 0, { linkIt: false });
      return card;
    },
  };
}

/** Draw a walkthrough's head and code; returns the line rows. */
function chCodeDrawWalk(walk, head, panel, go) {
  fill(head, ...chCodeHead(walk));
  const rows = chCodeRows(walk, go);
  const range = chCodeRange(walk);
  fill(panel, h('div', { class: 'ch-code', role: 'group', 'aria-label': `Code, lines ${range.start} to ${range.end}` }, rows));
  return rows;
}

/** The card follows the reader only while it fits on screen: no inner scroll areas. */
function chCodeStickyCard(card) {
  if (!('ResizeObserver' in window)) return;
  new ResizeObserver(() => card.classList.toggle('is-static', card.offsetHeight > window.innerHeight - CH_CODE_STICKY)).observe(card);
}

/**
 * @param {object} data explainer data (reads data.walkthroughs)
 * @param {HTMLElement} mount the chapter body
 * @returns {{ open: (parts: string[]) => Element|null }|null}
 */
function chRenderCode(data, mount) {
  const walks = list(data.walkthroughs).filter((w) => w && typeof w === 'object' && text(w.code) && list(w.steps).length);
  if (!walks.length) {
    mount.append(h('p', { class: 'empty' }, 'No code walkthroughs in this explainer.'));
    return null;
  }
  const head = h('div', { class: 'ch-code-head' });
  const card = h('div', { class: 'panel ch-code-card', 'aria-live': 'polite' });
  const panel = h('div', { class: 'panel ch-code-panel' });
  let state = { walk: 0, step: 0, done: false };
  let rows = [];
  const walkOf = () => walks[state.walk];
  const steps = () => list(walkOf().steps);

  function render(direction = 0) {
    chCodeRefill(card, state.done
      ? chCodeDoneCard(walkOf(), rows.length, { replay: () => go(0), next: state.walk + 1 < walks.length ? () => pickWalk(state.walk + 1) : null })
      : chCodeStepCard(walkOf(), state.step, data, go));
    chCodePaintRows(panel, rows, state.done ? null : steps()[state.step]);
    if (direction) slideIn(card.firstElementChild, direction);
  }

  function go(index, { linkIt = true } = {}) {
    const before = state.done ? steps().length : state.step;
    state = index >= steps().length ? { ...state, done: true } : { ...state, step: Math.max(0, index), done: false };
    const after = state.done ? steps().length : state.step;
    render(Math.sign(after - before));
    if (linkIt) chCodeLink(walkOf(), state.walk, state);
  }

  function pickWalk(i, { linkIt = true } = {}) {
    state = { walk: i, step: 0, done: false };
    rows = chCodeDrawWalk(walkOf(), head, panel, go);
    chMarkCurrent(picks, i);
    render();
    if (linkIt) chCodeLink(walkOf(), i, state);
  }

  const picks = chCodePicks(walks, (i) => pickWalk(i));
  const root = h('div', { class: 'ch-code-chapter' },
    walks.length > 1 && h('div', { class: 'ch-pick-list', role: 'group', 'aria-label': 'Walkthroughs' }, picks),
    head, h('div', { class: 'ch-cq' }, h('div', { class: 'ch-code-layout' }, panel, card)));
  chCodeKeys(root, { state: () => state, go, stepCount: () => steps().length });
  chCodeStickyCard(card);
  pickWalk(0, { linkIt: false });
  mount.append(root);
  return chCodeOpener(walks, card, { current: () => state.walk, pickWalk, go });
}

// ---- chapters/hooks.js ----
// Helpers the existing chapters call for v2 data: node status markers on the
// map, before/after flow pairs, and concept parts with a concept visual.
// Each returns an element (or null when the data has nothing to show), so a
// caller can drop it into an h() children list as is.

// ---------- Map: node status (added, changed, removed, unchanged) ----------
const CH_NODE_STATUSES = ['added', 'changed', 'removed'];

/** The small marker for a map node with a status; null for unchanged or none. */
function chNodeStatus(node) {
  const status = node && node.status;
  if (!CH_NODE_STATUSES.includes(status)) return null;
  return h('span', { class: `ch-node-status is-${status}` }, chStatusMark(status), h('span', { class: 'sr-only' }, `, ${CH_STATUS_LABELS[status].toLowerCase()}`));
}

/** Attributes for a node button: data-status drives the ring (dashed when removed). */
function chNodeStatusAttrs(node) {
  const status = node && node.status;
  return CH_NODE_STATUSES.includes(status) ? { 'data-status': status } : {};
}

/** The status line for the map detail panel. */
function chNodeStatusTag(node) {
  const status = node && node.status;
  return CH_NODE_STATUSES.includes(status) || status === 'unchanged' ? chStatusTag(status) : null;
}

/** Legend entries for the statuses the map uses, or null when none. */
function chStatusLegend(nodes) {
  const used = CH_NODE_STATUSES.filter((status) => list(nodes).some((n) => n && n.status === status));
  if (!used.length) return null;
  return used.map((status) => h('span', { class: 'ch-legend-status' }, chStatusMark(status), CH_STATUS_LABELS[status]));
}

// ---------- Flows: before/after pairs ----------

/** The before and after flows sharing this flow's pair id, or null. */
function chFlowPair(flows, flow) {
  if (!flow || typeof flow.pair !== 'string' || !flow.pair) return null;
  const same = list(flows).filter((f) => f && f.pair === flow.pair);
  const before = same.find((f) => f.variant === 'before') || null;
  const after = same.find((f) => f.variant === 'after') || null;
  return before && after ? { pair: flow.pair, before, after } : null;
}

/** Flows grouped for a picker: a pair becomes one entry { pair, before, after }; others { flow }. */
function chFlowGroups(flows) {
  const seen = new Set();
  return list(flows).flatMap((flow) => {
    const pair = chFlowPair(flows, flow);
    if (!pair) return [{ flow }];
    if (seen.has(pair.pair)) return [];
    seen.add(pair.pair);
    return [pair];
  });
}

/** "Before" or "After" as a small tag for a flow with a variant, else null. */
function chVariantTag(flow) {
  if (!flow || (flow.variant !== 'before' && flow.variant !== 'after')) return null;
  return tag(flow.variant === 'before' ? 'Before' : 'After', `ch-variant is-${flow.variant}`);
}

/**
 * A Before | After switch for a pair (uses the .seg control from diagrams.css).
 * onPick(flowId) is called with the picked flow's id.
 */
function chPairSwitch(pair, currentId, onPick) {
  if (!pair) return null;
  const sides = [['Before', pair.before], ['After', pair.after]];
  const buttons = sides.map(([label, flow]) => h('button', {
    class: 'seg-option', type: 'button', 'aria-pressed': String(flow.id === currentId), onclick: () => onPick(flow.id),
  }, label));
  chRoving(buttons, { axis: 'x', onMove: (i) => onPick(sides[i][1].id) });
  buttons.forEach((b, i) => { b.tabIndex = sides[i][1].id === currentId ? 0 : -1; });
  return h('div', { class: 'seg ch-pair-switch', role: 'group', 'aria-label': 'Before or after' }, buttons);
}

function chFlowActors(flow) {
  return [...new Set(list(flow && flow.steps).flatMap((st) => [st.from, st.to]))];
}

/**
 * Before and after side by side: each flow's hops in order, with the parts
 * only one side uses marked + (new) or − (gone).
 * @param {{ before: object, after: object }} pair from chFlowPair
 * @param {Map<string, object>} nodeIndex byId(data.nodes)
 * @param {(flowId: string, step: number) => void} [onOpen] called with a flow id and a 1-based step
 */
function chPairCompare(pair, nodeIndex, onOpen) {
  if (!pair) return null;
  const actors = { before: new Set(chFlowActors(pair.before)), after: new Set(chFlowActors(pair.after)) };
  const name = (id) => text(nodeIndex && nodeIndex.get(id) && nodeIndex.get(id).label, String(id));
  const side = (key, label) => {
    const flow = pair[key];
    const other = actors[key === 'before' ? 'after' : 'before'];
    const only = [...actors[key]].filter((id) => !other.has(id));
    return h('section', { class: `ch-pair-side is-${key}`, 'aria-label': `${label}: ${text(flow.title)}` },
      h('p', { class: 'eyebrow quiet' }, label, h('span', { class: 'ch-pair-count' }, chCount(list(flow.steps).length, 'step'))),
      h('p', { class: 'ch-pair-title' }, softBreaks(text(flow.title))),
      only.length > 0 && h('p', { class: 'ch-pair-only' }, only.map((id) => h('span', { class: 'ch-status' }, chStatusMark(key === 'after' ? 'added' : 'removed'), softBreaks(name(id))))),
      h('ol', { class: 'ch-pair-steps' }, list(flow.steps).map((st, i) => h('li', null,
        h('button', { class: 'ch-pair-step', type: 'button', disabled: !onOpen, onclick: () => onOpen && onOpen(flow.id, i + 1) },
          h('span', { class: 'ch-pair-n' }, String(i + 1)),
          h('span', { class: 'ch-pair-hop' },
            h('span', { class: 'ch-pair-route' }, softBreaks(name(st.from)), st.from !== st.to && [' → ', softBreaks(name(st.to))]),
            h('span', { class: 'ch-pair-label' }, softBreaks(text(st.label)))))))));
  };
  return h('div', { class: 'ch-cq' }, h('div', { class: 'ch-pair' }, side('before', 'Before'), h('div', { class: 'ch-pair-arrow', 'aria-hidden': 'true' }), side('after', 'After')));
}

// ---------- Concepts: parts and a visual ----------

/**
 * A concept broken into parts: a chain of named pieces, each selectable,
 * with its detail beside the chain. Returns null without parts.
 */
function chConceptParts(concept) {
  const parts = list(concept && concept.parts).filter((p) => p && typeof p === 'object' && text(p.label));
  if (!parts.length) return null;
  const detail = h('div', { class: 'ch-parts-detail', 'aria-live': 'polite' });
  let selected = null;
  const buttons = parts.map((part, i) => h('button', {
    class: 'ch-part', type: 'button', 'aria-pressed': 'false', onclick: () => select(selected === i ? null : i),
  }, h('span', { class: 'ch-part-n', 'aria-hidden': 'true' }, String(i + 1)), h('span', { class: 'ch-part-label' }, softBreaks(part.label))));
  chRoving(buttons, { onMove: (i) => select(i) });

  function select(index) {
    selected = index;
    chMarkCurrent(buttons, index);
    if (index === null) {
      fill(detail, h('p', { class: 'ch-parts-tip' }, `${chCount(parts.length, 'part')}. Pick one to see what it does.`));
      return;
    }
    const part = parts[index];
    fill(detail, h('p', { class: 'eyebrow quiet' }, `Part ${index + 1} of ${parts.length}`),
      h('p', { class: 'ch-parts-label' }, softBreaks(part.label)),
      text(part.detail) && h('p', null, softBreaks(part.detail)));
  }
  select(null);
  return h('div', { class: 'ch-parts' },
    h('ol', { class: 'ch-part-chain', 'aria-label': 'Parts' }, buttons.map((b) => h('li', null, b))),
    detail);
}

/** The concept's visual (one of the nine kinds) with its own detail panel, or null. */
function chConceptVisual(concept) {
  const visual = concept && concept.visual;
  if (!visual || typeof visual !== 'object' || !vizDrawer(visual.kind)) return null;
  return vizFigure(visual, { title: visual.title, caption: visual.caption, headingLevel: 'h4', compact: true }).root;
}

/** Both, in teaching order: the parts first, then the picture that joins them. */
function chConceptExtras(concept) {
  const parts = chConceptParts(concept);
  const visual = chConceptVisual(concept);
  if (!parts && !visual) return null;
  return h('div', { class: 'ch-concept-extras' }, parts, visual);
}

// ---- picker.js ----
// Pickers in the design system, in place of native selects whose OS popups
// show raw values. Three shapes, one contract: { el, read(), focus() }.
// - optionGroup: a radiogroup of option cards or a segmented row (2 to 4 choices)
// - listboxPicker: a button and a popover listbox (WAI-ARIA listbox pattern)
// - comboPicker: a text field with suggestions and free entry (combobox)
// Each option is { value, label, desc? }; the value is what gets stored.
let pickerSerial = 0;

function pickerId(prefix) {
  pickerSerial += 1;
  return `${prefix}-${pickerSerial}`;
}

/**
 * Radio cards or a segmented row. Arrow keys move and choose; one tab stop.
 * @param {{ options: object[], value: string, labelledBy?: string, describedBy?: string, variant?: 'cards'|'segmented', onChange?: Function, render?: Function }} spec
 */
function optionGroup({ options, value, labelledBy, describedBy, variant = 'segmented', onChange, render }) {
  let current = options.some((o) => o.value === value) ? value : options[0].value;
  const buttons = options.map((option, index) => h('button', {
    type: 'button', role: 'radio', class: `pick-option${variant === 'cards' ? ' is-card' : ''}`, 'data-value': option.value,
    onclick: () => choose(option.value, true),
    onkeydown: (event) => {
      const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[event.key];
      const jump = { Home: 0, End: options.length - 1 }[event.key];
      if (step === undefined && jump === undefined) return;
      event.preventDefault();
      const next = jump !== undefined ? jump : (index + step + options.length) % options.length;
      choose(options[next].value, true);
      buttons[next].focus();
    },
  },
  render ? render(option) : [
    h('span', { class: 'pick-option-label' }, option.label),
    option.desc && variant === 'cards' && h('span', { class: 'pick-option-desc' }, option.desc),
  ]));
  const el = h('div', {
    class: `pick-group is-${variant}`, role: 'radiogroup', 'aria-labelledby': labelledBy, 'aria-describedby': describedBy,
  }, buttons);

  function paint() {
    buttons.forEach((button, i) => {
      const on = options[i].value === current;
      button.setAttribute('aria-checked', String(on));
      button.tabIndex = on ? 0 : -1;
    });
  }

  function choose(next, fromUser) {
    if (next === current && fromUser) return;
    current = next;
    paint();
    if (onChange) onChange(current);
  }

  paint();
  return {
    el,
    read: () => current,
    focus: () => { const on = buttons.find((b) => b.getAttribute('aria-checked') === 'true'); if (on) on.focus(); },
    set: (next) => { if (options.some((o) => o.value === next)) { current = next; paint(); } },
  };
}

// Close the open picker on outside pointer or Escape, one at a time.
const PICKER = { open: null };
document.addEventListener('pointerdown', (event) => {
  if (PICKER.open && !PICKER.open.root.contains(event.target)) PICKER.open.close(false);
});

function placePanel(button, panel) {
  panel.classList.remove('is-up', 'is-end');
  const box = button.getBoundingClientRect();
  const height = panel.offsetHeight;
  if (box.bottom + 8 + height > window.innerHeight - 8 && box.top - 8 - height > 8) panel.classList.add('is-up');
  if (box.left + panel.offsetWidth > window.innerWidth - 8) panel.classList.add('is-end');
}

function optionRow(option, id, selected) {
  return h('div', { class: 'picker-option', role: 'option', id, 'aria-selected': String(selected), 'data-value': option.value },
    h('span', { class: 'picker-check', 'aria-hidden': 'true' }),
    h('span', { class: 'picker-text' },
      h('span', { class: 'picker-label' }, option.label),
      option.desc && h('span', { class: 'picker-desc' }, option.desc)));
}

// The button, the popover and its rows. Compact pickers (an icon button)
// name themselves with aria-label.
function listboxParts({ options, current, labelOf, labelledBy, describedBy, ariaLabel, buttonContent }) {
  const buttonId = pickerId('picker-button');
  const listId = pickerId('picker-list');
  const valueText = h('span', { class: 'picker-value' }, buttonContent ? buttonContent(current) : labelOf(current));
  const naming = ariaLabel ? { 'aria-label': `${ariaLabel}: ${labelOf(current)}` } : { 'aria-labelledby': `${labelledBy} ${buttonId}` };
  const button = h('button', {
    class: `picker-button${buttonContent ? ' is-compact' : ''}`, type: 'button', id: buttonId, 'aria-haspopup': 'listbox', 'aria-expanded': 'false',
    'aria-controls': listId, 'aria-describedby': describedBy, ...naming,
  }, valueText, !buttonContent && h('span', { class: 'picker-chevron', 'aria-hidden': 'true' }));
  const rows = options.map((option, i) => optionRow(option, `${listId}-${i}`, option.value === current));
  const panel = h('div', {
    class: 'picker-panel', role: 'listbox', id: listId, tabindex: '-1', hidden: true,
    ...(ariaLabel ? { 'aria-label': ariaLabel } : { 'aria-labelledby': labelledBy }),
  }, rows);
  return { valueText, button, rows, panel, root: h('div', { class: 'picker' }, button, panel) };
}

const TYPEAHEAD_PAUSE_MS = 600;

// Typing letters jumps to the first label that starts with them; a pause
// starts a new search. Returns the matching index, or -1.
function typeaheadFind(options, typeahead, key) {
  const now = Date.now();
  typeahead.typed = now - typeahead.at > TYPEAHEAD_PAUSE_MS ? key.toLowerCase() : typeahead.typed + key.toLowerCase();
  typeahead.at = now;
  return options.findIndex((o) => o.label.toLowerCase().startsWith(typeahead.typed));
}

// Keys inside the open listbox. nav: { active, count, move(i), choose(i), close(focus) }.
function listboxKeys(event, options, typeahead, nav) {
  const moves = { ArrowDown: nav.active + 1, ArrowUp: nav.active - 1, Home: 0, End: nav.count - 1 };
  if (event.key in moves) {
    event.preventDefault();
    nav.move(Math.min(Math.max(moves[event.key], 0), nav.count - 1));
  } else if (event.key === 'Enter' || event.key === ' ') {
    event.preventDefault();
    nav.choose(nav.active);
  } else if (event.key === 'Escape') {
    event.preventDefault();
    event.stopPropagation();
    nav.close(true);
  } else if (event.key === 'Tab') {
    nav.close(false);
  } else if (event.key.length === 1 && /\S/.test(event.key)) {
    const found = typeaheadFind(options, typeahead, event.key);
    if (found >= 0) nav.move(found);
  }
}

const LISTBOX_OPEN_KEYS = ['ArrowDown', 'ArrowUp', 'Enter', ' '];

// One popover open at a time on the page.
function showPopover(api, trigger, panel) {
  if (PICKER.open && PICKER.open !== api) PICKER.open.close(false);
  panel.hidden = false;
  trigger.setAttribute('aria-expanded', 'true');
  placePanel(trigger, panel);
  PICKER.open = api;
}

function hidePopover(api, trigger, panel) {
  panel.hidden = true;
  trigger.setAttribute('aria-expanded', 'false');
  if (PICKER.open === api) PICKER.open = null;
}

function paintListboxActive(rows, panel, active) {
  rows.forEach((row, i) => row.classList.toggle('is-active', i === active));
  panel.setAttribute('aria-activedescendant', rows[active].id);
}

// The button shows the chosen label (or icon); the rows mark the choice.
function showListboxValue({ valueText, button, rows }, options, current, { labelOf, ariaLabel, buttonContent }) {
  fill(valueText, buttonContent ? buttonContent(current) : labelOf(current));
  if (ariaLabel) button.setAttribute('aria-label', `${ariaLabel}: ${labelOf(current)}`);
  rows.forEach((row, j) => row.setAttribute('aria-selected', String(options[j].value === current)));
}

/**
 * A button that opens a listbox popover. Up/Down, Home/End, typeahead,
 * Enter/Space choose, Escape closes and returns focus to the button.
 * @param {{ options: object[], value: string, labelledBy: string, describedBy?: string, onChange?: Function }} spec
 */
function listboxPicker({ options, value, labelledBy, describedBy, onChange, ariaLabel, buttonContent }) {
  let current = options.some((o) => o.value === value) ? value : options[0].value;
  let active = 0;
  const typeahead = { typed: '', at: 0 };
  const labelOf = (v) => (options.find((o) => o.value === v) || options[0]).label;
  const { valueText, button, rows, panel, root } = listboxParts({ options, current, labelOf, labelledBy, describedBy, ariaLabel, buttonContent });
  const api = { root, close };
  const paintActive = () => paintListboxActive(rows, panel, active);

  function open() {
    active = Math.max(0, options.findIndex((o) => o.value === current));
    showPopover(api, button, panel);
    paintActive();
    panel.focus({ preventScroll: true });
  }

  function close(returnFocus = true) {
    if (panel.hidden) return;
    hidePopover(api, button, panel);
    if (returnFocus) button.focus();
  }

  const show = (next) => { current = next; showListboxValue({ valueText, button, rows }, options, current, { labelOf, ariaLabel, buttonContent }); };

  function choose(i) {
    show(options[i].value);
    close(true);
    if (onChange) onChange(current);
  }

  button.addEventListener('click', () => (panel.hidden ? open() : close()));
  button.addEventListener('keydown', (event) => {
    if (!LISTBOX_OPEN_KEYS.includes(event.key)) return;
    event.preventDefault();
    open();
  });
  const move = (i) => { active = i; paintActive(); };
  panel.addEventListener('keydown', (event) => listboxKeys(event, options, typeahead, { active, count: options.length, move, choose, close }));
  rows.forEach((row, i) => {
    row.addEventListener('click', () => choose(i));
    row.addEventListener('pointermove', () => { if (active !== i) move(i); });
  });

  const set = (next) => { if (options.some((o) => o.value === next) && next !== current) show(next); };
  return { el: root, read: () => current, focus: () => button.focus(), set };
}

const COMBO_SHOWN = 8;

// Suggestions: values that start with the text, or labels that contain it.
function comboMatches(options, typed) {
  const q = String(typed).trim().toLowerCase();
  return options.filter((o) => !q || o.value.toLowerCase().startsWith(q) || o.label.toLowerCase().includes(q)).slice(0, COMBO_SHOWN);
}

// Keys in the combobox. nav: { open, step(by), take() -> taken, close() }.
function comboKeys(event, nav) {
  if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
    event.preventDefault();
    nav.step(event.key === 'ArrowDown' ? 1 : -1);
  } else if (event.key === 'Enter' && nav.open) {
    if (nav.take()) event.preventDefault();
  } else if (event.key === 'Escape' && nav.open) {
    event.preventDefault();
    event.stopPropagation();
    nav.close();
  }
}

function comboParts(id, value, describedBy) {
  const listId = pickerId('combo-list');
  const input = h('input', {
    class: 'field picker-input', type: 'text', id, value: String(value ?? ''), role: 'combobox', autocomplete: 'off', spellcheck: 'false',
    'aria-autocomplete': 'list', 'aria-expanded': 'false', 'aria-controls': listId, 'aria-describedby': describedBy,
  });
  const panel = h('div', { class: 'picker-panel', role: 'listbox', id: listId, hidden: true });
  return { listId, input, panel, root: h('div', { class: 'picker' }, input, panel) };
}

function paintComboActive(panel, input, active) {
  [...panel.children].forEach((row, i) => row.classList.toggle('is-active', i === active));
  if (active >= 0 && panel.children[active]) input.setAttribute('aria-activedescendant', panel.children[active].id);
  else input.removeAttribute('aria-activedescendant');
}

// A click on a suggestion lands before the blur closes the list.
const COMBO_BLUR_CLOSE_MS = 120;

/**
 * A text field with suggestions (combobox). Free entry is allowed; the
 * caller validates it. Down opens and moves, Enter takes the active one.
 * @param {{ options: object[], value: string, id: string, describedBy?: string }} spec
 */
function comboPicker({ options, value, id, describedBy }) {
  const { listId, input, panel, root } = comboParts(id, value, describedBy);
  let active = -1;
  let shown = [];
  const api = { root, close: () => close() };
  const paintActive = () => paintComboActive(panel, input, active);

  function render() {
    shown = comboMatches(options, input.value);
    fill(panel, ...shown.map((option, i) => optionRow(option, `${listId}-${i}`, option.value === input.value.trim())));
    [...panel.children].forEach((row, i) => row.addEventListener('pointerdown', (event) => { event.preventDefault(); take(i); }));
    if (!shown.length) { close(); return; }
    active = Math.min(active, shown.length - 1);
    paintActive();
  }

  function open() {
    render();
    if (shown.length) showPopover(api, input, panel);
  }

  function close() {
    hidePopover(api, input, panel);
    input.removeAttribute('aria-activedescendant');
    active = -1;
  }

  function take(i) {
    input.value = shown[i].value;
    close();
    input.focus();
  }

  input.addEventListener('input', () => { active = -1; open(); });
  input.addEventListener('focus', () => open());
  input.addEventListener('blur', () => window.setTimeout(close, COMBO_BLUR_CLOSE_MS));
  input.addEventListener('keydown', (event) => comboKeys(event, {
    open: panel.hidden === false,
    step: (by) => {
      if (panel.hidden) open();
      active = Math.min(Math.max(active + by, 0), shown.length - 1);
      paintActive();
    },
    take: () => { if (active >= 0) take(active); else return false; return true; },
    close,
  }));

  return { el: root, read: () => input.value.trim(), focus: () => input.focus() };
}

// ---- settings.js ----
// Settings: one view shared by the explainer pages, the kit and the hub.
// Reading choices live in this browser (localStorage, in try/catch). Explainer
// defaults live in <home>/config.json: saved through `library serve` when the
// page was opened that way, else shown as `config set` commands to copy.
const READING_PREFS = [
  {
    key: 'motion', label: 'Motion', storeKey: 'concept-explainer:motion', fallback: 'system',
    hint: 'Reduced stops sliding cards, drawing arrows and moving dots.',
    choices: [{ choice: 'system', label: 'System' }, { choice: 'reduce', label: 'Reduced' }],
  },
  {
    key: 'text', label: 'Text size', storeKey: 'concept-explainer:text', fallback: 'default',
    hint: 'Large makes every page about an eighth bigger.',
    choices: [{ choice: 'default', label: 'Default' }, { choice: 'large', label: 'Large' }],
  },
  {
    key: 'density', label: 'Density', storeKey: 'concept-explainer:density', fallback: 'comfortable',
    hint: 'Compact fits more on the screen.',
    choices: [{ choice: 'comfortable', label: 'Comfortable' }, { choice: 'compact', label: 'Compact' }],
  },
];

function readingValue(pref) {
  const value = readStore(pref.storeKey);
  return pref.choices.some((c) => c.choice === value) ? value : pref.fallback;
}

// data-motion, data-text, data-density on <html>; defaults leave them off.
function applyReading() {
  const root = document.documentElement;
  READING_PREFS.forEach((pref) => {
    const value = readingValue(pref);
    if (value === pref.fallback) delete root.dataset[pref.key];
    else root.dataset[pref.key] = value;
  });
}

function readingSwitch(registry, pref) {
  return choiceSwitch(registry, {
    choices: pref.choices, read: () => readingValue(pref), label: pref.label, className: 'theme-switch style-switch', withIcons: false,
    write: (choice) => { writeStore(pref.storeKey, choice); applyReading(); },
  });
}

// `library serve` opens pages with #token=<t>. Keep it for this tab only and
// clear it from the address before the router reads the hash.
const SERVE_TOKEN_KEY = 'concept-explainer:serve-token';

function withServe(context) {
  const served = /^https?:$/.test(window.location.protocol);
  const match = window.location.hash.match(/^#token=([A-Za-z0-9_-]{8,256})$/);
  let token = null;
  if (match) {
    token = match[1];
    try {
      window.sessionStorage.setItem(SERVE_TOKEN_KEY, token);
    } catch (error) {
      // Without session storage the token still works until reload.
    }
    try {
      window.history.replaceState(window.history.state, '', `${window.location.pathname}${window.location.search}`);
    } catch (error) {
      window.location.hash = '';
    }
  } else if (served) {
    try {
      token = window.sessionStorage.getItem(SERVE_TOKEN_KEY);
    } catch (error) {
      token = null;
    }
  }
  if (!served || !token) return context;
  return { ...context, serve: { ...(context.serve || {}), token } };
}

// ---------- Quick theme: a small menu by the gear, and Shift+D ----------
const THEME_ICON_OPTIONS = THEME_CHOICES.map((t) => ({ value: t.choice, label: t.label }));

function setTheme(registry, choice) {
  writeStore(THEME_KEY, choice);
  applyTheme(choice);
  registry.paint();
  registry.changed();
}

// The theme menu, kept in sync with every other theme control on the page.
function quickTheme(registry) {
  const picker = listboxPicker({
    options: THEME_ICON_OPTIONS, value: storedTheme(), ariaLabel: 'Theme',
    buttonContent: (value) => icon(value), onChange: (choice) => setTheme(registry, choice),
  });
  registry.onChange(() => picker.set(storedTheme()));
  return h('div', { class: 'quick-theme' }, picker.el);
}

// Shift+D cycles light, dark, system. Ignored while typing.
function installThemeShortcut(registry) {
  const live = h('div', { class: 'sr-only', role: 'status', 'aria-live': 'polite' });
  document.body.append(live);
  const order = ['light', 'dark', 'system'];
  document.addEventListener('keydown', (event) => {
    if (event.key !== 'D' || !event.shiftKey || event.metaKey || event.ctrlKey || event.altKey) return;
    if (event.target.closest && event.target.closest('input, textarea, select, [contenteditable="true"]')) return;
    event.preventDefault();
    const next = order[(order.indexOf(storedTheme()) + 1) % order.length];
    setTheme(registry, next);
    live.textContent = `${THEME_CHOICES.find((t) => t.choice === next).label} theme`;
  });
}

// One compact line of facts for the sidebar footer, cut with a hint if long.

// ---- settings-defaults.js ----
// Explainer defaults: the fields, their valid values (from the build) and
// the form that saves them or shows the commands.
// The valid values come from the build (context.enums, scripts/lib/page-enums.mjs),
// so the form never keeps its own list that can drift. The lists below are
// labels for people, and the values for a page built before enums existed.
// The CLI and the server check every value again.
const PAGE_ENUMS = (() => {
  const enums = readContext().enums;
  return enums && typeof enums === 'object' && !Array.isArray(enums) ? enums : {};
})();

function enumList(name, fallback) {
  const values = PAGE_ENUMS[name];
  return Array.isArray(values) && values.length && values.every((v) => typeof v === 'string') ? values : fallback;
}

function enumNumber(name, fallback) {
  const value = PAGE_ENUMS[name];
  return Number.isInteger(value) && value > 0 ? value : fallback;
}

// Every value the build allows, labelled when the page has a label for it.
function enumOptions(name, labelled, lead = []) {
  const values = [...new Set([...lead, ...enumList(name, labelled.map((o) => o.value))])];
  return values.map((value) => labelled.find((o) => o.value === value) || opt(value, value));
}

const LANGUAGE_PATTERN = (() => {
  try {
    return typeof PAGE_ENUMS.languagePattern === 'string' ? new RegExp(PAGE_ENUMS.languagePattern) : null;
  } catch (error) {
    return null;
  }
})() || /^[a-zA-Z]{2,3}(-[a-zA-Z0-9]{2,8})*$/;

function opt(value, label, desc) {
  return { value, label, desc };
}
const ON_OFF = [opt('on', 'On'), opt('off', 'Off')];
const CONFIG_FIELDS = {
  style: { label: 'Style', kind: 'style', help: 'The look new explainers open in. Readers can still switch.',
    options: enumOptions('styles', [opt('clean', 'Clean', 'Calm greys and one orange accent.'), opt('playful', 'Playful', 'Bright, rounded and pressable.')]) },
  defaultType: { label: 'Explainer type', kind: 'list', help: 'What the skill makes when you do not say.',
    options: enumOptions('types', [
      opt('auto', 'Auto detect', 'The skill picks from what you point it at'),
      opt('repo', 'Repo', 'A whole codebase: parts, flows, data'),
      opt('pr', 'Pull request', 'One PR or MR, its diff and risks'),
      opt('change', 'Change', 'A commit range or a release'),
      opt('proposal', 'Proposal', 'An RFC or design doc and its options'),
      opt('migration', 'Migration', 'Moving from one system to another'),
      opt('incident', 'Incident', 'What broke, why, and the fix'),
      opt('concept', 'Concept', 'An idea or technique, no code needed'),
    ], ['auto']) },
  audience: { label: 'Audience', kind: 'cards', help: 'Sets tone, depth and how many terms get explained.',
    options: enumOptions('audience', [opt('newcomer', 'Newcomer', 'New to the code or the field'), opt('engineer', 'Engineer', 'Works in code day to day'), opt('expert', 'Expert', 'Wants the edges and trade-offs')]) },
  depth: { label: 'Depth', kind: 'cards', help: 'How many parts, flows and steps to trace.',
    options: enumOptions('depth', [opt('overview', 'Overview', 'The shape in a few minutes'), opt('standard', 'Standard', 'The main flows and parts'), opt('deep', 'Deep', 'Every important path')]) },
  language: { label: 'Language', kind: 'combo', help: 'A language tag, like en or pt-BR. Pick one or type your own.',
    options: [
      opt('en', 'en', 'English'), opt('en-GB', 'en-GB', 'English (UK)'), opt('es', 'es', 'Spanish'), opt('fr', 'fr', 'French'),
      opt('de', 'de', 'German'), opt('it', 'it', 'Italian'), opt('pt-BR', 'pt-BR', 'Portuguese (Brazil)'), opt('pt-PT', 'pt-PT', 'Portuguese (Portugal)'),
      opt('nl', 'nl', 'Dutch'), opt('sv', 'sv', 'Swedish'), opt('pl', 'pl', 'Polish'), opt('tr', 'tr', 'Turkish'),
      opt('ru', 'ru', 'Russian'), opt('uk', 'uk', 'Ukrainian'), opt('ja', 'ja', 'Japanese'), opt('ko', 'ko', 'Korean'),
      opt('zh-CN', 'zh-CN', 'Chinese (Simplified)'), opt('zh-TW', 'zh-TW', 'Chinese (Traditional)'), opt('hi', 'hi', 'Hindi'),
      opt('id', 'id', 'Indonesian'), opt('vi', 'vi', 'Vietnamese'), opt('fil', 'fil', 'Filipino'), opt('ar', 'ar', 'Arabic'), opt('he', 'he', 'Hebrew'),
    ] },
  visuals: { label: 'Preferred visuals', kind: 'multi', options: enumList('visualKinds', ['layers', 'cycle', 'state', 'compare', 'hierarchy', 'beforeAfter', 'quadrant', 'funnel', 'venn']), help: 'Picked first when a chapter can use a picture.' },
  codeWalkthrough: { label: 'Code walkthrough', kind: 'cards', help: 'A line-by-line tour of the few lines that carry the idea.',
    options: enumOptions('codeWalkthrough', [opt('auto', 'Auto', 'When the code is the point'), opt('always', 'Always', 'Add one to every explainer'), opt('never', 'Never', 'Leave it out')]) },
  quiz: { label: 'Quiz', kind: 'onoff', help: 'End explainers with a few questions.' },
  analogies: { label: 'Analogies', kind: 'onoff', help: 'Add a "think of it like" line to key ideas.' },
  model: { label: 'Model for estimates', kind: 'list', help: 'Used to price a run before it starts.',
    options: enumOptions('models', [opt('auto', 'Auto', 'Let the estimate pick'), opt('fable-5.2', 'Fable 5.2'), opt('opus-5.5', 'Opus 5.5'), opt('sonnet-5.5', 'Sonnet 5.5'), opt('haiku-5.5', 'Haiku 5.5')]) },
  budgetUsd: { label: 'Budget in US dollars', kind: 'number', help: 'Start without asking when the estimate fits. Leave empty to always ask.' },
  confirmBeforeStart: { label: 'Confirm before starting', kind: 'onoff', help: 'Show the estimate and wait for a yes.' },
  instructions: { label: 'House instructions', kind: 'textarea', help: 'Plain text added to every run: house style, terms to use. Never overrides the truth rules.' },
};
const optionValues = (field) => field.options.map((o) => (typeof o === 'string' ? o : o.value));
const CONFIG_FIELD_DEFAULTS = {
  style: 'clean', defaultType: 'auto', audience: 'engineer', depth: 'standard', language: 'en', visuals: [], chapters: {}, codeWalkthrough: 'auto',
  quiz: true, analogies: true, model: 'auto', budgetUsd: null, confirmBeforeStart: true, instructions: '',
};
const INSTRUCTIONS_LIMIT = enumNumber('instructionsLimit', 2000);
const CLI_NAME = 'concept-explainer';

// ---------- Explainer defaults ----------
function normalizeDefaults(raw) {
  const source = raw && typeof raw === 'object' && !Array.isArray(raw) ? raw : {};
  return Object.fromEntries(Object.entries(CONFIG_FIELD_DEFAULTS).map(([key, fallback]) => {
    const value = source[key];
    return [key, value === undefined || fieldErrors(key, value).length ? JSON.parse(JSON.stringify(fallback)) : value];
  }));
}

function fieldErrors(key, value) {
  const field = CONFIG_FIELDS[key];
  if (key === 'chapters') return value && typeof value === 'object' && !Array.isArray(value) ? [] : ['Must be a list of chapters per type.'];
  if (!field) return [];
  if (['style', 'list', 'cards'].includes(field.kind)) return optionValues(field).includes(value) ? [] : ['Pick one of the listed choices.'];
  if (field.kind === 'onoff') return typeof value === 'boolean' ? [] : ['Must be on or off.'];
  if (field.kind === 'multi') return Array.isArray(value) && value.every((v) => field.options.includes(v)) ? [] : ['Pick from the listed kinds.'];
  if (key === 'language') return typeof value === 'string' && LANGUAGE_PATTERN.test(value) ? [] : ['Use a language tag like en or pt-BR.'];
  if (key === 'budgetUsd') return value === null || (typeof value === 'number' && Number.isFinite(value) && value >= 0) ? [] : ['Use a number of 0 or more, or leave it empty.'];
  if (key === 'instructions') {
    if (typeof value !== 'string') return ['Must be text.'];
    if (value.length > INSTRUCTIONS_LIMIT) return [`${value.length} characters. Keep it to ${INSTRUCTIONS_LIMIT}.`];
    // eslint-disable-next-line no-control-regex
    return /[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f]/.test(value) ? ['Remove control characters. Use plain text.'] : [];
  }
  return [];
}

function shellQuote(value) {
  const textValue = String(value);
  return /^[\w.,:@/-]+$/.test(textValue) ? textValue : `'${textValue.replace(/'/g, "'\\''")}'`;
}

function commandValue(key, value) {
  if (typeof value === 'boolean') return value ? 'on' : 'off';
  if (key === 'budgetUsd') return value === null ? 'none' : String(value);
  if (key === 'visuals') return shellQuote(value.join(','));
  if (key === 'chapters') return shellQuote(JSON.stringify(value));
  return shellQuote(value);
}

function copyButton(getText, label = 'Copy') {
  const button = h('button', { class: 'btn small', type: 'button' }, label);
  button.addEventListener('click', () => {
    navigator.clipboard.writeText(getText())
      .then(() => { button.textContent = 'Copied'; button.dataset.state = 'done'; })
      .catch(() => { button.textContent = 'Select to copy'; });
  });
  return button;
}

function downloadBlob(filename, content, type = 'application/json') {
  const url = URL.createObjectURL(new Blob([content], { type }));
  const link = h('a', { href: url, download: filename, hidden: true });
  document.body.append(link);
  link.click();
  link.remove();
  window.setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// A small picture of each style, drawn with the style's own colours.
function stylePreview(option) {
  return [
    h('span', { class: `style-preview is-${option.value}`, 'aria-hidden': 'true' }, h('i'), h('i'), h('i')),
    h('span', { class: 'pick-option-label' }, option.label),
    h('span', { class: 'pick-option-desc' }, option.desc),
  ];
}

// One control per field, all with the same shape: { el, read(), focus() }.
function fieldControl(key, value, id, describedBy) {
  const field = CONFIG_FIELDS[key];
  const labelledBy = `${id}-label`;
  if (field.kind === 'style') return optionGroup({ options: field.options, value, labelledBy, describedBy, variant: 'cards', render: stylePreview });
  if (field.kind === 'cards') return optionGroup({ options: field.options, value, labelledBy, describedBy, variant: 'cards' });
  if (field.kind === 'onoff') {
    const group = optionGroup({ options: ON_OFF, value: value ? 'on' : 'off', labelledBy, describedBy });
    return { ...group, read: () => group.read() === 'on' };
  }
  if (field.kind === 'list') return listboxPicker({ options: field.options, value, labelledBy, describedBy });
  if (field.kind === 'combo') return comboPicker({ options: field.options, value, id, describedBy });
  if (field.kind === 'multi') {
    const el = h('div', { class: 'multi', role: 'group', 'aria-labelledby': labelledBy, 'aria-describedby': describedBy },
      field.options.map((option) => h('label', { class: 'multi-option' },
        h('input', { type: 'checkbox', name: key, value: option, checked: value.includes(option) }), h('span', null, option))));
    return { el, read: () => [...el.querySelectorAll('input:checked')].map((input) => input.value), focus: () => el.querySelector('input').focus() };
  }
  if (field.kind === 'number') {
    const el = h('input', { class: 'field', type: 'number', id, min: '0', step: '0.5', inputmode: 'decimal', value: value === null ? '' : String(value), 'aria-describedby': describedBy });
    return { el, read: () => (el.value.trim() === '' ? null : Number(el.value.trim())), focus: () => el.focus() };
  }
  const el = h('textarea', { class: 'field', id, rows: '5', maxlength: String(INSTRUCTIONS_LIMIT * 2), 'aria-describedby': describedBy }, value);
  return { el, read: () => el.value, focus: () => el.focus() };
}

// One row per config field: label, control, hint and its error line.
function defaultsRow(key, value) {
  const id = `cfg-${key}`;
  const errorId = `${id}-error`;
  const field = CONFIG_FIELDS[key];
  const control = fieldControl(key, value, id, `${id}-hint ${errorId}`);
  const error = h('p', { class: 'field-error', id: errorId });
  const label = ['number', 'textarea', 'combo'].includes(field.kind)
    ? h('label', { class: 'setting-label', for: id, id: `${id}-label` }, field.label)
    : h('span', { class: 'setting-label', id: `${id}-label` }, field.label);
  const wide = ['textarea', 'multi', 'style', 'cards'].includes(field.kind);
  const el = h('div', { class: `setting-row${wide ? ' is-wide' : ''}`, 'data-field': key },
    label, control.el, h('p', { class: 'setting-hint', id: `${id}-hint` }, field.help), error);
  return { el, error, control };
}

// Marks every bad field and returns the first one's control, or null.
function markInvalid(fields, values) {
  let firstBad = null;
  Object.keys(CONFIG_FIELDS).forEach((key) => {
    const problems = fieldErrors(key, values[key]);
    const { error, control } = fields[key];
    error.textContent = problems.join(' ');
    const target = control.el.matches('input, textarea') ? control.el : control.el.querySelector('input, [role="radiogroup"], .picker-button') || control.el;
    target.setAttribute('aria-invalid', String(problems.length > 0));
    if (problems.length && !firstBad) firstBad = control;
  });
  return firstBad;
}

// The instructions box shows how much of its limit is used.
function wireInstructionsCount(instructions) {
  const counter = h('span', { class: 'setting-count', 'aria-live': 'polite' });
  const paintCount = () => { counter.textContent = `${instructions.value.length} / ${INSTRUCTIONS_LIMIT}`; };
  instructions.after(counter);
  instructions.addEventListener('input', paintCount);
  paintCount();
}

// Without the server, the page shows the config set commands to copy.
function showConfigCommands(commands, status, changed, values) {
  const lines = changed.map((key) => `${CLI_NAME} config set ${key} ${commandValue(key, values[key])}`);
  status.textContent = `This page cannot write files. Run ${lines.length === 1 ? 'this command' : 'these commands'}, or download config.json.`;
  fill(commands,
    h('ul', { class: 'command-list' }, lines.map((line) => h('li', null, h('code', null, line), copyButton(() => line)))),
    lines.length > 1 && copyButton(() => lines.join('\n'), 'Copy all'));
}

// Long enough to read "Saved", short enough not to wait on.
const RELOAD_DELAY_MS = 900;

// One save at a time: a second press while the first runs does nothing.
// The server rebuilds the pages with the new defaults, so the page reloads.
function saveConfig(context, { submit, status }, changed, values, onSaved) {
  if (submit.disabled) return;
  submit.disabled = true;
  status.textContent = 'Saving…';
  serveFetch(context, serveApi(context, 'config'), {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify(Object.fromEntries(changed.map((key) => [key, values[key]]))),
  }).then(({ json: body }) => {
    onSaved(body && body.config ? body.config : values);
    status.textContent = `Saved ${plural(changed.length, 'setting')}. Reloading with the new defaults.`;
    window.setTimeout(() => window.location.reload(), RELOAD_DELAY_MS);
  }).catch((error) => {
    submit.disabled = false;
    status.textContent = `Could not save: ${error.message}`;
  });
}

function defaultsGroup(context, initialConfig) {
  let saved = normalizeDefaults(initialConfig);
  const serve = context && context.serve && typeof context.serve.token === 'string' ? context.serve : null;
  const status = h('p', { class: 'settings-status', role: 'status', 'aria-live': 'polite' });
  const commands = h('div', { class: 'settings-commands' });
  const fields = Object.fromEntries(Object.keys(CONFIG_FIELDS).map((key) => [key, defaultsRow(key, saved[key])]));
  const current = () => ({ ...saved, ...Object.fromEntries(Object.keys(CONFIG_FIELDS).map((key) => [key, fields[key].control.read()])) });
  const submit = h('button', { class: 'btn primary', type: 'submit' }, serve ? 'Save' : 'Show the commands');
  const form = h('form', { class: 'settings-form', novalidate: true }, Object.values(fields).map((f) => f.el),
    h('p', { class: 'setting-hint' }, 'Chapters per type are set from the command line: ',
      h('code', null, `${CLI_NAME} config set chapters '{"repo":{"quiz":false}}'`)),
    h('div', { class: 'settings-actions' },
      submit,
      h('button', { class: 'btn', type: 'button', onclick: () => downloadBlob('config.json', `${JSON.stringify(current(), null, 2)}\n`) }, icon('download'), 'Download config.json'),
      status),
    commands);
  wireInstructionsCount(fields.instructions.control.el);

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    const values = current();
    const bad = markInvalid(fields, values);
    if (bad) { status.textContent = 'Fix the marked fields first.'; bad.focus(); return; }
    const changed = Object.keys(values).filter((key) => JSON.stringify(values[key]) !== JSON.stringify(saved[key]));
    if (!changed.length) { status.textContent = 'Nothing changed.'; fill(commands); return; }
    if (serve) saveConfig(context, { submit, status }, changed, values, (config) => { saved = normalizeDefaults(config); });
    else showConfigCommands(commands, status, changed, values);
  });

  return h('section', { class: 'panel settings-group', 'aria-labelledby': 'settings-defaults-title' },
    h('div', { class: 'settings-legend' }, h('h2', { id: 'settings-defaults-title' }, 'Explainer defaults'),
      h('span', { class: 'eyebrow quiet' }, serve ? 'Saved to config.json' : 'Read from config.json')),
    h('p', { class: 'setting-hint' }, 'What the skill uses for the next explainer you build.'),
    form);
}

// Explainer defaults always show: the built-in defaults merged with what the
// page carries (never the free-text instructions). Under `library serve` the
// real config, instructions included, comes from GET /api/config.
function defaultsSlot(context, config) {
  const slot = h('div', { class: 'settings-slot' }, defaultsGroup(context, config || {}));
  const serve = context && context.serve && typeof context.serve.token === 'string' ? context.serve : null;
  if (serve) {
    serveFetch(context, serveApi(context, 'config'))
      .then(({ json }) => { if (json && json.config) fill(slot, defaultsGroup(context, json.config)); })
      .catch(() => { /* keep the embedded values; Save reports any server problem */ });
  }
  return slot;
}

/**
 * The Settings view. `config` holds the current explainer defaults, when the
 * page has them (context.config on explainer pages, data.config on the hub).
 * @returns {{ key: string, title: string, nav: string, section: HTMLElement, controller: object }}
 */

// ---- share.js ----
// Share: export bundles, import them, and save the page as one file.
// ---------- Share ----------
const BUNDLE_FORMAT = typeof PAGE_ENUMS.bundleFormat === 'string' && PAGE_ENUMS.bundleFormat ? PAGE_ENUMS.bundleFormat : 'concept-explainer-bundle';
const BUNDLE_MAX_BYTES = enumNumber('bundleMaxBytes', 10 * 1024 * 1024);
const BUNDLE_MAX_LABEL = `${Math.round(BUNDLE_MAX_BYTES / 1024 / 1024)} MB`;
const SLUG_PATTERN = /^[a-z0-9]+(-[a-z0-9]+)*$/;
const LOCAL_PATH_KEYS = new Set(['sourcePath', 'repoPath']);

// The library slug when the page knows it. Otherwise the bundle leaves it
// empty and the importer derives one, so there is one slug rule.
function knownSlug(context) {
  return context && typeof context.slug === 'string' && SLUG_PATTERN.test(context.slug) ? context.slug : '';
}

// Data only, without local paths: the importer rebuilds pages itself.
function withoutLocalPaths(value) {
  if (Array.isArray(value)) return value.map(withoutLocalPaths);
  if (!value || typeof value !== 'object') return value;
  return Object.fromEntries(Object.entries(value).filter(([key]) => !LOCAL_PATH_KEYS.has(key)).map(([key, v]) => [key, withoutLocalPaths(v)]));
}

function bundleOf(entries) {
  return { format: BUNDLE_FORMAT, version: 1, exportedAt: new Date().toISOString(), explainers: entries };
}

const HTML_ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
function escapeAttr(value) {
  return String(value ?? '').replace(/[&<>"']/g, (ch) => HTML_ESC[ch]);
}

// The page as it was built, from parts that never change after load: head
// attributes, the style and script text, and the embedded data. The context
// keeps the style, chapters and choice lists, so a shared copy has no token or library link.
// The library's font rules point at its fonts/ folder, which a saved
// page does not have: they go, and the system fonts in each stack take over.
// Spelled in pieces: built pages are checked for these words in their source.
const FONT_FACE_BLOCK = new RegExp(`^(\\s*)(?:@${'font'}-face\\{[^}]*\\}\\n?)+`);
const CSP_NAME = ['Content', 'Security', 'Policy'].join('-');

function sha256Source(text) {
  const subtle = window.crypto && window.crypto.subtle;
  if (!subtle) return Promise.resolve(null);
  return subtle.digest('SHA-256', new TextEncoder().encode(text)).then((buffer) => {
    const bytes = new Uint8Array(buffer);
    let binary = '';
    bytes.forEach((b) => { binary += String.fromCharCode(b); });
    return `'sha256-${window.btoa(binary)}'`;
  }).catch(() => null);
}

// The page's own policy, verbatim: the scripts are copied unchanged, so their
// hashes still hold. Only the style hash follows the trimmed stylesheet.
function savedCsp(styleText, styleHash) {
  const tag = [...document.head.querySelectorAll('meta[http-equiv]')].find((m) => m.getAttribute('http-equiv') === CSP_NAME);
  const policy = tag ? tag.getAttribute('content') : '';
  if (!policy) return '';
  const next = styleHash ? policy.replace(/style-src [^;]*/, `style-src ${styleHash}`) : policy;
  // Quotes in the policy stay as they are, so it reads byte for byte the same.
  return `<meta http-equiv="${CSP_NAME}" content="${next.replace(/&/g, '&amp;').replace(/"/g, '&quot;')}">`;
}

// Resolves to the page text. With no Web Crypto the stylesheet stays whole,
// so the policy's hash for it still matches.
function savedPage(style) {
  const full = (document.head.querySelector('style') || {}).textContent || '';
  const trimmed = full.replace(FONT_FACE_BLOCK, '$1');
  if (trimmed === full) return Promise.resolve(pageSnapshot(style, full, savedCsp(full, null)));
  return sha256Source(trimmed).then((hash) => (hash
    ? pageSnapshot(style, trimmed, savedCsp(trimmed, hash))
    : pageSnapshot(style, full, savedCsp(full, null))));
}

function pageSnapshot(style, styleText, cspTag) {
  const head = document.head;
  const meta = [...head.querySelectorAll('meta[name], meta[property], meta[charset]')].map((m) => {
    if (m.hasAttribute('charset')) return `<meta charset="${escapeAttr(m.getAttribute('charset'))}">`;
    const key = m.hasAttribute('name') ? 'name' : 'property';
    return `<meta ${key}="${escapeAttr(m.getAttribute(key))}" content="${escapeAttr(m.getAttribute('content'))}">`;
  });
  const links = [...head.querySelectorAll('link[rel]')].map((l) => {
    const cross = l.hasAttribute('crossorigin') ? ' crossorigin' : '';
    return `<link rel="${escapeAttr(l.getAttribute('rel'))}" href="${escapeAttr(l.getAttribute('href'))}"${cross}>`;
  });
  const prepaint = head.querySelector('script[data-prepaint]');
  const main = [...document.querySelectorAll('body > script:not([type])')].pop();
  const dataText = document.getElementById('explainer-data').textContent;
  // The build's chapter list and choice lists carry over; the token, slug and
  // library link do not.
  const built = readContext();
  const kept = { style, ...(Array.isArray(built.chapters) ? { chapters: built.chapters } : {}), ...(built.enums ? { enums: built.enums } : {}) };
  const contextText = JSON.stringify(kept).replace(/</g, '\\u003c');
  return [
    '<!doctype html>', '<html lang="en">', '<head>', ...meta.slice(0, 1), cspTag, ...meta.slice(1), `<title>${escapeAttr(document.querySelector('title') ? document.querySelector('title').textContent : 'Explainer')}</title>`,
    ...links, prepaint ? `<script data-prepaint>${prepaint.textContent}<\/script>` : '', `<style>${styleText}</style>`, '</head>', '<body>',
    '<a class="skip" href="#main">Skip to content</a>', '<div id="app" aria-busy="true"></div>',
    '<noscript><p class="noscript">This explainer needs JavaScript to draw its diagrams.</p></noscript>',
    `<script type="application/json" id="explainer-data">${dataText}<\/script>`,
    `<script type="application/json" id="explainer-context">${contextText}<\/script>`,
    `<script>${main ? main.textContent : ''}<\/script>`, '</body>', '</html>', '',
  ].join('\n');
}

function shareRow(title, body, actions) {

function explainerShareGroup(data, context) {

  });
