    state = { ...state, index: Math.min(Math.max(index, 0), questions.length) };
    persist();
    if (link) setDeepLink(state.index >= questions.length ? 'quiz/done' : `quiz/${state.index + 1}`);
    render({ focus });
  }

  const actions = {
    go,
    reset: () => { state = { index: 0, answers: [] }; persist(); go(0); },
    pick: (j) => { update(state.index, { picked: j }); render(); focusOption(j); },
    reveal: () => { update(state.index, { status: 'missed', picked: null }); render({ focus: true }); },
    check: () => {
      const i = state.index;
      if (!quizPicked(quizAnswerOf(state, i))) return;
      update(i, quizChecked(quizAnswerOf(state, i), questions[i]));
      render({ focus: true });
      quizCelebrate(card, quizAnswerOf(state, i));
    },
  };

  function render({ focus = false } = {}) {
    fill(card, ...(state.index >= questions.length ? quizEndScreen(data, questions, state, actions) : quizQuestionScreen(questions, state, state.index, actions)));
    const head = focus && card.querySelector('[data-focus]');
    if (head) head.focus({ preventScroll: true });
  }

  mount.append(h('div', { class: 'lesson quiz' }, card));
  render();
  return {
    open([n] = []) {
      if (n === 'done') { go(questions.length, { focus: false, link: false }); return card; }
      const wanted = Number.parseInt(n, 10);
      if (!(Number.isInteger(wanted) && wanted >= 1 && wanted <= questions.length)) return null;
      go(wanted - 1, { focus: false, link: false });
      return card;
    },
  };
}

// ---- chapters/kit.js ----
// Shared pieces for the v2 chapters (context, diff, options, risks, rollout,
// timeline, visuals) and the visuals kit. Every module shares one function
// scope, so names here start with ch (chapters) or viz (visuals).
// Status is ink text plus a small marker, never a saturated chip; orange
// (Playful: blue) only marks where the reader is.

const CH_STATUS_LABELS = {
  added: 'Added', modified: 'Modified', changed: 'Changed', removed: 'Removed', renamed: 'Renamed', unchanged: 'Unchanged',
};
// One glyph per status, so the marker reads without colour.
const CH_STATUS_GLYPHS = { added: '+', modified: '~', changed: '~', removed: '−', renamed: '→', unchanged: '' };

/** A small status marker (aria-hidden): the glyph in a hairline square. */
function chStatusMark(status) {
  const key = CH_STATUS_LABELS[status] ? status : 'unchanged';
  return h('span', { class: `ch-mark is-${key}`, 'aria-hidden': 'true' }, CH_STATUS_GLYPHS[key]);
}

/** Status as ink text with its small marker. */
function chStatusTag(status) {
  const key = CH_STATUS_LABELS[status] ? status : 'unchanged';
  return h('span', { class: `ch-status is-${key}` }, chStatusMark(key), CH_STATUS_LABELS[key]);
}

/** A 0-based index from a deep-link part, or null when it is not a valid one. */
function chIndexPart(raw, count) {
  if (raw === undefined || raw === null || !/^\d+$/.test(String(raw))) return null;
  const n = Number.parseInt(raw, 10);
  return n >= 0 && n < count ? n : null;
}

/**
 * Roving tabindex over a list of buttons: one tab stop, arrows and Home/End
 * move focus and call onMove(index). `axis` is "x", "y" or "both".
 */
function chRoving(buttons, { onMove, axis = 'both' } = {}) {
  const keys = {
    x: { ArrowRight: 1, ArrowLeft: -1 },
    y: { ArrowDown: 1, ArrowUp: -1 },
    both: { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 },
  }[axis] || {};
  buttons.forEach((button, index) => {
    button.tabIndex = index === 0 ? 0 : -1;
    button.addEventListener('keydown', (event) => {
      let next = null;
      if (keys[event.key]) next = (index + keys[event.key] + buttons.length) % buttons.length;
      if (event.key === 'Home') next = 0;
      if (event.key === 'End') next = buttons.length - 1;
      if (next === null) return;
      event.preventDefault();
      buttons[next].focus();
      if (onMove) onMove(next);
    });
  });
  return buttons;
}

/** Mark one button current: its tab stop, aria-pressed and the is-selected class. */
function chMarkCurrent(buttons, index) {
  buttons.forEach((button, i) => {
    const on = i === index;
    button.classList.toggle('is-selected', on);
    button.setAttribute('aria-pressed', String(on));
    button.tabIndex = on || (index === null && i === 0) ? 0 : -1;
  });
}

/** The tip shown in a detail panel before anything is picked. */
function chEmptyDetail(title, body) {
  return h('div', { class: 'ch-detail-empty' },
    h('p', { class: 'eyebrow quiet' }, 'Tip'),
    h('h3', null, title),
    h('p', null, body));
}

/** Back and Next buttons for stepping through parts in a detail panel. */
function chStepper(index, count, go, noun = 'part') {
  return h('div', { class: 'ch-stepper' },
    h('button', { class: 'btn small', type: 'button', disabled: index <= 0, onclick: () => { if (index > 0) go(index - 1); } }, 'Back'),
    h('span', { class: 'ch-stepper-count' }, `${index + 1} / ${count}`),
    h('button', { class: 'btn small', type: 'button', disabled: index >= count - 1, onclick: () => { if (index < count - 1) go(index + 1); } }, `Next ${noun}`));
}

/** A command with a Copy button (plain text, never run). */
function chCommand(command) {
  const copy = h('button', { class: 'btn small', type: 'button' }, 'Copy');
  copy.addEventListener('click', () => {
    const done = () => { copy.textContent = 'Copied'; copy.dataset.state = 'done'; };
    try {
      navigator.clipboard.writeText(command).then(done).catch(() => { copy.textContent = 'Select to copy'; });
    } catch (error) {
      copy.textContent = 'Select to copy';
    }
  });
  return h('div', { class: 'ch-command' }, codeBlock(command, 'sh'), copy);
}

/** A list of short texts with one marker each (goals, pros, cons). */
function chMarkedList(items, markClass, label) {
  const entries = list(items).filter((item) => typeof item === 'string' && item.trim());
  if (!entries.length) return null;
  return h('ul', { class: 'ch-marked', 'aria-label': label },
    entries.map((item) => h('li', null, h('span', { class: `ch-dot ${markClass}`, 'aria-hidden': 'true' }), h('span', null, softBreaks(item)))));
}

/** Count with a singular or plural noun. */
function chCount(n, one, many = `${one}s`) {
  return `${n} ${n === 1 ? one : many}`;
}

/** Re-run fn when the element's width changes by more than a few pixels. */
function chOnWidth(el, fn) {
  let last = -1;
  if (!('ResizeObserver' in window)) return;
  new ResizeObserver(() => {
    const width = el.clientWidth;
    if (Math.abs(width - last) < 4) return;
    last = width;
    fn(width);
  }).observe(el);
}

/**
 * One item selected at a time across a list of buttons: marks them (one tab
 * stop, arrows move), fills the detail panel with describe(index) and a
 * stepper, and writes the deep link. `order` maps button positions to item
 * indexes when the buttons are drawn in another order (risks: high first);
 * links always carry the item index.
 * @returns {(index: number|null, opts?: { link?: boolean }) => Element|null} select
 */
function chSelection({ buttons, detail, chapter, empty, describe, noun, order = null, hash = (i) => `${chapter}/${i}`, axis = 'both' }) {
  const itemAt = (k) => (order ? order[k] : k);
  const at = (index) => (order ? order.indexOf(index) : index);
  let selected = null;
  function select(index, { link = true } = {}) {
    selected = index;
    chMarkCurrent(buttons, index === null ? null : at(index));
    if (index === null) fill(detail, empty());
    else fill(detail, ...describe(index), chStepper(at(index), buttons.length, (k) => { select(itemAt(k)); buttons[k].focus(); }, noun));
    if (link) setDeepLink(index === null ? chapter : hash(index));
    return index === null ? null : buttons[at(index)];
  }
  buttons.forEach((button, k) => button.addEventListener('click', () => select(selected === itemAt(k) ? null : itemAt(k))));
  chRoving(buttons, { axis, onMove: (k) => select(itemAt(k)) });
  select(null, { link: false });
  return select;
}

/** The open() of a chapter whose deep link is an index from 0. */
function chIndexOpener(select, count) {
  return {
    open([raw] = []) {
      const index = chIndexPart(raw, count);
      return index === null ? null : select(index, { link: false });
    },
  };
}

// ---- chapters/viz-core.js ----
// The visuals kit: nine fixed kinds drawn as SVG from data (no SVG or
// images in the data). vizMount() draws one visual, makes every part
// selectable with a detail panel, and keeps one tab stop (arrows move).
// Each kind lives in viz-*.js as vizDraw<Kind>(visual, width), returning
// { nodes, height, parts, highlight? }. Parts are 0 based, in the order of
// the Parts column in references/visuals.md.

const VIZ_FONT = 13;
// Average glyph width per font size, a little wide so Nunito fits too.
const VIZ_CHAR = 0.6;
const VIZ_LINE = 17;
const VIZ_MIN_WIDTH = 260;
const VIZ_STAGGER = 40;
const VIZ_KIND_NAMES = {
  layers: 'Layers', cycle: 'Cycle', state: 'States', compare: 'Comparison', hierarchy: 'Hierarchy',
  beforeAfter: 'Before and after', quadrant: 'Quadrant', funnel: 'Funnel', venn: 'Overlap',
};
const VIZ = { uid: 0 };

function vizDrawer(kind) {
  const drawers = {
    layers: vizDrawLayers, cycle: vizDrawCycle, funnel: vizDrawFunnel, state: vizDrawState, hierarchy: vizDrawHierarchy,
    compare: vizDrawCompare, beforeAfter: vizDrawBeforeAfter, quadrant: vizDrawQuadrant, venn: vizDrawVenn,
  };
  return Object.prototype.hasOwnProperty.call(drawers, kind) ? drawers[kind] : null;
}

function vizUid(prefix) {
  VIZ.uid += 1;
  return `${prefix}-${VIZ.uid}`;
}

/** How many characters of text at `size` px fit in `width` px. */
function vizChars(width, size = VIZ_FONT) {
  return Math.max(3, Math.floor(width / (size * VIZ_CHAR)));
}

/** Text width estimate in px. */
function vizTextWidth(value, size = VIZ_FONT) {
  return String(value).length * size * VIZ_CHAR;
}

/**
 * Wrap text into at most maxLines lines of maxChars. Words longer than a
 * line are split; the last line ends in an ellipsis when text is left over.
 */
function vizWrap(value, maxChars, maxLines = 3) {
  const room = Math.max(3, maxChars);
  const words = String(value ?? '').trim().split(/\s+/).filter(Boolean)
    .flatMap((word) => (word.length <= room ? [word] : word.match(new RegExp(`.{1,${room - 1}}`, 'g')).map((piece, i, all) => (i < all.length - 1 ? `${piece}-` : piece))));
  const lines = [];
  let current = '';
  let rest = false;
  words.forEach((word) => {
    if (rest) return;
    const next = current ? `${current} ${word}` : word;
    if (next.length <= room) { current = next; return; }
    if (lines.length === maxLines - 1) { rest = true; return; }
    lines.push(current);
    current = word;
  });
  if (current) lines.push(current);
  if (rest || lines.length > maxLines) {
    const last = lines.slice(0, maxLines);
    const tail = last[last.length - 1];
    last[last.length - 1] = `${tail.length >= room ? tail.slice(0, room - 1) : tail}…`;
    return last;
  }
  return lines.length ? lines : [''];
}

/** An SVG text block, one tspan per line, centred on y when `middle`. */
function vizText(lines, { x, y, cls = 'viz-label', anchor = 'start', lineHeight = VIZ_LINE, middle = true }) {
  const top = middle ? y - ((lines.length - 1) * lineHeight) / 2 : y;
  return s('text', { class: cls, x, y: top, 'text-anchor': anchor, 'dominant-baseline': 'central' },
    lines.map((line, i) => s('tspan', { x, dy: i === 0 ? 0 : lineHeight }, line)));
}

/** Arrowhead markers for one SVG (ids are unique per drawing). */
function vizMarkers(id) {
  const marker = (suffix, cls) => s('marker', {
    id: `${id}-${suffix}`, viewBox: '0 0 10 10', refX: 8, refY: 5, markerWidth: 8, markerHeight: 8, markerUnits: 'userSpaceOnUse', orient: 'auto-start-reverse',
  }, s('path', { class: `viz-tip ${cls}`, d: 'M0,1 L9,5 L0,9 z' }));
  return s('defs', null, marker('rest', 'is-rest'), marker('on', 'is-on'));
}

/** A part: a group with a hit area. The framework adds role, focus and clicks. */
function vizPart(children, info) {
  return { el: s('g', { class: 'viz-part' }, children), ...info };
}

function vizRoundRect(x, y, width, height, cls = 'viz-box') {
  return s('rect', { class: cls, x: x + 0.5, y: y + 0.5, width: Math.max(0, width - 1), height: Math.max(0, height - 1) });
}

function vizFacts(facts) {
  const rows = list(facts).filter((row) => row && row[1] !== undefined && row[1] !== null && row[1] !== '');
  if (!rows.length) return null;
  return h('dl', { class: 'viz-facts' }, rows.map(([label, value]) => h('div', null,
    h('dt', null, label), h('dd', null, value instanceof Node || Array.isArray(value) ? value : softBreaks(String(value))))));
}

/** Selection marks: is-selected, aria-selected and one tab stop (the selected part, else the first). */
function vizPaintSelection(drawing, svg, selected) {
  drawing.parts.forEach((part, i) => {
    const on = i === selected;
    part.el.classList.toggle('is-selected', on);
    part.el.setAttribute('aria-selected', String(on));
    part.el.setAttribute('tabindex', on || (selected === null && i === 0) ? '0' : '-1');
  });
  svg.classList.toggle('has-selection', selected !== null);
  if (drawing.highlight) drawing.highlight(selected);
}

/** The detail panel's children: a tip, or the selected part with its facts and a stepper. */
function vizDetailChildren(drawing, selected, go) {
  if (selected === null || !drawing) {
    return [chEmptyDetail('Pick any part of the drawing', 'Click a part, or Tab to the drawing and use the arrow keys. Each part shows what it does here.')];
  }
  const part = drawing.parts[selected];
  return [
    h('p', { class: 'eyebrow quiet' }, part.kicker || `Part ${selected + 1} of ${drawing.parts.length}`),
    h('h3', null, softBreaks(part.label)),
    part.detail && h('p', { class: 'viz-detail-text' }, softBreaks(part.detail)),
    vizFacts(part.facts),
    drawing.parts.length > 1 && chStepper(selected, drawing.parts.length, go),
  ];
}

/** The svg for a drawing; its parts become options with names and clicks. */
function vizSvg(drawing, { room, id, label, kind, onClick }) {
  const svg = s('svg', {
    class: 'viz-svg', width: room, height: Math.ceil(drawing.height), viewBox: `0 0 ${room} ${Math.ceil(drawing.height)}`,
    role: 'listbox', 'aria-label': text(label, VIZ_KIND_NAMES[kind]), 'aria-orientation': 'vertical',
  }, vizMarkers(`${id}-m`), drawing.nodes, drawing.parts.map((p) => p.el));
  drawing.parts.forEach((part, i) => {
    part.el.setAttribute('role', 'option');
    part.el.setAttribute('aria-label', part.aria || [part.label, part.detail].filter(Boolean).join('. '));
    part.el.dataset.part = String(i);
    part.el.prepend(s('title', null, part.label));
    part.el.addEventListener('click', () => onClick(i));
  });
  return svg;
}

/** Where a key moves from part `index` of `count`: an index, null to clear, or undefined to ignore. */
function vizKeyTarget(key, index, count) {
  const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[key];
  if (step) return (index + step + count) % count;
  if (key === 'Home') return 0;
  if (key === 'End') return count - 1;
  if (key === 'Enter' || key === ' ') return index;
  if (key === 'Escape') return null;
  return undefined;
}

/** Arrows, Home, End, Enter and Escape on the drawing's parts. */
function vizKeys(stage, view) {
  stage.addEventListener('keydown', (event) => {
    const host = event.target.closest && event.target.closest('[data-part]');
    if (!host || !view.count()) return;
    const next = vizKeyTarget(event.key, Number(host.dataset.part), view.count());
    if (next === undefined || (next === null && view.selected() === null)) return;
    event.preventDefault();
    if (next === null) {
      view.select(null);
      host.focus();
    } else view.select(next, { focus: true });
  });
}

/**
 * Draw one visual with its detail panel.
 * @param {object} visual { kind, ...shape } (title and caption are shown by the caller)
 * @param {{ label?: string, onSelect?: (index: number|null) => void, compact?: boolean }} [options]
 * @returns {{ root: HTMLElement, select: (index: number|null, opts?: object) => HTMLElement|null, count: () => number, selected: () => number|null }}
 */
function vizMount(visual, { label = '', onSelect = null, compact = false } = {}) {
  const drawer = vizDrawer(visual && visual.kind);
  const stage = h('div', { class: 'viz-stage' });
  const detail = h('div', { class: 'viz-detail', 'aria-live': 'polite' });
  const root = h('div', { class: `viz viz-${drawer ? visual.kind : 'unknown'}${compact ? ' is-compact' : ''}` }, stage, detail);
  if (!drawer) {
    fill(stage, h('p', { class: 'empty' }, `This visual kind (${text(visual && visual.kind, 'none')}) is not in the kit.`));
    return { root, select: () => null, count: () => 0, selected: () => null };
  }
  const id = vizUid('viz');
  let drawing = null;
  let svg = null;
  let selected = null;
  let drawn = false;
  const count = () => (drawing ? drawing.parts.length : 0);

  function select(index, { focus = false, silent = false } = {}) {
    const next = index === null || index === undefined ? null : Math.min(Math.max(index, 0), count() - 1);
    selected = count() ? next : null;
    vizPaintSelection(drawing, svg, selected);
    fill(detail, ...vizDetailChildren(drawing, selected, (i) => select(i, { focus: false })));
    const el = selected !== null ? drawing.parts[selected].el : null;
    if (focus && el) el.focus({ preventScroll: true });
    if (!silent && onSelect) onSelect(selected);
    return el;
  }

  function draw(width, { measured = true } = {}) {
    const focusedIndex = drawing ? drawing.parts.findIndex((p) => p.el === document.activeElement) : -1;
    const room = Math.max(VIZ_MIN_WIDTH, Math.floor(width));
    drawing = drawer(visual, room, `${id}-m`);
    svg = vizSvg(drawing, { room, id, label, kind: visual.kind, onClick: (i) => select(selected === i ? null : i, { focus: false }) });
    fill(stage, svg, drawing.legend || null);
    vizPaintSelection(drawing, svg, selected);
    if (focusedIndex >= 0 && drawing.parts[focusedIndex]) drawing.parts[focusedIndex].el.focus({ preventScroll: true });
    // One-shot entrance, the first time the drawing is really on screen.
    if (!drawn && measured && stage.isConnected) {
      drawn = true;
      drawing.parts.forEach((part, i) => motion(part.el, [{ opacity: 0 }, { opacity: 1 }], { duration: 260, delay: Math.min(i, 8) * VIZ_STAGGER, fill: 'backwards' }));
    }
  }

  vizKeys(stage, { count, selected: () => selected, select });
  // Drawn at the width it gets, and again when that width changes.
  draw(640, { measured: false });
  fill(detail, ...vizDetailChildren(drawing, selected, (i) => select(i, { focus: false })));
  chOnWidth(stage, (width) => { if (width > 0) draw(width); });
  return { root, select, count, selected: () => selected };
}

/** A visual with its title and caption (the takeaway) above the drawing. */
function vizFigure(visual, { title, caption, onSelect, headingLevel = 'h3', compact = false } = {}) {
  const heading = text(title || visual.title);
  const takeaway = text(caption || visual.caption);
  const mounted = vizMount(visual, { label: heading || takeaway, onSelect, compact });
  const figure = h('figure', { class: `viz-figure${compact ? ' is-compact' : ''}` },
    (heading || takeaway) && h('figcaption', { class: 'viz-cap' },
      h('span', { class: 'eyebrow quiet' }, VIZ_KIND_NAMES[visual.kind] || 'Visual'),
      heading && h(headingLevel, { class: 'viz-title' }, softBreaks(heading)),
      takeaway && h('p', { class: 'viz-caption' }, softBreaks(takeaway))),
    mounted.root);
  return { ...mounted, root: figure };
}

// ---- chapters/viz-linear.js ----
// Visual kinds in one line of parts: layers (a stack), cycle (a loop) and
// funnel (narrowing stages). See viz-core.js for the drawer contract.

const VIZ_LAYER = { index: 30, gap: 18, pad: 14 };

function vizItemLabel(item) {
  return typeof item === 'string' ? item : text(item && item.label);
}

function vizItemDetail(item) {
  return item && typeof item === 'object' ? text(item.detail) : '';
}

// A short downward connector with an arrowhead, from (x, y1) to (x, y2).
function vizArrow(x1, y1, x2, y2, marker, cls = 'viz-link') {
  return s('path', { class: cls, d: `M${x1},${y1} L${x2},${y2}`, 'marker-end': `url(#${marker}-rest)`, 'data-marker': marker });
}

// Swap a link's arrowhead between rest and on, to follow its class.
function vizLinkOn(path, on) {
  path.classList.toggle('is-on', on);
  const marker = path.dataset.marker;
  if (marker) path.setAttribute('marker-end', `url(#${marker}-${on ? 'on' : 'rest'})`);
}

/** layers: a stack, top to bottom. Each layer uses the one below it. */
function vizDrawLayers(visual, width, marker) {
  const items = list(visual.items);
  const boxX = VIZ_LAYER.index;
  // A stack reads as a stack, not as full-width rows.
  const boxW = Math.min(width - boxX - 1, 560);
  const chars = vizChars(boxW - VIZ_LAYER.pad * 2);
  let y = 1;
  const nodes = [];
  const links = [];
  const parts = items.map((item, i) => {
    const lines = vizWrap(vizItemLabel(item), chars, 2);
    const boxH = Math.max(44, lines.length * VIZ_LINE + 22);
    const top = y;
    y += boxH;
    if (i < items.length - 1) {
      const link = vizArrow(boxX + boxW / 2, y + 2, boxX + boxW / 2, y + VIZ_LAYER.gap - 3, marker);
      links.push(link);
      nodes.push(link);
      y += VIZ_LAYER.gap;
    }
    const below = items[i + 1];
    const above = items[i - 1];
    return vizPart([
      vizRoundRect(boxX, top, boxW, boxH),
      s('text', { class: 'viz-index', x: 0, y: top + boxH / 2, 'dominant-baseline': 'central' }, String(i + 1).padStart(2, '0')),
      vizText(lines, { x: boxX + VIZ_LAYER.pad, y: top + boxH / 2 }),
    ], {
      label: vizItemLabel(item),
      detail: vizItemDetail(item),
      kicker: `Layer ${i + 1} of ${items.length}${i === 0 ? ', the top' : i === items.length - 1 ? ', the bottom' : ''}`,
      facts: [['Uses', below && vizItemLabel(below)], ['Used by', above && vizItemLabel(above)]],
    });
  });
  return {
    nodes, parts, height: y + 1,
    highlight(index) {
      parts.forEach((part, i) => part.el.classList.toggle('is-related', index !== null && i === index + 1));
      links.forEach((link, i) => vizLinkOn(link, index === i));
    },
  };
}

const VIZ_CYCLE = { boxH: 48, pad: 10, wideAt: 480, gutter: 36 };

// The first point along the circle (from the node outward) outside its box.
function vizCycleExit(cx, cy, r, angle, dir, half) {
  for (let t = 0; t < Math.PI; t += 0.01) {
    const a = angle + dir * t;
    const x = cx + r * Math.cos(a);
    const y = cy + r * Math.sin(a);
    const nodeX = cx + r * Math.cos(angle);
    const nodeY = cy + r * Math.sin(angle);
    if (Math.abs(x - nodeX) > half.w + 6 || Math.abs(y - nodeY) > half.h + 6) return a;
  }
  return angle + dir * 0.3;
}

// Wide cycle: boxes on a circle, each arc trimmed to leave its boxes.
function vizCycleCircle(n, width) {
  const boxW = Math.min(160, Math.round(width * 0.28));
  const r = Math.min(width / 2 - boxW / 2 - 8, 60 + n * 22);
  const cx = width / 2;
  const cy = r + VIZ_CYCLE.boxH / 2 + VIZ_CYCLE.pad;
  const angleOf = (i) => -Math.PI / 2 + (i * 2 * Math.PI) / n;
  const half = { w: boxW / 2, h: VIZ_CYCLE.boxH / 2 };
  const boxes = [];
  const links = [];
  for (let i = 0; i < n; i += 1) {
    const a1 = vizCycleExit(cx, cy, r, angleOf(i), 1, half);
    const a2 = vizCycleExit(cx, cy, r, angleOf(i + 1), -1, half);
    const p1 = [cx + r * Math.cos(a1), cy + r * Math.sin(a1)];
    const p2 = [cx + r * Math.cos(a2), cy + r * Math.sin(a2)];
    links.push(`M${p1[0]},${p1[1]} A${r},${r} 0 0 1 ${p2[0]},${p2[1]}`);
    boxes.push({ x: cx + r * Math.cos(angleOf(i)) - boxW / 2, y: cy + r * Math.sin(angleOf(i)) - VIZ_CYCLE.boxH / 2, w: boxW, h: VIZ_CYCLE.boxH });
  }
  return { boxes, links, height: cy * 2 };
}

// Narrow cycle: a column of boxes; the loop closes on the right, from the last box back to the first.
function vizCycleColumn(n, width) {
  const boxW = width - VIZ_CYCLE.gutter;
  const boxes = [];
  const links = [];
  let y = 1;
  for (let i = 0; i < n; i += 1) {
    boxes.push({ x: 0, y, w: boxW, h: VIZ_CYCLE.boxH });
    y += VIZ_CYCLE.boxH;
    if (i < n - 1) {
      links.push(`M${boxW / 2},${y + 2} L${boxW / 2},${y + 15}`);
      y += 18;
    }
  }
  const first = boxes[0];
  const last = boxes[boxes.length - 1];
  const lane = boxW + VIZ_CYCLE.gutter / 2;
  links.push(`M${boxW + 2},${last.y + last.h / 2} H${lane - 6} Q${lane},${last.y + last.h / 2} ${lane},${last.y + last.h / 2 - 6} V${first.y + first.h / 2 + 6} Q${lane},${first.y + first.h / 2} ${lane - 6},${first.y + first.h / 2} H${boxW + 5}`);
  return { boxes, links, height: y + 2 };
}

/** cycle: a loop. Wide: nodes on a circle; narrow: a column with a return line. Link i leaves item i. */
function vizDrawCycle(visual, width, marker) {
  const items = list(visual.items);
  const layout = width >= VIZ_CYCLE.wideAt ? vizCycleCircle(Math.max(items.length, 1), width) : vizCycleColumn(items.length, width);
  const links = layout.links.map((d) => s('path', { class: 'viz-link', d, 'marker-end': `url(#${marker}-rest)`, 'data-marker': marker }));
  const parts = items.map((item, i) => {
    const box = layout.boxes[i];
    const lines = vizWrap(vizItemLabel(item), vizChars(box.w - 20), 2);
    return vizPart([
      vizRoundRect(box.x, box.y, box.w, box.h),
      vizText(lines, { x: box.x + box.w / 2, y: box.y + box.h / 2, anchor: 'middle' }),
    ], {
      label: vizItemLabel(item),
      detail: vizItemDetail(item),
      kicker: `Step ${i + 1} of ${items.length} in the loop`,
      facts: [['Comes after', vizItemLabel(items[(i - 1 + items.length) % items.length])], ['Leads to', vizItemLabel(items[(i + 1) % items.length])]],
    });
  });
  return {
    nodes: links, parts, height: layout.height,
    highlight(index) {
      links.forEach((link, i) => vizLinkOn(link, index === i));
      parts.forEach((part, i) => part.el.classList.toggle('is-related', index !== null && i === (index + 1) % parts.length));
    },
  };
}

const VIZ_FUNNEL = { row: 50, gap: 6, min: 0.3 };

/** funnel: centred stages that narrow; widths follow the values when every stage has one. */
function vizDrawFunnel(visual, width) {
  const items = list(visual.items);
  const values = items.map((item) => (item && typeof item.value === 'number' ? item.value : null));
  const numeric = values.length > 0 && values.every((v) => v !== null);
  const max = numeric ? Math.max(...values, 1) : 1;
  const share = (i) => {
    if (i >= items.length) return null;
    if (numeric) return Math.max(VIZ_FUNNEL.min, values[i] / max);
    return 1 - (i * (1 - 0.45)) / Math.max(items.length - 1, 1);
  };
  const cx = width / 2;
  const parts = items.map((item, i) => {
    const top = 1 + i * (VIZ_FUNNEL.row + VIZ_FUNNEL.gap);
    const wTop = share(i) * (width - 2);
    const nextShare = share(i + 1);
    const wBottom = (nextShare === null ? share(i) * 0.9 : Math.min(share(i), nextShare)) * (width - 2);
    const shape = s('path', {
      class: 'viz-box',
      d: `M${cx - wTop / 2},${top} H${cx + wTop / 2} L${cx + wBottom / 2},${top + VIZ_FUNNEL.row} H${cx - wBottom / 2} Z`,
    });
    const hasValue = values[i] !== null;
    const lines = vizWrap(vizItemLabel(item), vizChars(wBottom - 20), hasValue ? 1 : 2);
    const prev = i > 0 ? values[i - 1] : null;
    const kept = hasValue && typeof prev === 'number' && prev > 0 ? `${Math.round((values[i] / prev) * 100)}% of the stage before` : null;
    return vizPart([
      shape,
      vizText(lines, { x: cx, y: top + VIZ_FUNNEL.row / 2 - (hasValue ? 8 : 0), anchor: 'middle' }),
      hasValue && s('text', { class: 'viz-value', x: cx, y: top + VIZ_FUNNEL.row / 2 + 11, 'text-anchor': 'middle', 'dominant-baseline': 'central' }, values[i].toLocaleString('en')),
    ], {
      label: vizItemLabel(item),
      detail: vizItemDetail(item),
      kicker: `Stage ${i + 1} of ${items.length}`,
      facts: [['Value', hasValue ? values[i].toLocaleString('en') : null], ['Kept', kept]],
    });
  });
  return { nodes: [], parts, height: items.length * (VIZ_FUNNEL.row + VIZ_FUNNEL.gap) };
}

// ---- chapters/viz-graph.js ----
// Visual kinds with links between parts: state (a state machine) and
// hierarchy (a tree). See viz-core.js for the drawer contract.

const VIZ_STATE = { boxH: 46, rowSlot: 128, level: 22, label: 11.5, vGap: 34 };

// States in reading order: from the first state along its transitions,
// then any the walk did not reach, in data order.
function vizStateOrder(states, transitions) {
  const ids = states.map((st) => st.id);
  if (!ids.length) return [];
  const seen = new Set([ids[0]]);
  const queue = [ids[0]];
  while (queue.length) {
    const id = queue.shift();
    transitions.filter((t) => t.from === id && ids.includes(t.to) && !seen.has(t.to)).forEach((t) => {
      seen.add(t.to);
      queue.push(t.to);
    });
  }
  return [...ids.filter((id) => seen.has(id)), ...ids.filter((id) => !seen.has(id))];
}

// Levels for arcs over [from, to] positions: the shortest arcs sit lowest,
// and two arcs whose spans overlap never share a level.
function vizArcLevels(spans) {
  const order = spans.map((sp, i) => ({ i, lo: Math.min(sp[0], sp[1]), hi: Math.max(sp[0], sp[1]) }))
    .sort((a, b) => (a.hi - a.lo) - (b.hi - b.lo) || a.lo - b.lo);
  const levels = new Array(spans.length).fill(1);
  const taken = [];
  order.forEach((arc) => {
    let level = Math.max(1, arc.hi - arc.lo);
    const clash = (l) => taken.some((o) => o.level === l && arc.lo <= o.hi && o.lo <= arc.hi && !(arc.lo === o.hi || o.lo === arc.hi));
    while (clash(level)) level += 1;
    taken.push({ ...arc, level });
    levels[arc.i] = level;
  });
  return levels;
}

function vizRelationList(items) {
  if (!items.length) return null;
  return h('ul', { class: 'viz-rel' }, items.map((item) => h('li', null, softBreaks(item))));
}

// Points along a cubic or a straight segment, to test labels against lines.
function vizCubic(p0, p1, p2, p3, n = 40) {
  return Array.from({ length: n + 1 }, (_, k) => {
    const t = k / n;
    const u = 1 - t;
    return [u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0],
      u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1]];
  });
}

function vizSegment(p0, p1, n = 16) {
  return Array.from({ length: n + 1 }, (_, k) => [p0[0] + ((p1[0] - p0[0]) * k) / n, p0[1] + ((p1[1] - p0[1]) * k) / n]);
}

function vizRectsMeet(a, b, pad = 0) {
  return a.x < b.x + b.w + pad && b.x < a.x + a.w + pad && a.y < b.y + b.h + pad && b.y < a.y + a.h + pad;
}

function vizRectHasPoint(r, points, pad = 0) {
  return points.some(([x, y]) => x > r.x - pad && x < r.x + r.w + pad && y > r.y - pad && y < r.y + r.h + pad);
}

const VIZ_PILL = { padX: 6, h: 18 };

/**
 * Place each label off every stroke: try spots moving out from its anchor
 * and take the first that clears all paths, boxes and placed labels.
 * Each wanted label is { key, value, x, y, dx, dy, chars }; (dx, dy) points outward.
 */
function vizPlaceLabels(wanted, { paths, boxes, width, size }) {
  const placed = [];
  wanted.forEach((want) => {
    const value = vizWrap(want.value, want.chars, 1)[0];
    const w = vizTextWidth(value, size) + VIZ_PILL.padX * 2;
    const spot = (along, side) => {
      const cx = want.x + want.dx * along + side;
      const cy = want.y + want.dy * along;
      return { x: Math.min(Math.max(cx - w / 2, 1), width - w - 1), y: cy - VIZ_PILL.h / 2, w, h: VIZ_PILL.h };
    };
    const tries = [];
    for (let along = 0; along <= 96; along += 6) [0, -w * 0.6, w * 0.6, -w * 1.2, w * 1.2].forEach((side) => tries.push(spot(along, side)));
    const clear = (r) => !paths.some((p) => vizRectHasPoint(r, p.points, 3))
      && !boxes.some((b) => vizRectsMeet(r, b, 3)) && !placed.some((o) => vizRectsMeet(r, o.rect, 3));
    placed.push({ key: want.key, value, rect: tries.find(clear) || tries[0] });
  });
  return placed;
}

function vizLabelPill(item) {
  const { rect, value } = item;
  return s('g', { class: 'viz-edge-tag' },
    s('rect', { class: 'viz-edge-pill', x: rect.x + 0.5, y: rect.y + 0.5, width: rect.w - 1, height: rect.h - 1 }),
    s('text', { class: 'viz-edge-label', x: rect.x + rect.w / 2, y: rect.y + rect.h / 2, 'text-anchor': 'middle', 'dominant-baseline': 'central' }, value));
}

// Row layout: boxes across; forward arcs above, backward below, each side on
// its own levels (longer spans further out); self-loops in the gap beside
// their box, which no arc enters (arcs use box tops and bottoms).
function vizStateRow(order, transitions, width, top) {
  const pos = new Map(order.map((id, i) => [id, i]));
  const slot = width / order.length;
  const boxW = Math.min(slot - 32, 170);
  const boxes = new Map(order.map((id, i) => [id, { x: i * slot + (slot - boxW) / 2, y: top, w: boxW, h: VIZ_STATE.boxH }]));
  const ahead = (tr) => pos.get(tr.to) > pos.get(tr.from);
  const above = transitions.filter((tr) => tr.from !== tr.to && ahead(tr));
  const below = transitions.filter((tr) => tr.from !== tr.to && !ahead(tr));
  const levelsAbove = vizArcLevels(above.map((tr) => [pos.get(tr.from), pos.get(tr.to)]));
  const levelsBelow = vizArcLevels(below.map((tr) => [pos.get(tr.from), pos.get(tr.to)]));
  const geo = transitions.map((tr) => {
    const a = boxes.get(tr.from);
    const b = boxes.get(tr.to);
    if (tr.from === tr.to) {
      const r = a.x + a.w;
      const p = [[r, a.y + 13], [r + 24, a.y + 6], [r + 24, a.y + a.h - 6], [r + 3, a.y + a.h - 13]];
      return { tr, d: `M${p[0]} C${p[1]} ${p[2]} ${p[3]}`, points: vizCubic(...p), anchor: { x: r + 12, y: a.y + a.h + 14, dx: 0, dy: 1 } };
    }
    const forward = ahead(tr);
    const level = forward ? levelsAbove[above.indexOf(tr)] : levelsBelow[below.indexOf(tr)];
    const lift = (12 + level * VIZ_STATE.level) * 1.33;
    const x1 = a.x + a.w / 2 + (forward ? a.w * 0.18 : -a.w * 0.18);
    const x2 = b.x + b.w / 2 + (forward ? -b.w * 0.18 : b.w * 0.18);
    const y = forward ? a.y : a.y + a.h;
    const cy = forward ? y - lift : y + lift;
    const p = [[x1, y], [x1, cy], [x2, cy], [x2, y + (forward ? -3 : 3)]];
    const apex = forward ? y - lift * 0.75 : y + lift * 0.75;
    return { tr, d: `M${p[0]} C${p[1]} ${p[2]} ${p[3]}`, points: vizCubic(...p), anchor: { x: (x1 + x2) / 2, y: apex + (forward ? -12 : 12), dx: 0, dy: forward ? -1 : 1 } };
  });
  const down = Math.max(0, ...levelsBelow);
  return { boxes, geo, chars: vizChars(Math.max(slot * 1.4, 80), VIZ_STATE.label), floor: top + VIZ_STATE.boxH + (down ? 26 + down * VIZ_STATE.level : 8) };
}

function vizStatePath(d, marker) {
  return s('path', { class: 'viz-link', d, 'marker-end': `url(#${marker}-rest)`, 'data-marker': marker });
}

// Row: lay out and place labels; lay out again lower when anything would leave the top.
function vizStateRowDraw(order, transitions, width, marker) {
  let top = 40;
  let layout;
  let placed;
  for (let pass = 0; pass < 3; pass += 1) {
    layout = vizStateRow(order, transitions, width, top);
    placed = vizPlaceLabels(layout.geo.filter((g) => text(g.tr.label)).map((g) => ({ key: g, value: g.tr.label, ...g.anchor, chars: layout.chars })),
      { paths: layout.geo, boxes: [...layout.boxes.values()], width, size: VIZ_STATE.label });
    const highest = Math.min(top, ...placed.map((p) => p.rect.y), ...layout.geo.flatMap((g) => g.points.map((pt) => pt[1])));
    if (highest >= 4) break;
    top += 4 - highest;
  }
  const links = [];
  const geometry = { paths: [], labels: [] };
  layout.geo.forEach((g) => {
    const item = placed.find((p) => p.key === g);
    links.push({ t: g.tr, path: vizStatePath(g.d, marker), label: item ? vizLabelPill(item) : null });
    geometry.paths.push({ key: g.tr, points: g.points });
    if (item) geometry.labels.push({ key: g.tr, rect: item.rect, onLine: false });
  });
  const height = Math.max(layout.floor, ...placed.map((p) => p.rect.y + p.rect.h + 4), ...layout.geo.flatMap((g) => g.points.map((pt) => pt[1] + 4)));
  return { links, geometry, boxes: layout.boxes, height, legend: null };
}

// Column geometry: self-loops in their own lane on the left; next-door steps
// down are straight; every other transition bends right on its own level.
function vizStateColumn(order, transitions, width) {
  const pos = new Map(order.map((id, i) => [id, i]));
  const lane = 30;
  const boxW = Math.min(200, Math.max(120, Math.round(width * 0.42)));
  const boxes = new Map(order.map((id, i) => [id, { x: lane, y: 1 + i * (VIZ_STATE.boxH + VIZ_STATE.vGap), w: boxW, h: VIZ_STATE.boxH }]));
  const right = lane + boxW;
  const straight = (tr) => pos.get(tr.to) - pos.get(tr.from) === 1;
  const bends = transitions.filter((tr) => tr.from !== tr.to && !straight(tr));
  const levels = vizArcLevels(bends.map((tr) => [pos.get(tr.from), pos.get(tr.to)]));
  const step = Math.min(VIZ_STATE.level, Math.max(18, (width - right - 24) / Math.max(1, ...levels)));
  const geo = transitions.map((tr) => {
    const a = boxes.get(tr.from);
    const b = boxes.get(tr.to);
    if (tr.from === tr.to) {
      const p = [[a.x, a.y + 12], [a.x - 26, a.y + 4], [a.x - 26, a.y + a.h - 4], [a.x - 3, a.y + a.h - 12]];
      return { tr, p, points: vizCubic(...p), badge: [a.x - 19, a.y + a.h / 2] };
    }
    if (straight(tr)) {
      const p = [[a.x + a.w / 2, a.y + a.h], [b.x + b.w / 2, b.y - 3]];
      return { tr, p, points: vizSegment(...p), badge: [a.x + a.w / 2, (a.y + a.h + b.y) / 2] };
    }
    const bulge = right + 8 + levels[bends.indexOf(tr)] * step;
    const forward = pos.get(tr.to) > pos.get(tr.from);
    const y1 = a.y + a.h / 2 + (forward ? 8 : -8);
    const y2 = b.y + b.h / 2 + (forward ? -8 : 8);
    const reach = right + (bulge - right) * 1.33;
    const p = [[right, y1], [reach, y1], [reach, y2], [right + 3, y2]];
    return { tr, p, points: vizCubic(...p), badge: [bulge, (y1 + y2) / 2] };
  });
  return { boxes, geo, height: order.length * (VIZ_STATE.boxH + VIZ_STATE.vGap) - VIZ_STATE.vGap + 2 };
}

// Column: labels would cross the arcs, so each arc gets a numbered badge on its
// own line and the key under the drawing spells it out.
function vizStateColumnDraw(order, transitions, width, marker, label) {
  const layout = vizStateColumn(order, transitions, width);
  const links = [];
  const geometry = { paths: [], labels: [] };
  layout.geo.forEach(({ tr, p, points, badge: [bx, by] }, k) => {
    const d = p.length === 2 ? `M${p[0]} L${p[1]}` : `M${p[0]} C${p[1]} ${p[2]} ${p[3]}`;
    const badge = s('g', { class: 'viz-badge' }, s('circle', { cx: bx, cy: by, r: 8 }),
      s('text', { x: bx, y: by, 'text-anchor': 'middle', 'dominant-baseline': 'central' }, String(k + 1)));
    links.push({ t: tr, path: vizStatePath(d, marker), label: badge });
    geometry.paths.push({ key: tr, points });
    geometry.labels.push({ key: tr, rect: { x: bx - 8, y: by - 8, w: 16, h: 16 }, onLine: true });
  });
  const legend = h('ol', { class: 'viz-key-list', 'aria-label': 'Transitions' }, transitions.map((tr, k) => h('li', null,
    h('span', { class: 'viz-key-n', 'aria-hidden': 'true' }, String(k + 1)),
    h('span', null, tr.label ? `${tr.label}: ` : '', softBreaks(`${label(tr.from)} → ${label(tr.to)}`)))));
  return { links, geometry, boxes: layout.boxes, height: layout.height, legend };
}

function vizStateParts(states, transitions, boxes, label) {
  return states.map((st, i) => {
    const box = boxes.get(st.id);
    const out = transitions.filter((t) => t.from === st.id);
    const into = transitions.filter((t) => t.to === st.id && t.from !== st.id);
    const describe = (t, other) => `${t.label ? `${t.label}: ` : ''}${label(other)}`;
    return vizPart([
      vizRoundRect(box.x, box.y, box.w, box.h),
      vizText(vizWrap(text(st.label, String(st.id)), vizChars(box.w - 18), 2), { x: box.x + box.w / 2, y: box.y + box.h / 2, anchor: 'middle' }),
    ], {
      label: text(st.label, String(st.id)),
      kicker: `State ${i + 1} of ${states.length}${out.length ? '' : ', an end state'}`,
      detail: out.length ? '' : 'Nothing leaves this state.',
      facts: [
        ['Can go to', vizRelationList(out.map((t) => describe(t, t.to)))],
        ['Reached from', vizRelationList(into.map((t) => describe(t, t.from)))],
      ],
      id: st.id,
    });
  });
}

// Selecting a state lights its transitions and the states they connect.
function vizStateHighlight(links, parts) {
  return (index) => {
    const id = index === null ? null : parts[index].id;
    links.forEach((l) => {
      const on = id !== null && (l.t.from === id || l.t.to === id);
      vizLinkOn(l.path, on);
      if (l.label) l.label.classList.toggle('is-on', on);
    });
    parts.forEach((part, i) => part.el.classList.toggle('is-related', id !== null && i !== index
      && links.some((l) => (l.t.from === id && l.t.to === part.id) || (l.t.to === id && l.t.from === part.id))));
  };
}

/** state: boxes in a row (wide) or a column (narrow); transitions as arcs. */
function vizDrawState(visual, width, marker) {
  const states = list(visual.states).filter((st) => st && st.id !== undefined);
  const transitions = list(visual.transitions).filter((t) => t && states.some((st) => st.id === t.from) && states.some((st) => st.id === t.to));
  const order = vizStateOrder(states, transitions);
  const label = (id) => text((states.find((st) => st.id === id) || {}).label, String(id));
  const drawn = width / Math.max(order.length, 1) >= VIZ_STATE.rowSlot
    ? vizStateRowDraw(order, transitions, width, marker)
    : vizStateColumnDraw(order, transitions, width, marker, label);
  const parts = vizStateParts(states, transitions, drawn.boxes, label);
  return {
    nodes: [drawn.links.map((l) => l.path), drawn.links.map((l) => l.label)],
    parts,
    height: drawn.height,
    legend: drawn.legend,
    // For tests: every edge as points, every label as a box, every state box.
    geometry: { ...drawn.geometry, boxes: [...drawn.boxes.values()] },
    highlight: vizStateHighlight(drawn.links, parts),
  };
}

const VIZ_TREE = { boxH: 44, level: 40, slot: 112, row: 40, rowGap: 8, indent: 22 };

// The tree as data: parents, children, depth-first order from the roots, leaves.
function vizTreeModel(visual) {
  const nodes = list(visual.nodes).filter((n) => n && n.id !== undefined);
  const ids = new Set(nodes.map((n) => n.id));
  const parentOf = (n) => (n.parent !== undefined && ids.has(n.parent) && n.parent !== n.id ? n.parent : null);
  const children = (id) => nodes.filter((n) => parentOf(n) === id);
  const roots = nodes.filter((n) => parentOf(n) === null);
  const depth = new Map();
  const walkOrder = [];
  const walk = (n, d) => {
    if (depth.has(n.id)) return;
    depth.set(n.id, d);
    walkOrder.push(n);
    children(n.id).forEach((c) => walk(c, d + 1));
  };
  roots.forEach((r) => walk(r, 0));
  const leaves = walkOrder.filter((n) => !children(n.id).length).map((n) => n.id);
  return { nodes, parentOf, children, roots, depth, walkOrder, leaves };
}

// Top down: leaves share the width, each parent centred over its children.
function vizTreeTopDown(model, width) {
  const { nodes, parentOf, children, roots, depth, leaves } = model;
  const slot = width / leaves.length;
  const boxW = Math.min(slot - 10, 180);
  const centre = new Map();
  const place = (n) => {
    const kids = children(n.id).filter((c) => depth.get(c.id) === depth.get(n.id) + 1);
    if (!kids.length) centre.set(n.id, (leaves.indexOf(n.id) + 0.5) * slot);
    else {
      kids.forEach(place);
      centre.set(n.id, (centre.get(kids[0].id) + centre.get(kids[kids.length - 1].id)) / 2);
    }
  };
  roots.forEach(place);
  const boxes = new Map(nodes.map((n) => [n.id, { x: (centre.get(n.id) ?? width / 2) - boxW / 2, y: 1 + (depth.get(n.id) ?? 0) * (VIZ_TREE.boxH + VIZ_TREE.level), w: boxW, h: VIZ_TREE.boxH }]));
  const links = nodes.filter((n) => parentOf(n) !== null).map((n) => {
    const a = boxes.get(parentOf(n));
    const b = boxes.get(n.id);
    const mid = a.y + a.h + VIZ_TREE.level / 2;
    return { from: parentOf(n), to: n.id, d: `M${a.x + a.w / 2},${a.y + a.h} V${mid} H${b.x + b.w / 2} V${b.y}` };
  });
  const maxDepth = Math.max(0, ...depth.values());
  return { boxes, links, height: (maxDepth + 1) * (VIZ_TREE.boxH + VIZ_TREE.level) - VIZ_TREE.level + 2 };
}

// Outline: one row per node in depth-first order, indented by depth.
function vizTreeOutline(model, width) {
  const boxes = new Map();
  let y = 1;
  model.walkOrder.forEach((n) => {
    const x = 1 + model.depth.get(n.id) * VIZ_TREE.indent;
    boxes.set(n.id, { x, y, w: width - x - 1, h: VIZ_TREE.row });
    y += VIZ_TREE.row + VIZ_TREE.rowGap;
  });
  const links = model.nodes.filter((n) => model.parentOf(n) !== null && boxes.has(n.id)).map((n) => {
    const a = boxes.get(model.parentOf(n));
    const b = boxes.get(n.id);
    return { from: model.parentOf(n), to: n.id, d: `M${a.x + 11},${a.y + a.h} V${b.y + b.h / 2} H${b.x}` };
  });
  return { boxes, links, height: y - VIZ_TREE.rowGap + 1 };
}

function vizTreeParts(model, boxes, topDown) {
  const labelOf = (id) => text((model.nodes.find((n) => n.id === id) || {}).label, String(id));
  return model.nodes.filter((n) => boxes.has(n.id)).map((n) => {
    const box = boxes.get(n.id);
    const p = model.parentOf(n);
    const lines = vizWrap(text(n.label, String(n.id)), vizChars(box.w - 20), topDown ? 2 : 1);
    return vizPart([
      vizRoundRect(box.x, box.y, box.w, box.h),
      vizText(lines, { x: topDown ? box.x + box.w / 2 : box.x + 12, y: box.y + box.h / 2, anchor: topDown ? 'middle' : 'start' }),
    ], {
      label: text(n.label, String(n.id)),
      kicker: p === null ? 'The whole' : `Level ${model.depth.get(n.id) + 1}`,
      facts: [['Part of', p !== null ? labelOf(p) : null], ['Made of', vizRelationList(model.children(n.id).map((k) => labelOf(k.id)))]],
      id: n.id,
    });
  });
}

// Selecting a node lights its line up to the root and the links to its children.
function vizTreeHighlight(model, links, parts) {
  return (index) => {
    const id = index === null ? null : parts[index].id;
    const line = new Set();
    for (let at = id; at !== null && at !== undefined;) {
      const node = model.nodes.find((n) => n.id === at);
      const up = node ? model.parentOf(node) : null;
      if (up === null) break;
      line.add(`${up}>${at}`);
      at = up;
    }
    links.forEach((l) => l.path.classList.toggle('is-on', line.has(`${l.from}>${l.to}`) || (id !== null && l.from === id)));
    parts.forEach((part) => part.el.classList.toggle('is-related', id !== null && part.id !== id
      && (links.some((l) => l.from === id && l.to === part.id) || [...line].some((key) => key.startsWith(`${part.id}>`)))));
  };
}

/** hierarchy: a top-down tree when its leaves fit, else an indented outline. */
function vizDrawHierarchy(visual, width) {
  const model = vizTreeModel(visual);
  const topDown = width / Math.max(model.leaves.length, 1) >= VIZ_TREE.slot;
  const layout = topDown ? vizTreeTopDown(model, width) : vizTreeOutline(model, width);
  const links = layout.links.map((l) => ({ ...l, path: s('path', { class: 'viz-link', d: l.d }) }));
  const parts = vizTreeParts(model, layout.boxes, topDown);
  return { nodes: links.map((l) => l.path), parts, height: layout.height, highlight: vizTreeHighlight(model, links, parts) };
}

// ---- chapters/viz-grid.js ----
// Visual kinds laid out on a plane: compare (a grid of marks), beforeAfter
// (two panels), quadrant (a 2x2) and venn (2 or 3 overlapping sets).
// See viz-core.js for the drawer contract.

const VIZ_COMPARE = { minCol: 84, row: 40, mark: 5.5, head: 15 };

function vizIsPartial(value) {
  return typeof value === 'string' && value.trim().toLowerCase() === 'partial';
}

function vizValueText(value) {
  if (value === true) return 'Yes';
  if (value === false) return 'No';
  if (typeof value === 'number') return value.toLocaleString('en');
  return text(value, 'Not given');
}

// One cell mark: a filled dot (yes), a ring (no), a half dot (partial), or the value as text.
function vizMark(value, x, y, room) {
  const r = VIZ_COMPARE.mark;
  if (value === true) return s('circle', { class: 'viz-yes', cx: x, cy: y, r });
  if (value === false) return s('circle', { class: 'viz-no', cx: x, cy: y, r: r - 0.5 });
  if (vizIsPartial(value)) {
    return s('g', { class: 'viz-half' }, s('circle', { class: 'viz-no', cx: x, cy: y, r: r - 0.5 }),
      s('path', { class: 'viz-yes', d: `M${x},${y - r} A${r},${r} 0 0 0 ${x},${y + r} Z` }));
  }
  return s('text', { class: 'viz-cell', x, y, 'text-anchor': 'middle', 'dominant-baseline': 'central' }, vizWrap(vizValueText(value), vizChars(room, 12), 1)[0]);
}

function vizCompareLegend(rows) {
  const values = rows.flatMap((row) => list(row.values));
  const keys = [
    values.includes(true) && ['is-yes', 'Yes'],
    values.includes(false) && ['is-no', 'No'],
    values.some(vizIsPartial) && ['is-half', 'Partly'],
  ].filter(Boolean);
  if (!keys.length) return null;
  return h('p', { class: 'viz-legend' }, keys.map(([cls, label]) => h('span', null, h('i', { class: `viz-key ${cls}`, 'aria-hidden': 'true' }), label)));
}

/** compare: columns across, one row of marks per criterion. Narrow: the label sits above its marks. */
function vizDrawCompare(visual, width) {
  const columns = list(visual.columns).map((c) => text(c, '?'));
  const rows = list(visual.rows).filter((row) => row && typeof row === 'object');
  const cols = Math.max(columns.length, 1);
  const labelW = Math.min(260, Math.max(120, Math.round(width * 0.34)));
  const wide = (width - labelW) / cols >= VIZ_COMPARE.minCol;
  const gridX = wide ? labelW : 0;
  const colW = (width - gridX) / cols;
  const colX = (j) => gridX + colW * (j + 0.5);
  const heads = columns.map((c) => vizWrap(c, vizChars(colW - 8, 12), 3));
  const headH = Math.max(...heads.map((l) => l.length), 1) * VIZ_COMPARE.head + 14;
  const nodes = heads.map((lines, j) => vizText(lines, { x: colX(j), y: 4, cls: 'viz-col-head', anchor: 'middle', lineHeight: VIZ_COMPARE.head, middle: false }));
  nodes.push(s('line', { class: 'viz-rule', x1: 0, x2: width, y1: headH - 4.5, y2: headH - 4.5 }));
  let y = headH;
  const parts = rows.map((row, i) => {
    const labelLines = vizWrap(text(row.label), vizChars((wide ? labelW : width) - 16), 2);
    const labelH = labelLines.length * VIZ_LINE;
    const height = wide ? Math.max(VIZ_COMPARE.row, labelH + 16) : labelH + 44;
    const top = y;
    y += height + 2;
    const markY = wide ? top + height / 2 : top + labelH + 24;
    const values = list(row.values);
    return vizPart([
      s('rect', { class: 'viz-row-hit', x: 0.5, y: top + 0.5, width: width - 1, height: height - 1 }),
      vizText(labelLines, { x: 10, y: wide ? top + height / 2 : top + 10 + (labelH - VIZ_LINE) / 2 }),
      columns.map((_, j) => vizMark(values[j], colX(j), markY, colW - 8)),
    ], {
      label: text(row.label),
      kicker: `Row ${i + 1} of ${rows.length}`,
      facts: columns.map((c, j) => [c, vizValueText(values[j])]),
    });
  });
  return { nodes, parts, height: y + 1, legend: vizCompareLegend(rows) };
}

const VIZ_PANEL = { head: 34, item: 40, gap: 6, pad: 10, between: 44, wideAt: 560 };

// Both panels and every item box: side by side when wide, stacked when narrow.
// An item whose label is on both sides stays; otherwise it is gone (before) or new (after).
function vizBeforeAfterLayout(visual, width) {
  const sides = [['before', 'Before'], ['after', 'After']].map(([key, name]) => ({
    key, name, items: list(visual[key] && visual[key].items).filter((item) => vizItemLabel(item)),
  }));
  const wide = width >= VIZ_PANEL.wideAt;
  const panelW = wide ? (width - VIZ_PANEL.between) / 2 : width;
  const sets = sides.map((side) => new Set(side.items.map((item) => vizItemLabel(item).trim().toLowerCase())));
  const panels = [];
  const items = [];
  let nextTop = 1;
  sides.forEach((side, sideIndex) => {
    const x = wide ? sideIndex * (panelW + VIZ_PANEL.between) : 0;
    const top = wide ? 1 : nextTop;
    let y = top + VIZ_PANEL.head;
    side.items.forEach((item, i) => {
      const label = vizItemLabel(item);
      const lines = vizWrap(label, vizChars(panelW - VIZ_PANEL.pad * 2 - 34), 2);
      const itemH = Math.max(VIZ_PANEL.item, lines.length * VIZ_LINE + 14);
      items.push({ item, label, lines, side, sideIndex, i, shared: sets[1 - sideIndex].has(label.trim().toLowerCase()), box: { x: x + VIZ_PANEL.pad, y, w: panelW - VIZ_PANEL.pad * 2, h: itemH } });
      y += itemH + VIZ_PANEL.gap;
    });
    const bottom = y - VIZ_PANEL.gap + VIZ_PANEL.pad;
    panels.push({ name: side.name, x, top, bottom });
    nextTop = bottom + VIZ_PANEL.between;
  });
  const lowest = Math.max(0, ...panels.map((p) => p.bottom));
  const arrow = wide
    ? `M${panelW + 10},${Math.min(lowest, 120) / 2 + 10} H${panelW + VIZ_PANEL.between - 10}`
    : `M${width / 2},${panels[0].bottom + 8} V${panels[0].bottom + VIZ_PANEL.between - 10}`;
  return { panelW, panels, items, arrow, height: (wide ? lowest : nextTop - VIZ_PANEL.between) + 1 };
}

function vizBeforeAfterLegend(visual, moved) {
  const notes = list(visual.notes).filter((note) => typeof note === 'string' && note.trim());
  if (!notes.length && !moved) return false;
  return h('div', { class: 'viz-notes' },
    moved && h('p', { class: 'viz-legend' }, h('span', null, h('b', { class: 'viz-key-glyph', 'aria-hidden': 'true' }, '+'), 'New'), h('span', null, h('b', { class: 'viz-key-glyph', 'aria-hidden': 'true' }, '−'), 'Gone')),
    notes.length > 0 && h('ul', { class: 'viz-note-list', 'aria-label': 'Notes' }, notes.map((note) => h('li', null, softBreaks(note)))));
}

/** beforeAfter: two panels with what moved; items in one side only get + or −. */
function vizDrawBeforeAfter(visual, width, marker) {
  const layout = vizBeforeAfterLayout(visual, width);
  const nodes = layout.panels.flatMap((panel) => [vizRoundRect(panel.x, panel.top, layout.panelW, panel.bottom - panel.top, 'viz-panel'),
    s('text', { class: 'viz-panel-head', x: panel.x + VIZ_PANEL.pad + 2, y: panel.top + VIZ_PANEL.head / 2 + 2, 'dominant-baseline': 'central' }, panel.name.toUpperCase())]);
  nodes.push(s('path', { class: 'viz-link is-flow', d: layout.arrow, 'marker-end': `url(#${marker}-rest)` }));
  const parts = layout.items.map(({ item, label, lines, side, sideIndex, i, shared, box }) => {
    const glyph = shared ? '' : sideIndex === 0 ? '−' : '+';
    return vizPart([
      vizRoundRect(box.x, box.y, box.w, box.h),
      glyph && s('text', { class: 'viz-glyph', x: box.x + 14, y: box.y + box.h / 2, 'text-anchor': 'middle', 'dominant-baseline': 'central' }, glyph),
      vizText(lines, { x: box.x + 28, y: box.y + box.h / 2 }),
    ], {
      label,
      detail: vizItemDetail(item),
      kicker: `${side.name}, ${i + 1} of ${side.items.length}`,
      facts: [['Change', shared ? 'Stays the same' : sideIndex === 0 ? 'Gone after the change' : 'New after the change']],
    });
  });
  return { nodes, parts, height: layout.height, legend: vizBeforeAfterLegend(visual, layout.items.some((it) => !it.shared)) };
}

const VIZ_QUAD = { axis: 30, foot: 38, dot: 6, label: 12.5 };

function vizLevel(value) {
  if (value < 0.34) return 'low';
  if (value > 0.66) return 'high';
  return 'middle';
}

/** quadrant: points on two axes from 0 (low, left, bottom) to 1. */
function vizDrawQuadrant(visual, width) {
  const axes = visual.axes && typeof visual.axes === 'object' ? visual.axes : {};
  const xName = text(axes.x, 'x');
  const yName = text(axes.y, 'y');
  const plotW = Math.min(width - VIZ_QUAD.axis - 2, 640);
  const plotH = Math.round(Math.min(Math.max(plotW * 0.72, 220), 440));
  const x0 = VIZ_QUAD.axis;
  const y0 = 8;
  const clamp = (v) => Math.min(Math.max(typeof v === 'number' ? v : 0.5, 0), 1);
  const nodes = [
    s('rect', { class: 'viz-plot', x: x0 + 0.5, y: y0 + 0.5, width: plotW - 1, height: plotH - 1 }),
    s('line', { class: 'viz-mid', x1: x0 + plotW / 2, x2: x0 + plotW / 2, y1: y0, y2: y0 + plotH }),
    s('line', { class: 'viz-mid', x1: x0, x2: x0 + plotW, y1: y0 + plotH / 2, y2: y0 + plotH / 2 }),
    s('text', { class: 'viz-axis', x: x0 + plotW / 2, y: y0 + plotH + 22, 'text-anchor': 'middle', 'dominant-baseline': 'central' }, `${vizWrap(xName, vizChars(plotW - 120, 12), 1)[0]} →`),
    s('text', { class: 'viz-axis-end', x: x0 + 2, y: y0 + plotH + 22, 'dominant-baseline': 'central' }, 'low'),
    s('text', { class: 'viz-axis-end', x: x0 + plotW - 2, y: y0 + plotH + 22, 'text-anchor': 'end', 'dominant-baseline': 'central' }, 'high'),
    s('text', { class: 'viz-axis', x: 0, y: 0, 'text-anchor': 'middle', 'dominant-baseline': 'central', transform: `translate(${x0 / 2 - 2} ${y0 + plotH / 2}) rotate(-90)` }, `${vizWrap(yName, vizChars(plotH - 40, 12), 1)[0]} →`),
  ];
  const points = list(visual.points).filter((p) => p && typeof p === 'object');
  // Labels go right of the dot, or left near the right edge; overlapping ones are nudged apart.
  const placed = points.map((p, i) => {
    const cx = x0 + clamp(p.x) * plotW;
    const cy = y0 + (1 - clamp(p.y)) * plotH;
    const right = clamp(p.x) < 0.6;
    const room = right ? x0 + plotW - cx - 14 : cx - x0 - 14;
    const label = vizWrap(text(p.label), vizChars(room, VIZ_QUAD.label), 1)[0];
    return { i, p, cx, cy, right, label, ly: cy, w: vizTextWidth(label, VIZ_QUAD.label) };
  });
  [...placed].sort((a, b) => a.ly - b.ly).forEach((a, k, sorted) => {
    sorted.slice(0, k).forEach((b) => {
      const ax = a.right ? [a.cx, a.cx + a.w + 12] : [a.cx - a.w - 12, a.cx];
      const bx = b.right ? [b.cx, b.cx + b.w + 12] : [b.cx - b.w - 12, b.cx];
      if (ax[0] < bx[1] && bx[0] < ax[1] && Math.abs(a.ly - b.ly) < 17) a.ly = Math.min(b.ly + 17, y0 + plotH - 8);
    });
  });
  const parts = placed.map(({ i, p, cx, cy, right, label, ly }) => vizPart([
    s('circle', { class: 'viz-dot', cx, cy, r: VIZ_QUAD.dot }),
    s('text', { class: 'viz-point-label', x: right ? cx + 11 : cx - 11, y: ly, 'text-anchor': right ? 'start' : 'end', 'dominant-baseline': 'central' }, label),
  ], {
    label: text(p.label),
    kicker: `Point ${i + 1} of ${points.length}`,
    facts: [[xName, `${vizLevel(clamp(p.x))} (${clamp(p.x).toFixed(2)})`], [yName, `${vizLevel(clamp(p.y))} (${clamp(p.y).toFixed(2)})`]],
  }));
  return { nodes, parts, height: y0 + plotH + VIZ_QUAD.foot + 2 };
}

const VIZ_VENN = { top: 26, label: 12 };

// Circle centres and radius for 2 or 3 sets.
function vizVennLayout(count, width) {
  if (count >= 3) {
    const r = Math.min((width - 12) / 3.1, 128);
    const cy = r + VIZ_VENN.top;
    return { r, centres: [[width / 2 - 0.58 * r, cy], [width / 2 + 0.58 * r, cy], [width / 2, cy + 0.98 * r]], height: cy + 1.98 * r + VIZ_VENN.top };
  }
  const r = Math.min((width - 12) / 3.2, 140);
  const cy = r + VIZ_VENN.top;
  return { r, centres: [[width / 2 - 0.6 * r, cy], [width / 2 + 0.6 * r, cy]], height: cy + r + 6 };
}

// The middle of the region for the sets in `inside` (indexes): the mean of
// those centres, pushed away from the centre of the whole drawing.
function vizRegionCentre(layout, inside) {
  const mean = (pts) => pts.reduce((acc, p) => [acc[0] + p[0] / pts.length, acc[1] + p[1] / pts.length], [0, 0]);
  const all = mean(layout.centres);
  if (inside.length === layout.centres.length) return all;
  const own = mean(inside.map((i) => layout.centres[i]));
  const push = inside.length === 1 ? 0.95 : layout.centres.length === 2 ? 0 : 0.85;
  return [own[0] + (own[0] - all[0]) * push, own[1] + (own[1] - all[1]) * push];
}

// Where each item sits: the region of its sets, items of one region stacked
// around its centre, up to two lines each, kept inside the drawing.
function vizVennPlace(items, sets, layout, width) {
  const LINE = 14;
  const regionOf = (item) => sets.map((set, i) => (list(item.in).includes(set.id) ? i : -1)).filter((i) => i >= 0);
  const groups = new Map();
  items.forEach((item, i) => {
    const key = regionOf(item).join(',');
    groups.set(key, [...(groups.get(key) || []), i]);
  });
  const roomFor = (inside) => layout.r * (inside.length === 1 ? 0.92 : inside.length === sets.length ? 0.66 : 0.8);
  const wrapped = items.map((item) => vizWrap(text(item.label), vizChars(roomFor(regionOf(item)), VIZ_VENN.label), 2));
  const heightOf = (i) => wrapped[i].length * LINE + 4;
  return items.map((item, i) => {
    const inside = regionOf(item);
    const group = groups.get(inside.join(','));
    const total = group.reduce((sum, j) => sum + heightOf(j) + 3, -3);
    const before = group.slice(0, group.indexOf(i)).reduce((sum, j) => sum + heightOf(j) + 3, 0);
    const [cx, ry] = inside.length ? vizRegionCentre(layout, inside) : [width / 2, layout.height - 10];
    const top = ry - total / 2 + before;
    const w = Math.min(width - 2, Math.max(...wrapped[i].map((line) => vizTextWidth(line, VIZ_VENN.label))) + 12);
    const x = Math.min(Math.max(cx, w / 2 + 1), width - w / 2 - 1);
    return { item, inside, lines: wrapped[i], line: LINE, chip: { x: x - w / 2, y: top, w, h: heightOf(i) }, x, y: top + heightOf(i) / 2 };
  });
}

/** venn: 2 or 3 circles; each item sits in the region of the sets it belongs to. */
function vizDrawVenn(visual, width) {
  const sets = list(visual.sets).filter((set) => set && set.id !== undefined).slice(0, 3);
  const layout = vizVennLayout(sets.length, width);
  const circles = sets.map((set, i) => s('circle', { class: 'viz-set', cx: layout.centres[i][0], cy: layout.centres[i][1], r: layout.r }));
  const setLabels = sets.map((set, i) => {
    const [cx, cy] = layout.centres[i];
    return s('text', { class: 'viz-set-label', x: cx, y: i === 2 ? cy + layout.r + 14 : cy - layout.r - 12, 'text-anchor': 'middle', 'dominant-baseline': 'central' },
      vizWrap(text(set.label, String(set.id)), vizChars(sets.length === 2 ? layout.r * 1.6 : layout.r * 1.3, VIZ_VENN.label), 1)[0]);
  });
  const names = (keep) => sets.filter((_, j) => keep(j)).map((set) => text(set.label, String(set.id))).join(', ');
  const placed = vizVennPlace(list(visual.items).filter((item) => item && typeof item === 'object'), sets, layout, width);
  const parts = placed.map(({ item, inside, lines, line, chip, x, y }) => vizPart([
    s('rect', { class: 'viz-chip', x: chip.x, y: chip.y, width: chip.w, height: chip.h }),
    vizText(lines, { x, y, cls: 'viz-item-label', anchor: 'middle', lineHeight: line }),
  ], {
    label: text(item.label),
    kicker: inside.length > 1 ? `In ${inside.length} groups` : 'In one group',
    facts: [['In', names((j) => inside.includes(j))], ['Not in', names((j) => !inside.includes(j))]],
    inside,
  }));
  return {

// ---- chapters/visuals.js ----
// Chapter: visuals (diagrams[]). Pick a diagram, then pick its parts.
// Deep links: #visuals/<diagramId> and #visuals/<diagramId>/<part>, parts
// counted from 0 in the order of references/visuals.md.

function chDiagramId(diagram, index) {
  return text(diagram && typeof diagram.id === 'string' ? diagram.id : '', String(index));
}

function chVisualPick(diagram, i) {
  return h('button', { class: 'ch-pick', type: 'button', 'aria-pressed': 'false' },
    h('span', { class: 'ch-pick-top' }, h('span', null, String(i + 1).padStart(2, '0')), h('span', null, VIZ_KIND_NAMES[diagram.kind] || text(diagram.kind, 'Visual'))),
    h('span', { class: 'ch-pick-title' }, softBreaks(text(diagram.title, chDiagramId(diagram, i)))));
}

// Figures are drawn the first time they are shown, then kept. A part pick
// writes #visuals/<id>/<part> only while that figure is the one on show.
function chVisualFigures(diagrams, stage, isCurrent) {
  const figures = new Map();
  return {
    get(i) {
      if (!figures.has(i)) {
        const id = chDiagramId(diagrams[i], i);
        const figure = vizFigure(diagrams[i], {
          headingLevel: 'h2',
          onSelect: (part) => { if (isCurrent(i)) setDeepLink(part === null ? `visuals/${linkPart(id)}` : `visuals/${linkPart(id)}/${part}`); },
        });
        figures.set(i, figure);
        stage.append(figure.root);
      }
      return figures.get(i);
    },
    showOnly(i) { figures.forEach((f, j) => { f.root.hidden = j !== i; }); },
  };
}

/**
 * @param {object} data explainer data (reads data.diagrams)
 * @param {HTMLElement} mount the chapter body
 * @returns {{ open: (parts: string[]) => Element|null }|null}
 */
function chRenderVisuals(data, mount) {
  const diagrams = list(data.diagrams).filter((d) => d && typeof d === 'object');
  if (!diagrams.length) {
    mount.append(h('p', { class: 'empty' }, 'No diagrams in this explainer.'));
    return null;
  }
  const stage = h('div', { class: 'ch-viz-stage' });
  let current = 0;
  const figures = chVisualFigures(diagrams, stage, (i) => current === i);
  const picks = diagrams.map(chVisualPick);
  function show(i, { link = true } = {}) {
    current = i;
    const figure = figures.get(i);
    figures.showOnly(i);
    chMarkCurrent(picks, i);
    if (link) setDeepLink(`visuals/${linkPart(chDiagramId(diagrams[i], i))}`);
    return figure;
  }
  picks.forEach((pick, i) => pick.addEventListener('click', () => show(i)));
  chRoving(picks, { onMove: (i) => show(i) });
  show(0, { link: false });
  mount.append(h('div', { class: 'ch-visuals' },
    diagrams.length > 1 && h('div', { class: 'ch-pick-list', role: 'group', 'aria-label': 'Diagrams' }, picks),
    stage));
  return {
    open([id, part] = []) {
      const index = id === undefined ? -1 : diagrams.findIndex((d, i) => chDiagramId(d, i) === id);
      if (index < 0) return null;
      const figure = show(index, { link: false });
      return figure.select(chIndexPart(part, figure.count()), { silent: true }) || figure.root;
    },
  };
}

// ---- chapters/diff.js ----
// Chapter: diff. A bar chart of the files a change touches: one row per
// file with its status marker and +/- lines, linked to the map nodes it
// belongs to. Deep link: #diff/<path> (the path as one encoded segment).

const CH_LINES = /^\+(\d+) -(\d+)$/;

function chParseLines(value) {
  const match = typeof value === 'string' ? value.trim().match(CH_LINES) : null;
  return match ? { add: Number(match[1]), del: Number(match[2]) } : null;
}

function chDiffTotals(entries) {
  return entries.reduce((acc, entry) => {
    const lines = chParseLines(entry.lines);
    return { add: acc.add + (lines ? lines.add : 0), del: acc.del + (lines ? lines.del : 0) };
  }, { add: 0, del: 0 });
}

function chDiffBar(lines, max) {
  if (!lines) return h('span', { class: 'ch-bar is-empty' }, h('span', { class: 'ch-bar-none' }, 'lines not given'));
  const share = (n) => (max ? Math.max(n ? 0.02 : 0, n / max) : 0);
  return h('span', { class: 'ch-bar', 'aria-hidden': 'true' },
    h('span', { class: 'ch-bar-track' },
      h('i', { class: 'ch-bar-add', style: `--share:${share(lines.add)}` }),
      h('i', { class: 'ch-bar-del', style: `--share:${share(lines.del)}` })),
    h('span', { class: 'ch-bar-num' }, `+${lines.add} −${lines.del}`));
}

function chDiffRow(entry, max) {
  const lines = chParseLines(entry.lines);
  return h('button', {
    class: `ch-file is-${CH_STATUS_LABELS[entry.status] ? entry.status : 'modified'}`, type: 'button', 'aria-pressed': 'false', 'data-path': entry.path,
    'aria-label': `${entry.path}, ${CH_STATUS_LABELS[entry.status] || 'Changed'}${lines ? `, ${lines.add} added and ${lines.del} removed lines` : ''}${entry.key ? ', key file' : ''}`,
    style: `--size:${lines ? (lines.add + lines.del) / max : 0}`,
  },
  chStatusMark(entry.status),
  h('span', { class: 'ch-file-name' }, truncatable(h('span', { class: 'ch-file-path' }), entry.path, { mode: 'middle' }),
    entry.key && h('span', { class: 'tag tag-key' }, 'Key')),
  chDiffBar(lines, max));
}

function chDiffNodeLink(id, nodeIndex) {
  const node = nodeIndex.get(id);
  return h('li', null, h('a', { class: 'ch-node-link', href: `#map/${linkPart(id)}` },
    node && node.status && node.status !== 'unchanged' ? chStatusMark(node.status) : null,
    softBreaks(text(node && node.label, String(id)))));
}

function chDiffDetail(entry, nodeIndex) {
  const lines = chParseLines(entry.lines);
  return [
    h('div', { class: 'step-top' }, chStatusTag(entry.status), entry.key && tag('Key file', 'tag-key'), lines && h('span', { class: 'ch-bar-num' }, `+${lines.add} −${lines.del}`)),
    h('h3', { class: 'ch-detail-path' }, breakablePath(entry.path)),
    entry.status === 'renamed' && text(entry.from) && h('p', { class: 'ch-from' }, 'Was ', h('code', null, breakablePath(entry.from))),
    h('p', null, softBreaks(text(entry.summary, 'No summary yet.'))),
    list(entry.nodes).length > 0 && [h('div', { class: 'detail-label' }, 'Part of'), h('ul', { class: 'ch-node-links' }, list(entry.nodes).map((id) => chDiffNodeLink(id, nodeIndex)))],
  ];
}

// The totals, files per status, and the bar legend.
function chDiffSummary(entries) {
  const totals = chDiffTotals(entries);
  const counts = Object.keys(CH_STATUS_LABELS).filter((key) => key !== 'changed' && key !== 'unchanged')
    .map((key) => [key, entries.filter((e) => e.status === key).length]).filter(([, n]) => n > 0);
  return h('div', { class: 'ch-diff-summary' },
    h('p', { class: 'ch-diff-total' }, h('b', null, chCount(entries.length, 'file')), h('span', { class: 'ch-bar-num' }, `+${totals.add} −${totals.del}`)),
    h('ul', { class: 'ch-legend', 'aria-label': 'Files by status' }, counts.map(([key, n]) => h('li', null, chStatusMark(key), `${n} ${CH_STATUS_LABELS[key].toLowerCase()}`))),
    h('p', { class: 'ch-legend ch-legend-bars', 'aria-hidden': 'true' }, h('span', null, h('i', { class: 'ch-swatch is-add' }), 'Added lines'), h('span', null, h('i', { class: 'ch-swatch is-del' }), 'Removed lines')));
}

/**
 * @param {object} data explainer data (reads data.diff, data.nodes)

 */
function chRenderDiff(data, mount) {
  const entries = list(data.diff).filter((entry) => entry && typeof entry === 'object' && text(entry.path));

// Chapter: rollout. A stepped track: done steps filled, the next step ringed,
