name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: git config --global user.email ci@example.com && git config --global user.name CI
      - name: Keep the runner's real home untouched by any command
        run: echo "CONCEPT_EXPLAINER_HOME=$RUNNER_TEMP/concept-explainer-home" >> "$GITHUB_ENV"
      - run: npm run check
      - name: Every example stays valid under --strict
        run: |
          for file in examples/*.explainer.json; do
            node bin/concept-explainer.mjs validate "$file" --strict
          done
      - name: The old repo-explainer alias still runs
        run: node bin/repo-explainer.mjs presets
      - name: Built files are up to date
        # All four example pages and the gallery are committed; a rebuild must
        # change none of them and add no file.
        run: |
          for page in taskflow pr-cursor-paging proposal-live-updates concept-idempotency-keys gallery; do
            test -f "examples/$page.html" || { echo "examples/$page.html is missing"; exit 1; }
          done
          git status --porcelain -- examples/
          test -z "$(git status --porcelain -- examples/)"

  # The unit tests on Windows: paths, junction links, explorer.exe opening and
  # the library lock behave differently there.
  windows:
    runs-on: windows-latest
    # A guard, not a budget: the suite takes about a minute. A hang fails fast.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: git config --global user.email ci@example.com && git config --global user.name CI
      - name: Keep the runner's real home untouched by any command
        shell: bash
        run: echo "CONCEPT_EXPLAINER_HOME=$RUNNER_TEMP/concept-explainer-home" >> "$GITHUB_ENV"
      - name: Unit tests
        shell: bash
        run: node --test test/*.test.mjs
